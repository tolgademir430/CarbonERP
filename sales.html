<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Satışlar</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #d0d5dd;border-radius:9px;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.muted{color:#667085}.green{color:#087443;font-weight:900}.red{color:#b42318;font-weight:900}.amber{color:#b54708;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.value{font-size:23px;font-weight:900;margin-top:5px}.badge{padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}@media(max-width:800px){.cards{grid-template-columns:2fr 2fr}.wrap{padding:10px}.table{font-size:12px}}</style></head><body><div class="wrap"><div class="head"><div><h1>Satışlar</h1><p class="muted">CarbonERP satış kayıtları ve cari etkisi.</p></div></div><div class="cards" id="stats"></div><div class="card"><div class="toolbar"><input id="q" placeholder="Müşteri ara" oninput="render()"><input id="from" type="date" onchange="render()"><input id="to" type="date" onchange="render()"><select id="status" onchange="render()"><option value="all">Tüm durumlar</option><option value="completed">Tamamlanan</option><option value="cancelled">İptal</option></select></div></div><div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Tarih</th><th>Müşteri</th><th>Ödeme</th><th>Vade</th><th>Toplam</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let C=[],S=[];const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>C.find(x=>x.id===id)?.name||'Bilinmiyor';async function load(){let [s,c]=await Promise.all([db.from('sales').select('id,customer_id,sale_date,payment_type,due_date,total,status').order('sale_date',{ascending:false}),db.from('customers').select('id,name').eq('is_active',true).order('name')]);if(s.error||c.error)return alert((s.error||c.error).message);S=s.data||[];C=c.data||[];render()}function render(){let q=(document.getElementById('q').value||'').toLocaleLowerCase('tr-TR'),a=document.getElementById('from').value,b=document.getElementById('to').value,st=document.getElementById('status').value;let arr=S.filter(x=>(!q||cname(x.customer_id).toLocaleLowerCase('tr-TR').includes(q))&&(!a||x.sale_date>=a)&&(!b||x.sale_date<=b)&&(st==='all'||x.status===st));let total=arr.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+Number(x.total||0),0);stats.innerHTML=`<div class="card"><small>Satış adedi</small><div class="value">${arr.length}</div></div><div class="card"><small>Toplam satış</small><div class="value">${money(total)}</div></div><div class="card"><small>Vadeli satış</small><div class="value">${arr.filter(x=>x.payment_type==='credit'||x.payment_type==='vadeli').length}</div></div><div class="card"><small>İptal</small><div class="value red">${arr.filter(x=>x.status==='cancelled').length}</div></div>`;rows.innerHTML=arr.slice(0,500).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.sale_date)}</td><td><b>${esc(cname(x.customer_id))}</b></td><td>${esc(x.payment_type||'-')}</td><td>${esc(x.due_date||'-')}</td><td><b>${money(x.total)}</b></td><td><span class="badge ${x.status==='cancelled'?'red':''}">${esc(x.status||'-')}</span></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:25px">Satış bulunamadı.</td></tr>'}load();</script></body></html>
