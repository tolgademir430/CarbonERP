<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Satışlar</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,.modal input,.modal textarea{padding:10px;border:1px solid #d0d5dd;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.muted{color:#667085}.green{color:#087443;font-weight:900}.red{color:#b42318;font-weight:900}.amber{color:#b54708;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.value{font-size:23px;font-weight:900;margin-top:5px}.badge{padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.danger{background:#b42318;color:#fff}.secondary{background:#eef2f6;color:#172033}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:30}.modal.hidden{display:none}.box{background:#fff;border-radius:15px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.item{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:800px){.cards{grid-template-columns:2fr 2fr}.wrap{padding:10px}.table{font-size:12px}.item{grid-template-columns:1fr 1fr}.item>div:first-child{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="head"><div><h1>Satışlar</h1><p class="muted">Satış kayıtları, iptal ve iade yönetimi.</p></div></div><div class="cards" id="stats"></div><div class="card"><div class="toolbar"><input id="q" placeholder="Müşteri ara" oninput="render()"><input id="from" type="date" onchange="render()"><input id="to" type="date" onchange="render()"><select id="status" onchange="render()"><option value="all">Tüm durumlar</option><option value="completed">Tamamlanan</option><option value="cancelled">İptal</option></select></div></div><div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Tarih</th><th>Müşteri</th><th>Ödeme</th><th>Vade</th><th>Toplam</th><th>Durum</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let C=[],S=[];const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>C.find(x=>x.id===id)?.name||'Bilinmiyor';async function load(){let [s,c]=await Promise.all([db.from('sales').select('id,customer_id,sale_date,payment_type,due_date,total,status').order('sale_date',{ascending:false}),db.from('customers').select('id,name').eq('is_active',true).order('name')]);if(s.error||c.error)return alert((s.error||c.error).message);S=s.data||[];C=c.data||[];render()}function render(){let q=(document.getElementById('q').value||'').toLocaleLowerCase('tr-TR'),a=document.getElementById('from').value,b=document.getElementById('to').value,st=document.getElementById('status').value;let arr=S.filter(x=>(!q||cname(x.customer_id).toLocaleLowerCase('tr-TR').includes(q))&&(!a||x.sale_date>=a)&&(!b||x.sale_date<=b)&&(st==='all'||x.status===st));let total=arr.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+Number(x.total||0),0);stats.innerHTML=`<div class="card"><small>Satış adedi</small><div class="value">${arr.length}</div></div><div class="card"><small>Toplam satış</small><div class="value">${money(total)}</div></div><div class="card"><small>Vadeli satış</small><div class="value">${arr.filter(x=>x.payment_type==='credit'||x.payment_type==='vadeli'||x.payment_type==='Vadeli').length}</div></div><div class="card"><small>İptal</small><div class="value red">${arr.filter(x=>x.status==='cancelled').length}</div></div>`;rows.innerHTML=arr.slice(0,500).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.sale_date)}</td><td><b>${esc(cname(x.customer_id))}</b></td><td>${esc(x.payment_type||'-')}</td><td>${esc(x.due_date||'-')}</td><td><b>${money(x.total)}</b></td><td><span class="badge ${x.status==='cancelled'?'red':''}">${esc(x.status||'-')}</span></td><td>${x.status==='cancelled'?'<span class="muted">İşlem yok</span>':`<button class="btn secondary" onclick="openReturn('${x.id}')">↩ İade</button> <button class="btn danger" onclick="cancelSale('${x.id}')">İptal</button>`}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:25px">Satış bulunamadı.</td></tr>'}async function cancelSale(id){let reason=prompt('İptal nedeni (isteğe bağlı):','');if(reason===null)return;if(!confirm('Bu satış tamamen iptal edilecek, stok geri eklenecek ve bağlı tahsilat iptal edilecek. Devam edilsin mi?'))return;let {data,error}=await db.rpc('cancel_sale',{p_sale_id:id,p_reason:reason||null});if(error)return alert(error.message);if(!data?.success)return alert('İptal işlemi tamamlanamadı.');await load();alert('Satış iptal edildi. Stok ve cari etkisi geri alındı.')}async function openReturn(id){let {data,error}=await db.from('sale_items').select('id,product_id,quantity,unit_price,line_total,products(name)').eq('sale_id',id);if(error)return alert(error.message);if(!data?.length)return alert('Bu satışta iade edilebilir kalem bulunamadı.');modal.innerHTML=`<div class="box"><h2>Satış İadesi</h2><p class="muted">İade miktarlarını gir. İade, satışın kalan miktarını aşamaz.</p><div id="returnItems">${data.map((x,i)=>`<div class="item"><div><b>${esc(x.products?.name||'Ürün')}</b><br><small>Satılan: ${x.quantity} · ${money(x.unit_price)}</small></div><input id="rq${i}" type="number" min="0" max="${x.quantity}" step="0.01" value="0"><input id="rp${i}" type="number" min="0" step="0.01" value="${Number(x.unit_price||0)}"></div>`).join('')}</div><label>İade nedeni</label><textarea id="reason" placeholder="Örn. Eksik/yanlış ürün"></textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn danger" onclick="submitReturn('${id}',${JSON.stringify(data).replace(/</g,'\\u003c')})">İadeyi Kaydet</button></div></div>`;modal.classList.remove('hidden')}async function submitReturn(saleId,items){let payload=items.map((x,i)=>({sale_item_id:x.id,product_id:x.product_id,quantity:Number(document.getElementById('rq'+i).value||0),unit_price:Number(document.getElementById('rp'+i).value||0)})).filter(x=>x.quantity>0);if(!payload.length)return alert('En az bir iade miktarı gir.');let {data,error}=await db.rpc('create_sale_return',{p_sale_id:saleId,p_reason:document.getElementById('reason').value.trim()||null,p_items:payload});if(error)return alert(error.message);if(!data?.success)return alert('İade kaydedilemedi.');closeModal();await load();alert('İade kaydedildi ve stok geri eklendi.')}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
