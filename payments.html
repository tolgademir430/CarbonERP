<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Tahsilat & Vade</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.v{font-size:24px;font-weight:900}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{padding:10px;border:1px solid #d0d5dd;border-radius:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.ok{background:#087443;color:#fff}.dark{background:#172033;color:#fff}.danger{background:#b42318;color:#fff}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:#fff;padding:18px;border-radius:16px;width:min(620px,100%)}.hidden{display:none}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:9px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>💰 Tahsilat & Vade Merkezi</h1><p>Müşteri vadelerini ve tahsilatlarını tek ekrandan yönet.</p><div class="grid" id="stats"></div><div class="card"><div class="toolbar"><input id="q" placeholder="Müşteri ara" oninput="render()"><select id="filter" onchange="render()"><option value="all">Tümü</option><option value="open">Açık Vadeler</option><option value="overdue">Vadesi Geçen</option><option value="paid">Tahsil Edilen</option></select></div></div><div class="card"><div id="list"></div></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let rows=[],customers=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>customers.find(c=>c.id===id)?.name||'Müşteri';async function load(){let [c,s]=await Promise.all([db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('sales').select('*').order('sale_date',{ascending:false})]);if(c.error||s.error)return alert((c.error||s.error).message);customers=c.data||[];rows=s.data||[];render()}function state(r){let total=Number(r.total_amount||r.total||0),paid=Number(r.paid_amount||r.paid||0),due=r.due_date||r.sale_date;return{total,paid,open:Math.max(total-paid,0),over:Math.max(total-paid,0)>0&&due&&new Date(due+'T23:59:59')<new Date()}}function render(){let a=rows.map(state);stats.innerHTML=`<div class="card"><small>Toplam satış</small><div class="v">${money(a.reduce((x,r)=>x+r.total,0))}</div></div><div class="card"><small>Toplam tahsilat</small><div class="v">${money(a.reduce((x,r)=>x+r.paid,0))}</div></div><div class="card"><small>Açık alacak</small><div class="v">${money(a.reduce((x,r)=>x+r.open,0))}</div></div><div class="card"><small>Vadesi geçen</small><div class="v">${money(a.filter(r=>r.over).reduce((x,r)=>x+r.open,0))}</div></div>`;let text=(q.value||'').toLocaleLowerCase('tr-TR'),f=filter.value;list.innerHTML=rows.map((r,i)=>{let x=a[i],name=cname(r.customer_id);if(text&&!name.toLocaleLowerCase('tr-TR').includes(text))return'';if(f==='open'&&!x.open)return'';if(f==='overdue'&&!x.over)return'';if(f==='paid'&&x.open)return'';return`<div class="row"><div><b>${esc(name)}</b><br><small>Satış: ${money(x.total)} · Tahsil: ${money(x.paid)} · Kalan: ${money(x.open)} · Vade: ${esc(r.due_date||'—')}</small></div><button class="btn ok" onclick="collect('${r.id}')">Tahsilat</button></div>`}).join('')||'<p>Kayıt bulunamadı.</p>'}function collect(id){let r=rows.find(x=>x.id===id),x=state(r);modal.innerHTML=`<div class="box"><h2>Tahsilat · ${esc(cname(r.customer_id))}</h2><p>Satış toplamı: <b>${money(x.total)}</b><br>Mevcut tahsilat: <b>${money(x.paid)}</b><br>Kalan: <b>${money(x.open)}</b></p><input id="amount" type="number" min="0" step="0.01" placeholder="Tahsilat tutarı"><br><br><button class="btn ok" onclick="save('${id}',${x.paid})">Tahsilatı Kaydet</button> <button class="btn" onclick="closeModal()">Kapat</button></div>`;modal.classList.remove('hidden')}async function save(id,paid){let amount=Number(document.getElementById('amount').value);if(!amount||amount<=0)return alert('Geçerli bir tutar gir.');let r=rows.find(x=>x.id===id),next=paid+amount;if(next>Number(r.total_amount||r.total||0))return alert('Tahsilat satış toplamını aşamaz.');let res=await db.from('sales').update({paid_amount:next}).eq('id',id);if(res.error)return alert(res.error.message);closeModal();load()}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
