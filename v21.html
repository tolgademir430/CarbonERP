<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP V21 - Demir Kömürcülük</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--green:#087443;--red:#b42318;--amber:#9a6700;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--text)}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 8px 30px #0001;width:min(430px,100%)}.brand{font-size:26px;font-weight:900;margin-bottom:8px}.brand b{color:var(--green)}.muted{color:var(--muted)}label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 6px}input,select{width:100%;height:44px;border:1px solid #d1d5db;border-radius:9px;padding:0 11px}.btn{height:42px;border:0;border-radius:9px;padding:0 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:white}.secondary{background:#eef1f4;color:#172033}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111827;color:#dbe4ed;padding:18px 12px;position:sticky;top:0;height:100vh}.side .brand{color:#fff;padding:6px 9px 20px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:9px;cursor:pointer;font-weight:700;margin:3px 0}.side button:hover,.side button.active{background:#263244;color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.content{max-width:1400px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 20px #1018280a}.card{padding:16px}.card small{color:var(--muted);font-weight:700}.value{font-size:25px;font-weight:900;margin:7px 0}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin-bottom:17px}.panel{padding:17px}.panel h2{font-size:17px;margin:0 0 13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{height:70px;border:1px solid var(--line);border-radius:11px;background:#fafbfc;text-align:left;padding:11px;font-weight:850;cursor:pointer}.quick span{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f4}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:3px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eef0f2;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.empty{text-align:center;color:var(--muted);padding:25px}.hidden{display:none!important}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;padding:4px;z-index:20}.side .brand{display:none}.side nav{display:flex;overflow:auto}.side button{min-width:78px;text-align:center;font-size:10px;padding:8px 5px}.main{padding-bottom:68px}.content{padding:13px}.top{padding:0 13px}.head h1{font-size:23px}.cards{gap:8px}.card{padding:12px}.value{font-size:19px}.quick{grid-template-columns:1fr 1fr}}
</style></head><body><div id="login" class="login"><div class="box"><div class="brand">Carbon<b>ERP</b></div><p class="muted">Demir Kömürcülük - V21 operasyon paneli</p><label>E-posta</label><input id="email" type="email"><label>Şifre</label><input id="password" type="password"><button class="btn primary" style="width:100%;margin-top:15px" onclick="signIn()">Giriş Yap</button><div id="err" class="red" style="font-size:12px;margin-top:9px"></div></div></div><div id="app" class="app hidden"><aside class="side"><div class="brand">CarbonERP</div><nav id="nav"></nav><button onclick="signOut()">↪ Çıkış</button></aside><section class="main"><header class="top"><strong>Demir Kömürcülük</strong><span id="user" class="muted"></span></header><main id="content" class="content"></main></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={customers:[],sales:[],collections:[],purchases:[],expenses:[],movements:[],page:location.hash.slice(1)||'dashboard'};const P={dashboard:'Ana Sayfa',sales:'Satışlar',customers:'Müşteriler',collections:'Tahsilatlar',due:'Vade Takibi',purchases:'Alışlar',expenses:'Giderler',stock:'Stok',reports:'Raporlar'};const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL',kg=x=>Number(x||0).toLocaleString('tr-TR',{maximumFractionDigits:1})+' kg',today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function cname(id){return D.customers.find(x=>x.id===id)?.name||'Bilinmiyor'}function collected(id){return D.collections.filter(x=>x.sale_id===id).reduce((a,x)=>a+Number(x.amount||0),0)}function openAmt(s){return Math.max(0,Number(s.total||0)-collected(s.id))}function recv(){return D.sales.reduce((a,s)=>a+Number(s.total||0),0)-D.collections.reduce((a,x)=>a+Number(x.amount||0),0)}function stock(){return D.movements.reduce((a,x)=>a+Number(x.quantity||0),0)}function stockVal(){return D.movements.reduce((a,x)=>a+Number(x.total_cost||0),0)}function avg(){return stock()?stockVal()/stock():0}async function signIn(){const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)err.textContent=r.error.message}async function signOut(){await db.auth.signOut()}db.auth.onAuthStateChange((_e,s)=>{if(s){login.classList.add('hidden');app.classList.remove('hidden');user.textContent=s.user.email;load()}else{app.classList.add('hidden');login.classList.remove('hidden')}});async function load(){try{const q=await Promise.all([db.from('customers').select('*').eq('is_active',true).order('name'),db.from('sales').select('*,sale_items(*)').order('sale_date',{ascending:false}),db.from('collections').select('*').order('collection_date',{ascending:false}),db.from('purchases').select('*,purchase_items(*)').order('purchase_date',{ascending:false}),db.from('expenses').select('*').order('expense_date',{ascending:false}),db.from('stock_movements').select('*').order('movement_date',{ascending:false})]);q.forEach(x=>{if(x.error)throw x.error});[D.customers,D.sales,D.collections,D.purchases,D.expenses,D.movements]=q.map(x=>x.data||[])}catch(e){console.error(e)}render()}function menu(){nav.innerHTML=Object.entries(P).map(([k,v])=>`<button class="${D.page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){D.page=p;location.hash=p;render()}window.addEventListener('hashchange',()=>{D.page=location.hash.slice(1)||'dashboard';render()});function render(){menu();({dashboard,salesPage,customersPage,collectionsPage,duePage,purchasesPage,expensesPage,stockPage,reportsPage}[D.page==='sales'?'salesPage':D.page==='customers'?'customersPage':D.page==='collections'?'collectionsPage':D.page==='due'?'duePage':D.page==='purchases'?'purchasesPage':D.page==='expenses'?'expensesPage':D.page==='stock'?'stockPage':D.page==='reports'?'reportsPage':'dashboard'])()}function dashboard(){const ts=D.sales.filter(s=>s.sale_date===today()),tr=ts.reduce((a,s)=>a+Number(s.total||0),0),tc=D.collections.filter(x=>x.collection_date===today()).reduce((a,x)=>a+Number(x.amount||0),0),ms=D.sales.filter(s=>String(s.sale_date||'').slice(0,7)===today().slice(0,7)),mr=ms.reduce((a,s)=>a+Number(s.total||0),0),mc=ms.reduce((a,s)=>a+Number(s.cost_total||0),0),late=D.sales.filter(s=>s.due_date&&s.due_date<today()&&openAmt(s)>0),du=D.sales.filter(s=>s.due_date===today()&&openAmt(s)>0);content.innerHTML=`<div class="head"><div><h1>Operasyon Paneli</h1><p>Satış, tahsilat, cari ve stok tek ekranda.</p></div><button class="btn primary" onclick="go('sales')">+ Hızlı Satış</button></div><div class="cards"><div class="card"><small>Bugünkü Satış</small><div class="value">${money(tr)}</div><span class="muted">${ts.length} işlem</span></div><div class="card"><small>Bugünkü Tahsilat</small><div class="value green">${money(tc)}</div><span class="muted">Kasaya giren</span></div><div class="card"><small>Toplam Cari Alacak</small><div class="value amber">${money(recv())}</div><span class="muted">${late.length} gecikmiş satış</span></div><div class="card"><small>Bu Ay Brüt Kâr</small><div class="value ${mr-mc>=0?'green':'red'}">${money(mr-mc)}</div><span class="muted">Ciro ${money(mr)}</span></div></div><div class="grid"><section class="panel"><h2>Hızlı İşlemler</h2><div class="quick"><button onclick="go('sales')">＋ Satış Ekle<span>Müşteri + kg + fiyat</span></button><button onclick="go('collections')">₺ Tahsilat Al<span>Cari bakiyeyi düş</span></button><button onclick="go('customers')">♙ Müşteri Bul<span>Cari ve geçmiş</span></button><button onclick="go('stock')">▤ Stok Gör<span>Kg ve maliyet</span></button><button onclick="go('due')">◷ Vade Takibi<span>Bugün + geciken</span></button><button onclick="go('reports')">▥ Kâr Raporu<span>Ciro + maliyet + kâr</span></button></div></section><section class="panel"><h2>Bugün Tahsil Edilecek</h2>${du.length?du.slice(0,7).map(s=>`<div class="row"><div><b>${esc(cname(s.customer_id))}</b><small>${esc(s.due_date)}</small></div><b class="amber">${money(openAmt(s))}</b></div>`).join(''):'<div class="empty">Bugün bekleyen vade yok.</div>'}</section></div><div class="grid"><section class="panel"><h2>Son Satışlar</h2><div class="tablewrap"><table class="table"><tr><th>Müşteri</th><th>Tarih</th><th>Tutar</th><th>Açık</th></tr>${D.sales.slice(0,8).map(s=>`<tr><td>${esc(cname(s.customer_id))}</td><td>${esc(s.sale_date||'')}</td><td>${money(s.total)}</td><td>${money(openAmt(s))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Satış yok.</td></tr>'}</table></div></section><section class="panel"><h2>Stok Özeti</h2><div class="row"><div><b>Toplam stok</b><small>Kömür</small></div><b class="blue">${kg(stock())}</b></div><div class="row"><div><b>Ortalama maliyet</b><small>Hareketli ortalama</small></div><b>${money(avg())}/kg</b></div><div class="row"><div><b>Stok değeri</b><small>Mevcut hareketlere göre</small></div><b>${money(stockVal())}</b></div><div class="row"><div><b>Gecikmiş alacak</b><small>Vadesi geçmiş</small></div><b class="red">${money(late.reduce((a,s)=>a+openAmt(s),0))}</b></div></section></div>`}function page(title,sub,body,button=''){content.innerHTML=`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div><section class="panel">${body}</section>`}function salesPage(){page('Satışlar','Satış geçmişi ve kârlılık',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Toplam</th><th>Maliyet</th><th>Kâr</th><th>Açık</th></tr>${D.sales.slice(0,150).map(s=>{let p=Number(s.total||0)-Number(s.cost_total||0);return`<tr><td>${esc(s.sale_date||'')}</td><td>${esc(cname(s.customer_id))}</td><td>${money(s.total)}</td><td>${money(s.cost_total)}</td><td class="${p>=0?'green':'red'}">${money(p)}</td><td>${money(openAmt(s))}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Satış yok.</td></tr>'}</table></div>`,'')}function customersPage(){page('Müşteriler',`${D.customers.length} aktif cari hesap`,`<div class="tablewrap"><table class="table"><tr><th>Müşteri</th><th>Telefon</th><th>Bakiye</th></tr>${D.customers.map(c=>{let b=D.sales.filter(s=>s.customer_id===c.id).reduce((a,s)=>a+Number(s.total||0),0)-D.collections.filter(x=>x.customer_id===c.id).reduce((a,x)=>a+Number(x.amount||0),0);return`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'-')}</td><td class="${b>0?'amber':'green'}">${money(b)}</td></tr>`}).join('')||'<tr><td colspan="3" class="empty">Müşteri yok.</td></tr>'}`,'')}function collectionsPage(){page('Tahsilatlar','Günlük tahsilat akışı',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Tutar</th><th>Açıklama</th></tr>${D.collections.slice(0,150).map(c=>`<tr><td>${esc(c.collection_date||'')}</td><td>${esc(cname(c.customer_id))}</td><td class="green">${money(c.amount)}</td><td>${esc(c.description||c.note||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tahsilat yok.</td></tr>'}`,'')}function duePage(){let l=D.sales.filter(s=>s.due_date&&s.due_date<today()&&openAmt(s)>0),t=D.sales.filter(s=>s.due_date===today()&&openAmt(s)>0);page('Vade Takibi','Önce bugün, sonra gecikenler',`<div class="cards"><div class="card"><small>Bugün</small><div class="value amber">${money(t.reduce((a,s)=>a+openAmt(s),0))}</div></div><div class="card"><small>Gecikmiş</small><div class="value red">${money(l.reduce((a,s)=>a+openAmt(s),0))}</div></div><div class="card"><small>Toplam Alacak</small><div class="value">${money(recv())}</div></div></div><div class="tablewrap"><table class="table"><tr><th>Müşteri</th><th>Vade</th><th>Durum</th><th>Kalan</th></tr>${[...l,...t].map(s=>`<tr><td>${esc(cname(s.customer_id))}</td><td>${esc(s.due_date)}</td><td class="${s.due_date<today()?'red':'amber'}">${s.due_date<today()?'Gecikmiş':'Bugün'}</td><td>${money(openAmt(s))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Açık vade yok.</td></tr>'}</table></div>`,'')}function purchasesPage(){page('Alışlar','Tedarikçi alışları ve maliyet takibi',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Tedarikçi</th><th>Tutar</th></tr>${D.purchases.slice(0,100).map(p=>`<tr><td>${esc(p.purchase_date||'')}</td><td>${esc(p.supplier_name||p.supplier||'-')}</td><td>${money(p.total)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Alış yok.</td></tr>'}</table></div>`,'')}function expensesPage(){page('Giderler','Yakıt, araç, personel ve diğer giderler',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Açıklama</th><th>Tutar</th></tr>${D.expenses.slice(0,100).map(e=>`<tr><td>${esc(e.expense_date||'')}</td><td>${esc(e.description||e.note||'-')}</td><td>${money(e.amount||e.total)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Gider yok.</td></tr>'}</table></div>`,'')}function stockPage(){page('Stok','Kömürü kg ve maliyet bazında izle',`<div class="cards"><div class="card"><small>Toplam Kg</small><div class="value blue">${kg(stock())}</div></div><div class="card"><small>Stok Değeri</small><div class="value">${money(stockVal())}</div></div><div class="card"><small>Ortalama Maliyet</small><div class="value">${money(avg())}/kg</div></div></div><div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>İşlem</th><th>Miktar</th><th>Maliyet</th></tr>${D.movements.slice(0,100).map(m=>`<tr><td>${esc(m.movement_date||'')}</td><td>${esc(m.movement_type||m.type||'-')}</td><td>${kg(m.quantity)}</td><td>${money(m.total_cost)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Stok hareketi yok.</td></tr>'}</table></div>`,'')}function reportsPage(){let rev=D.sales.reduce((a,s)=>a+Number(s.total||0),0),cost=D.sales.reduce((a,s)=>a+Number(s.cost_total||0),0),exp=D.expenses.reduce((a,e)=>a+Number(e.amount||e.total||0),0);page('Raporlar','Yönetici özeti ve kârlılık',`<div class="cards"><div class="card"><small>Toplam Ciro</small><div class="value">${money(rev)}</div></div><div class="card"><small>Toplam Maliyet</small><div class="value">${money(cost)}</div></div><div class="card"><small>Brüt Kâr</small><div class="value green">${money(rev-cost)}</div></div><div class="card"><small>Gider</small><div class="value red">${money(exp)}</div></div></div><div class="row"><div><b>Net operasyon sonucu</b><small>Brüt kâr - kayıtlı gider</small></div><b class="${rev-cost-exp>=0?'green':'red'}">${money(rev-cost-exp)}</b></div>`,'')}if(!location.hash)render();</script></body></html>
