<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP V24 · Satıştan Teslimat</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.v{font-size:24px;font-weight:900}.green{color:#087443}.amber{color:#b54708}.red{color:#b42318}.blue{color:#1769aa}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:850;cursor:pointer}.dark{background:#172033;color:#fff}.ok{background:#087443;color:#fff}.soft{background:#eef2f6}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:#fff;border-radius:16px;padding:18px;width:min(720px,100%);max-height:92vh;overflow:auto}.hidden{display:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}.item{display:grid;grid-template-columns:1fr 130px;gap:8px;margin:7px 0}.flow{display:flex;gap:5px;flex-wrap:wrap}.flow button{padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:800}.flow button.on{background:#172033;color:#fff}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.table{font-size:12px}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>CarbonERP V24</h1><p>Satış → Teslimat → Tahsilat operasyon merkezi</p></div></div><div class="cards" id="cards"></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Müşteri / tarih ara..." oninput="render()"><select id="filter" onchange="render()"><option value="all">Tüm satışlar</option><option value="not_created">Teslimat bekleyen</option><option value="created">Teslimatı olan</option></select></div><div id="table"></div></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={sales:[],customers:[],products:[],deliveries:[]};const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL',num=x=>Number(x||0).toLocaleString('tr-TR',{maximumFractionDigits:1}),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>D.customers.find(x=>x.id===id)?.name||'Bilinmiyor',pname=id=>D.products.find(x=>x.id===id)?.name||'Ürün';const status={pending:'Bekliyor',preparing:'Hazırlanıyor',loaded:'Araca Yüklendi',out_for_delivery:'Dağıtımda',delivered:'Teslim Edildi',cancelled:'İptal'};function close(){modal.classList.add('hidden');modal.innerHTML=''}async function load(){const [a,b,c,d]=await Promise.all([db.from('sales').select('*,sale_items(*)').order('sale_date',{ascending:false}),db.from('customers').select('id,name,phone,address,default_due_days').eq('is_active',true).order('name'),db.from('products').select('id,name,unit').eq('is_active',true).order('name'),db.from('delivery_orders').select('*,delivery_items(*)').order('created_at',{ascending:false})]);[D.sales,D.customers,D.products,D.deliveries]=[a.data||[],b.data||[],c.data||[],d.data||[]];if(a.error||d.error)alert((a.error||d.error).message);render()}function deliveryForSale(id){return D.deliveries.find(x=>x.sale_id===id)}function kgOf(s){return(s.sale_items||[]).reduce((a,i)=>a+Number(i.quantity||0),0)}function render(){const q=search.value.toLocaleLowerCase('tr-TR'),f=filter.value;let arr=D.sales.filter(s=>{const d=deliveryForSale(s.id);return(!q||(`${cname(s.customer_id)} ${s.sale_date}`).toLocaleLowerCase('tr-TR').includes(q))&&(f==='all'||f==='not_created'&&!d||f==='created'&&d)});const pending=D.sales.filter(s=>!deliveryForSale(s.id)&&s.status!=='cancelled').length,created=D.sales.filter(s=>!!deliveryForSale(s.id)).length,out=D.deliveries.filter(d=>d.status==='out_for_delivery').length,done=D.deliveries.filter(d=>d.status==='delivered').length;cards.innerHTML=`<div class="card"><small>Teslimat Bekleyen Satış</small><div class="v amber">${pending}</div></div><div class="card"><small>Teslimat Oluşturulan</small><div class="v blue">${created}</div></div><div class="card"><small>Dağıtımda</small><div class="v">${out}</div></div><div class="card"><small>Teslim Edildi</small><div class="v green">${done}</div></div>`;table.innerHTML=`<div style="overflow:auto"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Satış</th><th>Teslimat</th><th>İşlem</th></tr>${arr.slice(0,250).map(s=>{const d=deliveryForSale(s.id);return`<tr><td>${esc(s.sale_date)}</td><td><b>${esc(cname(s.customer_id))}</b></td><td>${num(kgOf(s))} kg</td><td>${money(s.total)}</td><td>${d?`<span class="badge">${status[d.status]}</span>`:'<span class="badge amber">Yok</span>'}</td><td>${d?`<button class="btn dark" onclick="detail('${d.id}')">Teslimat</button>`:`<button class="btn ok" onclick="createFromSale('${s.id}')">＋ Teslimat Oluştur</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;padding:30px">Kayıt yok.</td></tr>'}</table></div>`}function createFromSale(id){const s=D.sales.find(x=>x.id===id),c=D.customers.find(x=>x.id===s.customer_id);if(!s)return;modal.innerHTML=`<div class="box"><div class="head"><h2>Satıştan Teslimat Oluştur</h2><button onclick="close()">×</button></div><div class="card"><b>${esc(c?.name||'Müşteri')}</b><br>${esc(c?.address||'Adres kayıtlı değil')}<br><br><b>Satış:</b> ${esc(s.sale_date)} · ${money(s.total)} · ${num(kgOf(s))} kg</div><div class="formgrid"><div><label>Teslimat Tarihi</label><input id="vd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Şoför</label><input id="vdriver"></div><div><label>Araç Plakası</label><input id="vplate"></div><div><label>Adres</label><input id="vaddr" value="${esc(c?.address||'')}"></div></div><label>Ürünler</label><div id="vitems">${(s.sale_items||[]).map(i=>`<div class="item"><div><b>${esc(pname(i.product_id))}</b><br><small>${num(i.quantity)} kg</small></div><input type="number" value="${Number(i.quantity)}" min="0.1" step="0.1" data-pid="${i.product_id}"></div>`).join('')}</div><label>Not</label><textarea id="vnotes"></textarea><div style="text-align:right;margin-top:15px"><button class="btn ok" onclick="saveFromSale('${id}')">Teslimatı Oluştur</button></div></div>`;modal.classList.remove('hidden')}async function saveFromSale(saleId){const s=D.sales.find(x=>x.id===saleId),arr=[...vitems.querySelectorAll('input[data-pid]')].map(i=>({product_id:i.dataset.pid,quantity:Number(i.value)})).filter(x=>x.quantity>0);if(!arr.length)return alert('Ürün miktarı gerekli.');const r=await db.rpc('create_delivery',{p_customer_id:s.customer_id,p_sale_id:saleId,p_delivery_date:vd.value,p_address:vaddr.value.trim()||null,p_notes:vnotes.value.trim()||null,p_items:arr});if(r.error)return alert(r.error.message);const id=r.data;const st=await db.rpc('set_delivery_status',{p_delivery_id:id,p_status:'pending',p_note:vnotes.value.trim()||null,p_driver_name:vdriver.value.trim()||null,p_vehicle_plate:vplate.value.trim()||null});if(st.error)return alert(st.error.message);close();await load();alert('Satıştan teslimat oluşturuldu.')}function detail(id){const d=D.deliveries.find(x=>x.id===id);if(!d)return;modal.innerHTML=`<div class="box"><div class="head"><div><h2>${esc(cname(d.customer_id))}</h2><small>${esc(d.delivery_date)} · ${num(d.total_kg)} kg</small></div><button onclick="close()">×</button></div><div class="flow">${Object.entries(status).map(([k,v])=>`<button class="${d.status===k?'on':''}" onclick="change('${d.id}','${k}')">${v}</button>`).join('')}</div><div class="card"><b>Adres:</b> ${esc(d.address||'-')}<br><b>Şoför:</b> ${esc(d.driver_name||'-')}<br><b>Araç:</b> ${esc(d.vehicle_plate||'-')}</div>${(d.delivery_items||[]).map(i=>`<div class="card"><b>${esc(pname(i.product_id))}</b> · ${num(i.quantity)} kg</div>`).join('')}<label>Durum notu</label><textarea id="dn"></textarea></div>`;modal.classList.remove('hidden')}async function change(id,s){const r=await db.rpc('set_delivery_status',{p_delivery_id:id,p_status:s,p_note:dn.value.trim()||null});if(r.error)return alert(r.error.message);close();await load()}load();</script></body></html>
