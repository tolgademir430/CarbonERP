<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CarbonERP V22 - Demir Kömürcülük</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--nav:#101828;--green:#087443;--red:#b42318;--amber:#b54708;--blue:#1769aa;--purple:#6941c6;--shadow:0 6px 22px #10182810}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff}textarea{min-height:82px;resize:vertical}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}.brand{font-size:27px;font-weight:950}.brand b{color:var(--green)}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:850}.primary{background:#172033;color:#fff}.secondary{background:#eef2f6;color:#172033}.success{background:var(--green);color:#fff}.danger{background:#fee4e2;color:var(--red)}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);color:#d0d5dd;position:sticky;top:0;height:100vh;padding:18px 12px;z-index:20}.side .brand{color:#fff;padding:5px 8px 22px}.side nav button,.logout{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:750}.side nav button:hover,.side nav button.active{background:#263244;color:#fff}.logout{margin-top:12px}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.content{max-width:1450px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h1{font-size:28px;margin:0}.head p{margin:6px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.card{padding:16px}.card small{font-weight:750;color:var(--muted)}.value{font-size:25px;font-weight:950;margin:7px 0}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.purple{color:var(--purple)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}.panel{padding:17px}.panel h2{font-size:17px;margin:0 0 13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{min-height:75px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fafbfc;padding:12px;font-weight:900}.quick span{display:block;font-size:11px;font-weight:650;color:var(--muted);margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f4}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eef0f2;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.empty{text-align:center;color:var(--muted);padding:28px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar>*{max-width:300px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:850}.badge.green{background:#dcfae6}.badge.red{background:#fee4e2}.badge.amber{background:#fef0c7}.badge.blue{background:#dff3ff}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid.three{grid-template-columns:repeat(3,1fr)}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.modal{position:fixed;inset:0;background:#10182880;display:grid;place-items:center;padding:15px;z-index:50}.modalbox{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h2{margin:0}.x{border:0;background:#f2f4f7;border-radius:50%;width:36px;height:36px;font-size:20px}.quickkg{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.quickkg button{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:8px 12px;font-weight:850}.summary{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}.customerbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.customerbox strong{font-size:16px}.clickable{cursor:pointer}.notice{padding:10px 12px;border-radius:10px;background:#fffaeb;color:#93370d;font-size:12px;font-weight:700;margin-top:10px}.search{min-width:260px}.detailtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mobileonly{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}.formgrid.three{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:67px;padding:4px;background:#101828}.side .brand{display:none}.side nav{display:flex;overflow:auto}.side nav button{min-width:74px;text-align:center;font-size:10px;padding:7px 5px;margin:0}.logout{display:none}.main{padding-bottom:70px}.content{padding:13px}.top{height:58px;padding:0 13px}.top strong{font-size:13px}.top span{font-size:11px}.head h1{font-size:23px}.cards{gap:8px}.card{padding:12px}.value{font-size:19px}.quick{grid-template-columns:1fr 1fr}.quick button{min-height:68px}.formgrid,.formgrid.three{grid-template-columns:1fr}.search{min-width:100%}.toolbar>*{max-width:none;flex:1}.table{font-size:12px}.modal{padding:7px}.modalbox{padding:15px;border-radius:15px;max-height:95vh}.mobileonly{display:block}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">Carbon<b>ERP</b></div><p class="muted">Demir Kömürcülük · V22 operasyon sistemi</p><label>E-posta</label><input id="email" type="email" autocomplete="username"><label>Şifre</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:15px" onclick="signIn()">Giriş Yap</button><div id="loginErr" class="red" style="font-size:12px;margin-top:9px"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">CarbonERP</div><nav id="nav"></nav><button class="logout" onclick="signOut()">↪ Çıkış</button></aside><section class="main"><header class="top"><strong>Demir Kömürcülük</strong><span id="user" class="muted"></span></header><main id="content" class="content"></main></section></div>
<div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');
const D={customers:[],sales:[],collections:[],purchases:[],expenses:[],movements:[],products:[],warehouses:[],page:location.hash.slice(1)||'dashboard',customer:null};
const P={dashboard:'Ana Sayfa',sales:'Satışlar',customers:'Müşteriler',collections:'Tahsilatlar',due:'Vade',purchases:'Alışlar',expenses:'Giderler',stock:'Stok',reports:'Raporlar'};
const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';
const num=x=>Number(x||0).toLocaleString('tr-TR',{maximumFractionDigits:1});
const kg=x=>num(x)+' kg';
const today=()=>new Date().toISOString().slice(0,10);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const activeSales=()=>D.sales.filter(s=>s.status!=='cancelled');
const activeCollections=()=>D.collections.filter(c=>c.status!=='cancelled');
function cname(id){return D.customers.find(x=>x.id===id)?.name||'Bilinmiyor'}
function pname(id){return D.products.find(x=>x.id===id)?.name||'Ürün'}
function wname(id){return D.warehouses.find(x=>x.id===id)?.name||'Depo'}
function collectedForSale(id){return activeCollections().filter(x=>x.sale_id===id).reduce((a,x)=>a+Number(x.amount||0),0)}
function openAmt(s){return Math.max(0,Number(s.total||0)-collectedForSale(s.id))}
function customerBalance(id){return activeSales().filter(s=>s.customer_id===id).reduce((a,s)=>a+Number(s.total||0),0)-activeCollections().filter(c=>c.customer_id===id).reduce((a,c)=>a+Number(c.amount||0),0)}
function receivable(){return activeSales().reduce((a,s)=>a+openAmt(s),0)}
function stockFor(wid,pid){return D.movements.filter(m=>(!wid||m.warehouse_id===wid)&&(!pid||m.product_id===pid)).reduce((a,m)=>a+Number(m.quantity||0),0)}
function stockCost(wid,pid){return D.movements.filter(m=>(!wid||m.warehouse_id===wid)&&(!pid||m.product_id===pid)).reduce((a,m)=>a+Number(m.total_cost||0),0)}
function avgCost(wid,pid){const q=stockFor(wid,pid),v=stockCost(wid,pid);return q?v/q:0}
function openModal(html){modal.innerHTML=html;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
function go(p){D.page=p;D.customer=null;location.hash=p;render()}
window.addEventListener('hashchange',()=>{D.page=location.hash.slice(1)||'dashboard';render()});
async function signIn(){loginErr.textContent='';const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)loginErr.textContent=r.error.message}
async function signOut(){await db.auth.signOut()}
db.auth.onAuthStateChange((_e,s)=>{if(s){login.classList.add('hidden');app.classList.remove('hidden');user.textContent=s.user.email;load()}else{app.classList.add('hidden');login.classList.remove('hidden')}});
async function load(){try{const q=await Promise.all([
 db.from('customers').select('*').eq('is_active',true).order('name'),
 db.from('sales').select('*,sale_items(*)').order('sale_date',{ascending:false}),
 db.from('collections').select('*').order('collection_date',{ascending:false}),
 db.from('purchases').select('*,purchase_items(*)').order('purchase_date',{ascending:false}),
 db.from('expenses').select('*').order('expense_date',{ascending:false}),
 db.from('stock_movements').select('*').order('movement_date',{ascending:false}),
 db.from('products').select('*').eq('is_active',true).order('name'),
 db.from('warehouses').select('*').eq('is_active',true).order('name')]);
 q.forEach(x=>{if(x.error)throw x.error});
 [D.customers,D.sales,D.collections,D.purchases,D.expenses,D.movements,D.products,D.warehouses]=q.map(x=>x.data||[]);
 }catch(e){console.error(e);toast('Veriler yüklenirken hata: '+e.message,true)}render()}
function menu(){nav.innerHTML=Object.entries(P).map(([k,v])=>`<button class="${D.page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}
function render(){menu();const fn={dashboard,sales:salesPage,customers:customersPage,collections:collectionsPage,due:duePage,purchases:purchasesPage,expenses:expensesPage,stock:stockPage,reports:reportsPage}[D.page]||dashboard;fn()}
function page(title,sub,body,button=''){content.innerHTML=`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div><section class="panel">${body}</section>`}
function dashboard(){const ts=activeSales().filter(s=>s.sale_date===today()),tr=ts.reduce((a,s)=>a+Number(s.total||0),0),tc=activeCollections().filter(x=>x.collection_date===today()).reduce((a,x)=>a+Number(x.amount||0),0),ms=activeSales().filter(s=>String(s.sale_date||'').slice(0,7)===today().slice(0,7)),mr=ms.reduce((a,s)=>a+Number(s.total||0),0),mc=ms.reduce((a,s)=>a+Number(s.cost_total||0),0),ex=D.expenses.filter(e=>String(e.expense_date||'').slice(0,7)===today().slice(0,7)).reduce((a,e)=>a+Number(e.amount||0),0),late=activeSales().filter(s=>s.due_date&&s.due_date<today()&&openAmt(s)>0),du=activeSales().filter(s=>s.due_date===today()&&openAmt(s)>0),stk=D.products.reduce((a,p)=>a+stockFor(null,p.id),0);
content.innerHTML=`<div class="head"><div><h1>Operasyon Paneli</h1><p>Satış → stok → cari → tahsilat zinciri tek sistemde.</p></div><button class="btn success" onclick="saleModal()">＋ Hızlı Satış</button></div>
<div class="cards"><div class="card"><small>Bugünkü Satış</small><div class="value">${money(tr)}</div><span class="muted">${ts.length} işlem</span></div><div class="card"><small>Bugünkü Tahsilat</small><div class="value green">${money(tc)}</div><span class="muted">Kasaya giren</span></div><div class="card"><small>Toplam Cari Alacak</small><div class="value amber">${money(receivable())}</div><span class="muted">${late.length} gecikmiş satış</span></div><div class="card"><small>Bu Ay Net Sonuç</small><div class="value ${(mr-mc-ex)>=0?'green':'red'}">${money(mr-mc-ex)}</div><span class="muted">Brüt kâr ${money(mr-mc)}</span></div></div>
<div class="grid"><section class="panel"><h2>Hızlı İşlemler</h2><div class="quick"><button onclick="saleModal()">＋ Satış Ekle<span>Müşteri + kg + fiyat + vade</span></button><button onclick="collectionModal()">₺ Tahsilat Al<span>Genel veya satışa mahsup</span></button><button onclick="customerModal()">＋ Yeni Müşteri<span>Restoran / kasap cari aç</span></button><button onclick="go('stock')">▤ Stok<span>Depo ve kg bazında</span></button><button onclick="go('due')">◷ Vade Takibi<span>Bugün + geciken</span></button><button onclick="go('reports')">▥ Kâr Raporu<span>Ciro + maliyet + gider</span></button></div></section><section class="panel"><h2>Bugün Tahsil Edilecek</h2>${du.length?du.slice(0,8).map(s=>`<div class="row"><div><b>${esc(cname(s.customer_id))}</b><small>Vade ${esc(s.due_date)}</small></div><b class="amber">${money(openAmt(s))}</b></div>`).join(''):'<div class="empty">Bugün bekleyen vade yok.</div>'}</section></div>
<div class="grid"><section class="panel"><h2>Son Satışlar</h2><div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Tutar</th><th>Açık</th></tr>${activeSales().slice(0,8).map(s=>`<tr class="clickable" onclick="saleDetail('${s.id}')"><td>${esc(s.sale_date)}</td><td>${esc(cname(s.customer_id))}</td><td>${kg(s.sale_items?.reduce((a,i)=>a+Number(i.quantity||0),0))}</td><td>${money(s.total)}</td><td>${money(openAmt(s))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Satış yok.</td></tr>'}</table></div></section><section class="panel"><h2>Stok Özeti</h2>${D.products.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>Ortalama maliyet ${money(avgCost(null,p.id))}/kg</small></div><b class="blue">${kg(stockFor(null,p.id))}</b></div>`).join('')||'<div class="empty">Ürün yok.</div>'}<div class="row"><div><b>Gecikmiş alacak</b><small>Vadesi geçmiş açık bakiye</small></div><b class="red">${money(late.reduce((a,s)=>a+openAmt(s),0))}</b></div></section></div>`}
function salesPage(){page('Satışlar','Satış geçmişi, maliyet ve açık bakiye','<div class="toolbar"><input class="search" id="saleSearch" placeholder="Müşteri ara..." oninput="filterSales()"><select id="saleStatus" onchange="filterSales()"><option value="active">Aktif satışlar</option><option value="cancelled">İptal edilenler</option><option value="all">Tümü</option></select><button class="btn success" onclick="saleModal()">＋ Satış</button></div><div id="saleTable"></div>');filterSales()}
function filterSales(){const q=(saleSearch?.value||'').toLocaleLowerCase('tr-TR'),st=saleStatus?.value||'active';let arr=D.sales.filter(s=>(st==='all'||s.status===st)&&(cname(s.customer_id).toLocaleLowerCase('tr-TR').includes(q)));saleTable.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Ürün</th><th>Kg</th><th>Tutar</th><th>Kâr</th><th>Durum</th><th></th></tr>${arr.slice(0,250).map(s=>{const profit=Number(s.total||0)-Number(s.cost_total||0);return`<tr><td>${esc(s.sale_date)}</td><td><b>${esc(cname(s.customer_id))}</b></td><td>${esc(pname(s.sale_items?.[0]?.product_id))}</td><td>${kg(s.sale_items?.reduce((a,i)=>a+Number(i.quantity||0),0))}</td><td>${money(s.total)}</td><td class="${profit>=0?'green':'red'}">${money(profit)}</td><td><span class="badge ${s.status==='cancelled'?'red':'green'}">${s.status==='cancelled'?'İptal':'Aktif'}</span></td><td>${s.status==='cancelled'?'':'<button class="btn danger" onclick="event.stopPropagation();cancelSale(\''+s.id+'\')">İptal</button>'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Satış bulunamadı.</td></tr>'}</table></div>`}
function customersPage(){if(D.customer){customerDetail(D.customer);return}page('Müşteriler',`${D.customers.length} aktif cari hesap`,'<div class="toolbar"><input class="search" id="custSearch" placeholder="Müşteri, telefon veya kod ara..." oninput="filterCustomers()"><button class="btn success" onclick="customerModal()">＋ Yeni Müşteri</button></div><div id="custTable"></div>');filterCustomers()}
function filterCustomers(){const q=(custSearch?.value||'').toLocaleLowerCase('tr-TR');const arr=D.customers.filter(c=>(`${c.name} ${c.phone||''} ${c.customer_code||''}`).toLocaleLowerCase('tr-TR').includes(q));custTable.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>No</th><th>Müşteri</th><th>Telefon</th><th>Grup</th><th>Vade</th><th>Bakiye</th></tr>${arr.map((c,i)=>{const b=customerBalance(c.id);return`<tr class="clickable" onclick="D.customer='${c.id}';render()"><td>${i+1}</td><td><b>${esc(c.name)}</b><small class="muted">${esc(c.customer_code||'')}</small></td><td>${esc(c.phone||'-')}</td><td>${esc(c.customer_group||c.customer_type||'-')}</td><td>${c.default_due_days??0} gün</td><td class="${b>0?'amber':b<0?'green':''}"><b>${money(b)}</b></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Müşteri bulunamadı.</td></tr>'}</table></div>`}
function customerDetail(id){const c=D.customers.find(x=>x.id===id);if(!c){D.customer=null;return customersPage()}const ss=activeSales().filter(s=>s.customer_id===id),cs=activeCollections().filter(x=>x.customer_id===id),b=customerBalance(id);content.innerHTML=`<div class="head"><div><button class="btn secondary" onclick="D.customer=null;render()">← Müşteriler</button><h1 style="margin-top:12px">${esc(c.name)}</h1><p>${esc(c.phone||'Telefon yok')} · ${esc(c.customer_code||'Kod yok')}</p></div><div><button class="btn success" onclick="saleModal('${id}')">＋ Bu Müşteriye Satış</button> <button class="btn primary" onclick="collectionModal('${id}')">₺ Tahsilat</button></div></div><div class="cards"><div class="card"><small>Güncel Bakiye</small><div class="value ${b>0?'amber':'green'}">${money(b)}</div></div><div class="card"><small>Toplam Satış</small><div class="value">${money(ss.reduce((a,s)=>a+Number(s.total||0),0))}</div></div><div class="card"><small>Toplam Tahsilat</small><div class="value green">${money(cs.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card"><small>Vade</small><div class="value">${c.default_due_days??0} gün</div></div></div><div class="split"><section class="panel"><h2>Satışlar</h2><div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Kg</th><th>Tutar</th><th>Açık</th></tr>${ss.slice(0,100).map(s=>`<tr onclick="saleDetail('${s.id}')" class="clickable"><td>${esc(s.sale_date)}</td><td>${kg(s.sale_items?.reduce((a,i)=>a+Number(i.quantity||0),0))}</td><td>${money(s.total)}</td><td>${money(openAmt(s))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Satış yok.</td></tr>'}</table></div></section><section class="panel"><h2>Tahsilatlar</h2><div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Tür</th><th>Tutar</th><th>Açıklama</th></tr>${cs.slice(0,100).map(x=>`<tr><td>${esc(x.collection_date)}</td><td>${esc(x.payment_type)}</td><td class="green">${money(x.amount)}</td><td>${esc(x.notes||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tahsilat yok.</td></tr>'}</table></div></section></div>`}
function collectionsPage(){page('Tahsilatlar','Cari tahsilatlarını tek yerden yönet','<div class="toolbar"><input class="search" id="colSearch" placeholder="Müşteri ara..." oninput="filterCollections()"><button class="btn success" onclick="collectionModal()">＋ Tahsilat</button></div><div id="colTable"></div>');filterCollections()}
function filterCollections(){const q=(colSearch?.value||'').toLocaleLowerCase('tr-TR');const arr=activeCollections().filter(c=>cname(c.customer_id).toLocaleLowerCase('tr-TR').includes(q));colTable.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Tür</th><th>Tutar</th><th>Açıklama</th></tr>${arr.slice(0,200).map(c=>`<tr><td>${esc(c.collection_date)}</td><td><b>${esc(cname(c.customer_id))}</b></td><td>${esc(c.payment_type)}</td><td class="green">${money(c.amount)}</td><td>${esc(c.notes||'-')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tahsilat yok.</td></tr>'}</table></div>`}
function duePage(){const late=activeSales().filter(s=>s.due_date&&s.due_date<today()&&openAmt(s)>0),tod=activeSales().filter(s=>s.due_date===today()&&openAmt(s)>0),future=activeSales().filter(s=>s.due_date&&s.due_date>today()&&openAmt(s)>0);page('Vade Takibi','Bugün, geciken ve gelecek vadeler',`<div class="cards"><div class="card"><small>Bugün</small><div class="value amber">${money(tod.reduce((a,s)=>a+openAmt(s),0))}</div></div><div class="card"><small>Gecikmiş</small><div class="value red">${money(late.reduce((a,s)=>a+openAmt(s),0))}</div></div><div class="card"><small>Gelecek</small><div class="value blue">${money(future.reduce((a,s)=>a+openAmt(s),0))}</div></div><div class="card"><small>Toplam Alacak</small><div class="value">${money(receivable())}</div></div></div><div class="tablewrap"><table class="table"><tr><th>Müşteri</th><th>Vade</th><th>Gün</th><th>Durum</th><th>Kalan</th><th></th></tr>${[...late,...tod,...future].sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date))).slice(0,250).map(s=>{const d=Math.ceil((new Date(s.due_date)-new Date(today()))/86400000);return`<tr><td><b>${esc(cname(s.customer_id))}</b></td><td>${esc(s.due_date)}</td><td>${d<0?Math.abs(d)+' gün gecikmiş':d===0?'Bugün':d+' gün'}</td><td><span class="badge ${d<0?'red':d===0?'amber':'blue'}">${d<0?'Gecikmiş':d===0?'Bugün':'Gelecek'}</span></td><td>${money(openAmt(s))}</td><td><button class="btn primary" onclick="collectionModal('${s.customer_id}','${s.id}')">Tahsilat</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Açık vade yok.</td></tr>'}</table></div>`,'')}
function purchasesPage(){page('Alışlar','Tedarikçi alışları',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Tedarikçi</th><th>Depo</th><th>Toplam</th></tr>${D.purchases.slice(0,150).map(p=>`<tr><td>${esc(p.purchase_date)}</td><td>${esc(p.supplier_name||'-')}</td><td>${esc(wname(p.warehouse_id))}</td><td>${money(p.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Alış yok.</td></tr>'}</table></div>`)}
function expensesPage(){page('Giderler','İşletme giderleri',`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Kategori</th><th>Açıklama</th><th>Ödeme</th><th>Tutar</th></tr>${D.expenses.slice(0,150).map(e=>`<tr><td>${esc(e.expense_date)}</td><td>${esc(e.category)}</td><td>${esc(e.description||'-')}</td><td>${esc(e.payment_type||'-')}</td><td>${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Gider yok.</td></tr>'}</table></div>`)}
function stockPage(){page('Stok','Depo + ürün + kg + maliyet takibi',`<div class="cards">${D.warehouses.map(w=>`<div class="card"><small>${esc(w.name)}</small><div class="value blue">${kg(stockFor(w.id,null))}</div><span class="muted">${money(stockCost(w.id,null))}</span></div>`).join('')}<div class="card"><small>Toplam Stok</small><div class="value">${kg(stockFor(null,null))}</div><span class="muted">${money(stockCost(null,null))}</span></div></div><div class="tablewrap"><table class="table"><tr><th>Depo</th><th>Ürün</th><th>Miktar</th><th>Ort. Maliyet</th><th>Değer</th></tr>${D.warehouses.flatMap(w=>D.products.map(p=>`<tr><td>${esc(w.name)}</td><td>${esc(p.name)}</td><td>${kg(stockFor(w.id,p.id))}</td><td>${money(avgCost(w.id,p.id))}/kg</td><td>${money(stockCost(w.id,p.id))}</td></tr>`)).join('')||'<tr><td colspan="5" class="empty">Stok verisi yok.</td></tr>'}</table></div>`)}
function reportsPage(){const rev=activeSales().reduce((a,s)=>a+Number(s.total||0),0),cost=activeSales().reduce((a,s)=>a+Number(s.cost_total||0),0),exp=D.expenses.reduce((a,e)=>a+Number(e.amount||0),0),profit=rev-cost;const month=activeSales().filter(s=>String(s.sale_date||'').slice(0,7)===today().slice(0,7)),mrev=month.reduce((a,s)=>a+Number(s.total||0),0),mcost=month.reduce((a,s)=>a+Number(s.cost_total||0),0),mexp=D.expenses.filter(e=>String(e.expense_date||'').slice(0,7)===today().slice(0,7)).reduce((a,e)=>a+Number(e.amount||0),0);page('Raporlar','Kömür işine özel yönetici özeti',`<div class="cards"><div class="card"><small>Toplam Ciro</small><div class="value">${money(rev)}</div></div><div class="card"><small>Toplam Maliyet</small><div class="value">${money(cost)}</div></div><div class="card"><small>Brüt Kâr</small><div class="value green">${money(profit)}</div></div><div class="card"><small>Gider</small><div class="value red">${money(exp)}</div></div></div><section class="panel" style="box-shadow:none;padding:0"><h2>Bu Ay</h2><div class="row"><div><b>Ciro</b></div><b>${money(mrev)}</b></div><div class="row"><div><b>Maliyet</b></div><b>${money(mcost)}</b></div><div class="row"><div><b>Brüt Kâr</b></div><b class="green">${money(mrev-mcost)}</b></div><div class="row"><div><b>Gider</b></div><b class="red">${money(mexp)}</b></div><div class="row"><div><b>Net sonuç</b></div><b class="${mrev-mcost-mexp>=0?'green':'red'}">${money(mrev-mcost-mexp)}</b></div></section>`)}
function saleModal(customerId=''){const c=D.customers.find(x=>x.id===customerId),w=D.warehouses[0],p=D.products[0];openModal(`<div class="modalbox"><div class="modalhead"><h2>Hızlı Satış</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgrid"><div><label>Müşteri</label><select id="smCustomer" onchange="saleCustomerChanged()"><option value="">Peşin / Cari yok</option>${D.customers.map(x=>`<option value="${x.id}" ${x.id===customerId?'selected':''}>${esc(x.name)}${customerBalance(x.id)>0?' · '+money(customerBalance(x.id)):''}</option>`).join('')}</select></div><div><label>Depo</label><select id="smWarehouse">${D.warehouses.map(x=>`<option value="${x.id}" ${x.id===w?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Ürün</label><select id="smProduct">${D.products.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${esc(x.name)} (${esc(x.unit)})</option>`).join('')}</select></div><div><label>Tarih</label><input id="smDate" type="date" value="${today()}"></div></div><label>Miktar (kg)</label><input id="smQty" type="number" min="0.1" step="0.1" value="25" oninput="saleCalc()"><div class="quickkg"><button onclick="smQty.value=10;saleCalc()">10 kg</button><button onclick="smQty.value=25;saleCalc()">25 kg</button><button onclick="smQty.value=50;saleCalc()">50 kg</button><button onclick="smQty.value=100;saleCalc()">100 kg</button></div><div class="formgrid"><div><label>Satış Fiyatı (kg)</label><input id="smPrice" type="number" min="0" step="0.01" value="45" oninput="saleCalc()"></div><div><label>KDV (%)</label><input id="smVat" type="number" min="0" step="1" value="20" oninput="saleCalc()"></div><div><label>Ödeme</label><select id="smPayment" onchange="salePaymentChanged()"><option>Nakit</option><option>Havale/EFT</option><option>Kart</option><option>Vadeli</option></select></div><div id="dueWrap" class="hidden"><label>Vade Tarihi</label><input id="smDue" type="date"></div></div><label>Açıklama</label><textarea id="smNotes" placeholder="Teslimat, irsaliye veya özel not..."></textarea><div class="summary" id="saleSummary"></div><div id="saleNotice"></div><div class="formactions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn success" onclick="saveSale()">Satışı Kaydet</button></div></div>`);saleCalc();saleCustomerChanged();if(c&&c.default_due_days){smDue.value=new Date(Date.now()+Number(c.default_due_days)*86400000).toISOString().slice(0,10)}}
function saleCustomerChanged(){const c=D.customers.find(x=>x.id===smCustomer.value);if(c){if(c.special_price!=null&&Number(c.special_price)>0)smPrice.value=c.special_price;else if(c.default_due_days){}saleNotice.innerHTML=customerBalance(c.id)>0?`<div class="notice">Bu müşterinin mevcut bakiyesi: ${money(customerBalance(c.id))}</div>`:''}else saleNotice.innerHTML='';saleCalc()}
function salePaymentChanged(){const vad=smPayment.value==='Vadeli';dueWrap.classList.toggle('hidden',!vad);if(vad&&!smDue.value){const c=D.customers.find(x=>x.id===smCustomer.value);smDue.value=new Date(Date.now()+Number(c?.default_due_days||7)*86400000).toISOString().slice(0,10)}}
function saleCalc(){const q=Number(smQty?.value||0),p=Number(smPrice?.value||0),v=Number(smVat?.value||0),sub=q*p,vat=sub*v/100,total=sub+vat;const ac=avgCost(smWarehouse?.value,smProduct?.value);saleSummary.innerHTML=`<div class="row"><div><b>Net</b></div><b>${money(sub)}</b></div><div class="row"><div><b>KDV</b></div><b>${money(vat)}</b></div><div class="row"><div><b>Genel Toplam</b></div><b class="value" style="font-size:21px">${money(total)}</b></div><div class="row"><div><small>Mevcut ortalama maliyet</small></div><b>${money(ac)}/kg</b></div><div class="row"><div><small>Tahmini brüt kâr</small></div><b class="${total-q*ac>=0?'green':'red'}">${money(total-q*ac)}</b></div>`}
async function saveSale(){const s=await db.auth.getSession(),u=s.data.session?.user;if(!u)return toast('Oturum bulunamadı',true);const customer=smCustomer.value||null,payment=smPayment.value,due=payment==='Vadeli'?(smDue.value||null):null;if(!smWarehouse.value||!smProduct.value)return toast('Depo ve ürün seçin',true);if(payment==='Vadeli'&&!due)return toast('Vadeli satış için vade tarihi gerekli',true);const r=await db.rpc('record_sale',{p_customer_id:customer,p_warehouse_id:smWarehouse.value,p_product_id:smProduct.value,p_sale_date:smDate.value,p_payment_type:payment,p_due_date:due,p_quantity:Number(smQty.value),p_unit_price:Number(smPrice.value),p_vat_rate:Number(smVat.value),p_created_by:u.id,p_notes:smNotes.value.trim()||null});if(r.error)return toast('Satış kaydedilemedi: '+r.error.message,true);closeModal();await load();toast('Satış kaydedildi. Stok ve cari otomatik işlendi.')}
function collectionModal(customerId='',saleId=''){const c=D.customers.find(x=>x.id===customerId);openModal(`<div class="modalbox"><div class="modalhead"><h2>Tahsilat Al</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgrid"><div><label>Müşteri</label><select id="cmCustomer" onchange="collectionCustomerChanged()"><option value="">Müşteri seçin</option>${D.customers.map(x=>`<option value="${x.id}" ${x.id===customerId?'selected':''}>${esc(x.name)} · ${money(customerBalance(x.id))}</option>`).join('')}</select></div><div><label>Satışa mahsup (opsiyonel)</label><select id="cmSale"><option value="">Genel cari tahsilat</option>${activeSales().filter(s=>!customerId||s.customer_id===customerId).filter(s=>openAmt(s)>0).map(s=>`<option value="${s.id}" ${s.id===saleId?'selected':''}>${s.sale_date} · ${money(openAmt(s))}</option>`).join('')}</select></div><div><label>Tarih</label><input id="cmDate" type="date" value="${today()}"></div><div><label>Ödeme Türü</label><select id="cmPayment"><option>Nakit</option><option>Havale/EFT</option><option>Kart</option></select></div></div><label>Tahsilat Tutarı</label><input id="cmAmount" type="number" min="0.01" step="0.01" value="${saleId?openAmt(D.sales.find(s=>s.id===saleId)):''}"><label>Açıklama</label><textarea id="cmNotes" placeholder="Ödeme notu..."></textarea><div id="cmInfo"></div><div class="formactions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn success" onclick="saveCollection()">Tahsilatı Kaydet</button></div></div>`);collectionCustomerChanged()}
function collectionCustomerChanged(){const id=cmCustomer.value;cmInfo.innerHTML=id?`<div class="notice">Güncel cari bakiye: ${money(customerBalance(id))}</div>`:'';const sales=activeSales().filter(s=>s.customer_id===id&&openAmt(s)>0);if(id){cmSale.innerHTML='<option value="">Genel cari tahsilat</option>'+sales.map(s=>`<option value="${s.id}">${s.sale_date} · ${money(openAmt(s))}</option>`).join('')}}
async function saveCollection(){const r=await db.rpc('record_collection',{p_customer_id:cmCustomer.value,p_amount:Number(cmAmount.value),p_collection_date:cmDate.value,p_payment_type:cmPayment.value,p_sale_id:cmSale.value||null,p_notes:cmNotes.value.trim()||null});if(r.error)return toast('Tahsilat kaydedilemedi: '+r.error.message,true);closeModal();await load();toast('Tahsilat kaydedildi ve cari bakiye güncellendi.')}
function customerModal(){openModal(`<div class="modalbox"><div class="modalhead"><h2>Yeni Müşteri</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgrid"><div><label>Müşteri / Firma Adı *</label><input id="ncName"></div><div><label>Telefon</label><input id="ncPhone"></div><div><label>Müşteri Kodu</label><input id="ncCode" placeholder="Örn. M-001"></div><div><label>Müşteri Grubu</label><input id="ncGroup" placeholder="Restoran / Kasap / Diğer"></div><div><label>Varsayılan Vade (gün)</label><input id="ncDue" type="number" min="0" value="0"></div><div><label>Kredi Limiti</label><input id="ncLimit" type="number" min="0" step="0.01" value="0"></div><div><label>Özel Kg Fiyatı</label><input id="ncPrice" type="number" min="0" step="0.01" placeholder="Boş bırakılabilir"></div><div><label>WhatsApp</label><input id="ncWhatsapp"></div></div><label>Adres</label><textarea id="ncAddress"></textarea><label>Not</label><textarea id="ncNotes"></textarea><div class="formactions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn success" onclick="saveCustomer()">Müşteriyi Kaydet</button></div></div>`)}
async function saveCustomer(){if(!ncName.value.trim())return toast('Müşteri adı zorunlu',true);const r=await db.from('customers').insert({name:ncName.value.trim(),phone:ncPhone.value.trim()||null,customer_code:ncCode.value.trim()||null,customer_group:ncGroup.value.trim()||null,default_due_days:Number(ncDue.value||0),credit_limit:Number(ncLimit.value||0),special_price:ncPrice.value?Number(ncPrice.value):null,whatsapp:ncWhatsapp.value.trim()||null,address:ncAddress.value.trim()||null,notes:ncNotes.value.trim()||null,is_active:true}).select().single();if(r.error)return toast('Müşteri kaydedilemedi: '+r.error.message,true);closeModal();await load();D.customer=r.data.id;render();toast('Yeni müşteri oluşturuldu.')}
function saleDetail(id){const s=D.sales.find(x=>x.id===id);if(!s)return;const items=s.sale_items||[];openModal(`<div class="modalbox"><div class="modalhead"><h2>Satış Detayı</h2><button class="x" onclick="closeModal()">×</button></div><div class="cards"><div class="card"><small>Müşteri</small><div class="value" style="font-size:18px">${esc(cname(s.customer_id))}</div></div><div class="card"><small>Tarih</small><div class="value" style="font-size:18px">${esc(s.sale_date)}</div></div><div class="card"><small>Toplam</small><div class="value" style="font-size:18px">${money(s.total)}</div></div><div class="card"><small>Açık</small><div class="value amber" style="font-size:18px">${money(openAmt(s))}</div></div></div><div class="tablewrap"><table class="table"><tr><th>Ürün</th><th>Kg</th><th>Kg Fiyatı</th><th>Maliyet</th></tr>${items.map(i=>`<tr><td>${esc(pname(i.product_id))}</td><td>${kg(i.quantity)}</td><td>${money(i.unit_price)}</td><td>${money(i.unit_cost)}/kg</td></tr>`).join('')}</table></div><div class="summary"><div class="row"><div>Ödeme</div><b>${esc(s.payment_type)}</b></div><div class="row"><div>Vade</div><b>${esc(s.due_date||'Yok')}</b></div><div class="row"><div>KDV</div><b>${money(s.vat_amount)}</b></div><div class="row"><div>Brüt kâr</div><b class="green">${money(Number(s.total||0)-Number(s.cost_total||0))}</b></div><div class="row"><div>Not</div><b>${esc(s.notes||'-')}</b></div></div>${s.status==='active'?`<div class="formactions"><button class="btn danger" onclick="cancelSale('${s.id}')">Satışı İptal Et</button></div>`:''}</div>`)}
async function cancelSale(id){const reason=prompt('İptal nedeni:');if(reason===null)return;const r=await db.rpc('cancel_sale',{p_sale_id:id,p_reason:reason.trim()||null});if(r.error)return toast('İptal başarısız: '+r.error.message,true);closeModal();await load();toast('Satış iptal edildi; stok geri işlendi.')}
function toast(msg,error=false){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:100;padding:12px 16px;border-radius:12px;background:#172033;color:#fff;font-weight:800;font-size:13px;box-shadow:0 10px 30px #0003;max-width:90vw';document.body.appendChild(t)}t.style.background=error?'#b42318':'#172033';t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),3500)}
if(!location.hash)render();
</script>
</body>
