<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Stok Sayımı</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{padding:10px;border:1px solid #d0d5dd;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.ok{background:#087443;color:white}.muted{color:#667085}.num{width:130px}.cost{width:140px}</style></head><body><main class="wrap"><h1>📋 Stok Sayımı / Mevcut Stok Girişi</h1><p class="muted">Depoda zaten bulunan malları alış faturası oluşturmadan sisteme başlangıç/sayım stoğu olarak gir.</p><div class="card"><div class="toolbar"><label>Depo <select id="warehouse"></select></label><label>Sayım tarihi <input id="date" type="date"></label><input id="search" placeholder="Ürün ara" oninput="render()"></div></div><div class="card"><table><thead><tr><th>Ürün</th><th>Birim</th><th>Sayım miktarı</th><th>Birim maliyet</th><th>Toplam maliyet</th></tr></thead><tbody id="list"></tbody></table></div><div class="card"><textarea id="notes" rows="3" style="width:100%" placeholder="Sayım notu"></textarea><br><br><button class="btn ok" onclick="post()">Stok Sayımını Kaydet</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let products=[];async function init(){date.value=new Date().toISOString().slice(0,10);let [w,p]=await Promise.all([db.from('warehouses').select('id,name').eq('is_active',true).order('name'),db.from('products').select('id,name,unit,purchase_price,stock_quantity').eq('is_active',true).order('name')]);if(w.error||p.error)return alert((w.error||p.error).message);warehouse.innerHTML=w.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');products=p.data||[];render()}function render(){let q=(search.value||'').toLocaleLowerCase('tr-TR');list.innerHTML=products.filter(x=>x.name.toLocaleLowerCase('tr-TR').includes(q)).map(x=>`<tr data-id="${x.id}"><td><b>${x.name}</b></td><td>${x.unit}</td><td><input class="num" id="q_${x.id}" type="number" min="0" step="0.001" value="${Number(x.stock_quantity||0)}"></td><td><input class="cost" id="c_${x.id}" type="number" min="0" step="0.01" value="${Number(x.purchase_price||0)}"></td><td id="t_${x.id}">0,00 TL</td></tr>`).join('');products.forEach(x=>{let q=document.getElementById('q_'+x.id),c=document.getElementById('c_'+x.id);const calc=()=>document.getElementById('t_'+x.id).textContent=((Number(q.value)||0)*(Number(c.value)||0)).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});q.oninput=c.oninput=calc;calc()})}async function post(){if(!warehouse.value)return alert('Depo seçmelidir.');let items=products.map(x=>({product_id:x.id,counted_quantity:Number(document.getElementById('q_'+x.id)?.value||0),unit_cost:Number(document.getElementById('c_'+x.id)?.value||0)}));if(!items.length)return alert('Ürün bulunamadı.');let r=await db.rpc('post_stock_count',{p_warehouse_id:warehouse.value,p_count_date:date.value,p_notes:notes.value.trim()||null,p_items:items});if(r.error)return alert(r.error.message);alert('Stok sayımı kaydedildi. Mevcut stoklar güncellendi.');await init()}init();</script></body></html>
