<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Müşteri Özel Ürün Fiyatları</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{padding:10px;border:1px solid #d0d5dd;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:850;cursor:pointer}.ok{background:#087443;color:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:10px}.box{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%)}.hidden{display:none}label{display:block;font-weight:800;margin:9px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}@media(max-width:700px){table{font-size:12px}}</style></head><body><main class="wrap"><h1>💵 Müşteri Özel Ürün Fiyatları</h1><p>Ürün kartındaki varsayılan fiyat otomatik gelir. Burada tanımlanan müşteri özel fiyatı, geçerli olduğu sürece onun yerine kullanılır.</p><div class="card"><div class="bar"><select id="customer" onchange="load()"><option value="">Müşteri seçin</option></select><button class="btn ok" onclick="openForm()">+ Özel Fiyat Ekle</button></div></div><div class="card"><table><thead><tr><th>Ürün</th><th>Varsayılan</th><th>Özel fiyat</th><th>Geçerlilik</th><th>Durum</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let customers=[],products=[],prices=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){let [c,p]=await Promise.all([db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('products').select('id,name,unit,sale_price').eq('is_active',true).order('name')]);if(c.error||p.error)return alert((c.error||p.error).message);customers=c.data||[];products=p.data||[];customer.innerHTML='<option value="">Müşteri seçin</option>'+customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}async function load(){if(!customer.value){rows.innerHTML='<tr><td colspan="6">Önce müşteri seçin.</td></tr>';return}let r=await db.from('customer_product_prices').select('id,product_id,unit_price,min_quantity,valid_from,valid_to,is_active,notes').eq('customer_id',customer.value).order('product_id');if(r.error)return alert(r.error.message);prices=r.data||[];rows.innerHTML=prices.map(x=>{let p=products.find(a=>a.id===x.product_id);return`<tr><td>${esc(p?.name||'Silinmiş ürün')}</td><td>${money(p?.sale_price)}</td><td><b>${money(x.unit_price)}</b></td><td>${esc(x.valid_from)} → ${esc(x.valid_to||'süresiz')}</td><td>${x.is_active?'Aktif':'Pasif'}</td><td><button class="btn" onclick="edit('${x.id}')">Düzenle</button></td></tr>`}).join('')||'<tr><td colspan="6">Bu müşteriye özel fiyat tanımlanmamış.</td></tr>'}function openForm(id){let x=prices.find(a=>a.id===id)||{product_id:'',unit_price:'',min_quantity:0,valid_from:new Date().toISOString().slice(0,10),valid_to:'',is_active:true,notes:''};modal.innerHTML=`<div class="box"><h2>${id?'Özel Fiyatı Düzenle':'Yeni Özel Fiyat'}</h2><label>Ürün<select id="product">${products.map(p=>`<option value="${p.id}" ${p.id===x.product_id?'selected':''}>${esc(p.name)} · varsayılan ${money(p.sale_price)}</option>`).join('')}</select></label><label>Özel kg/birim fiyatı<input id="price" type="number" min="0" step="0.01" value="${Number(x.unit_price)||''}"></label><label>Minimum miktar<input id="minq" type="number" min="0" step="0.001" value="${Number(x.min_quantity)||0}"></label><label>Başlangıç<input id="from" type="date" value="${esc(x.valid_from)}"></label><label>Bitiş <small>(boş bırakılabilir)</small><input id="to" type="date" value="${esc(x.valid_to||'')}"></label><label>Not<textarea id="notes">${esc(x.notes||'')}</textarea></label><label>Durum<select id="active"><option value="true" ${x.is_active?'selected':''}>Aktif</option><option value="false" ${!x.is_active?'selected':''}>Pasif</option></select></label><button class="btn ok" onclick="save('${id||''}')">Kaydet</button> <button class="btn" onclick="closeModal()">Kapat</button></div>`;modal.classList.remove('hidden')}function edit(id){openForm(id)}async function save(id){if(!customer.value)return alert('Müşteri seçin.');let payload={customer_id:customer.value,product_id:product.value,unit_price:Number(document.getElementById('price').value),min_quantity:Number(document.getElementById('minq').value)||0,valid_from:document.getElementById('from').value,valid_to:document.getElementById('to').value||null,is_active:document.getElementById('active').value==='true',notes:document.getElementById('notes').value.trim()||null};if(payload.unit_price<0||!payload.valid_from)return alert('Fiyat ve başlangıç tarihi zorunlu.');let r=id?await db.from('customer_product_prices').update(payload).eq('id',id):await db.from('customer_product_prices').insert(payload);if(r.error)return alert(r.error.message);closeModal();load()}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}init();</script></body></html>
