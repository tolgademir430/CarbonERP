<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP V23 · Dağıtım</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,.panel{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.v{font-size:25px;font-weight:900}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:white}.btn{border:0!important;font-weight:800;cursor:pointer}.green{background:#087443!important;color:white}.dark{background:#172033!important;color:white}.red{color:#b42318}.amber{color:#b54708}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:white;border-radius:16px;padding:18px;width:min(680px,100%);max-height:90vh;overflow:auto}.hidden{display:none}.item{display:grid;grid-template-columns:1fr 120px 40px;gap:7px;margin:7px 0}.status{display:flex;gap:5px;flex-wrap:wrap}.status button{padding:8px;border:1px solid #ddd;border-radius:8px;background:white;font-weight:800}.status button.on{background:#172033;color:white}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.table{font-size:12px}.wrap{padding:10px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>CarbonERP V23</h1><p>Dağıtım ve teslimat merkezi</p></div><button class="btn green" onclick="newDelivery()">＋ Yeni Teslimat</button></div><div class="cards" id="cards"></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Müşteri / plaka / şoför ara..." oninput="render()"><select id="filter" onchange="render()"><option value="all">Tüm durumlar</option><option value="pending">Bekliyor</option><option value="preparing">Hazırlanıyor</option><option value="loaded">Araca Yüklendi</option><option value="out_for_delivery">Dağıtımda</option><option value="delivered">Teslim Edildi</option><option value="cancelled">İptal</option></select><input id="date" type="date" onchange="render()"></div><div id="table"></div></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={rows:[],customers:[],products:[]};const today=()=>new Date().toISOString().slice(0,10),money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL',esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>D.customers.find(x=>x.id===id)?.name||'Bilinmiyor';const pname=id=>D.products.find(x=>x.id===id)?.name||'Ürün';const statusText={pending:'Bekliyor',preparing:'Hazırlanıyor',loaded:'Araca Yüklendi',out_for_delivery:'Dağıtımda',delivered:'Teslim Edildi',cancelled:'İptal'};async function load(){const [a,b,c]=await Promise.all([db.from('delivery_orders').select('*,delivery_items(*)').order('delivery_date',{ascending:false}),db.from('customers').select('id,name,phone,address').eq('is_active',true).order('name'),db.from('products').select('id,name,unit').eq('is_active',true).order('name')]);if(a.error)alert(a.error.message);D.rows=a.data||[];D.customers=b.data||[];D.products=c.data||[];render()}function render(){const f=filter.value,q=search.value.toLocaleLowerCase('tr-TR'),dt=date.value||'';let rows=D.rows.filter(x=>(f==='all'||x.status===f)&&(!dt||x.delivery_date===dt)&&(`${cname(x.customer_id)} ${x.driver_name||''} ${x.vehicle_plate||''}`.toLocaleLowerCase('tr-TR').includes(q)));const counts={pending:D.rows.filter(x=>x.status==='pending').length,preparing:D.rows.filter(x=>x.status==='preparing').length,loaded:D.rows.filter(x=>x.status==='loaded').length,out:D.rows.filter(x=>x.status==='out_for_delivery').length,delivered:D.rows.filter(x=>x.status==='delivered').length};cards.innerHTML=`<div class="card"><small>Bekliyor</small><div class="v">${counts.pending}</div></div><div class="card"><small>Hazırlanıyor</small><div class="v">${counts.preparing}</div></div><div class="card"><small>Araca Yüklendi</small><div class="v">${counts.loaded}</div></div><div class="card"><small>Dağıtımda</small><div class="v amber">${counts.out}</div></div><div class="card"><small>Teslim Edildi</small><div class="v">${counts.delivered}</div></div>`;table.innerHTML=`<div style="overflow:auto"><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Şoför</th><th>Araç</th><th>Durum</th><th></th></tr>${rows.map(x=>`<tr><td>${x.delivery_date}</td><td><b>${esc(cname(x.customer_id))}</b><br><small>${esc(x.address||'')}</small></td><td>${Number(x.total_kg||0).toLocaleString('tr-TR')} kg</td><td>${esc(x.driver_name||'-')}</td><td>${esc(x.vehicle_plate||'-')}</td><td><span class="badge">${statusText[x.status]}</span></td><td><button class="btn dark" onclick="detail('${x.id}')">Detay</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px">Teslimat bulunamadı.</td></tr>'}</table></div>`}function close(){modal.classList.add('hidden');modal.innerHTML=''}function newDelivery(){modal.innerHTML=`<div class="box"><div class="head"><h2>Yeni Teslimat</h2><button onclick="close()">×</button></div><div class="formgrid"><div><label>Müşteri *</label><select id="dc">${D.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Teslimat Tarihi</label><input id="dd" type="date" value="${today()}"></div><div><label>Şoför</label><input id="driver"></div><div><label>Araç Plakası</label><input id="plate"></div></div><label>Adres</label><textarea id="addr"></textarea><label>Ürünler</label><div id="items"></div><button class="btn" onclick="addItem()">＋ Ürün Ekle</button><label>Not</label><textarea id="notes"></textarea><div style="text-align:right;margin-top:15px"><button class="btn green" onclick="saveDelivery()">Teslimatı Oluştur</button></div></div>`;modal.classList.remove('hidden');addItem();dc.onchange=()=>{const c=D.customers.find(x=>x.id===dc.value);if(c){addr.value=c.address||''}};dc.onchange()}function addItem(){const d=document.createElement('div');d.className='item';d.innerHTML=`<select>${D.products.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input type="number" min="0.1" step="0.1" placeholder="Kg"><button onclick="this.parentElement.remove()">×</button>`;items.appendChild(d)}async function saveDelivery(){const arr=[...items.children].map(x=>({product_id:x.children[0].value,quantity:Number(x.children[1].value)})).filter(x=>x.quantity>0);if(!dc.value||!arr.length)return alert('Müşteri ve en az bir ürün gerekli.');const r=await db.rpc('create_delivery',{p_customer_id:dc.value,p_sale_id:null,p_delivery_date:dd.value,p_address:addr.value.trim()||null,p_notes:notes.value.trim()||null,p_items:arr});if(r.error)return alert(r.error.message);const id=r.data;await db.rpc('set_delivery_status',{p_delivery_id:id,p_status:'pending',p_note:`Şoför: ${driver.value.trim()||'-'} · Araç: ${plate.value.trim()||'-'}`,p_driver_name:driver.value.trim()||null,p_vehicle_plate:plate.value.trim()||null});close();await load();alert('Teslimat oluşturuldu.')}function detail(id){const x=D.rows.find(y=>y.id===id);modal.innerHTML=`<div class="box"><div class="head"><div><h2>${esc(cname(x.customer_id))}</h2><small>${x.delivery_date} · ${Number(x.total_kg).toLocaleString('tr-TR')} kg</small></div><button onclick="close()">×</button></div><div class="status">${Object.entries(statusText).map(([k,v])=>`<button class="${x.status===k?'on':''}" onclick="changeStatus('${x.id}','${k}')">${v}</button>`).join('')}</div><div class="card"><b>Adres:</b><br>${esc(x.address||'-')}<br><br><b>Şoför:</b> ${esc(x.driver_name||'-')} &nbsp; <b>Araç:</b> ${esc(x.vehicle_plate||'-')}</div><h3>Yük</h3>${(x.delivery_items||[]).map(i=>`<div class="card"><b>${esc(pname(i.product_id))}</b> — ${Number(i.quantity).toLocaleString('tr-TR')} kg</div>`).join('')}<label>Durum notu</label><textarea id="sn"></textarea></div>`;modal.classList.remove('hidden')}async function changeStatus(id,status){const r=await db.rpc('set_delivery_status',{p_delivery_id:id,p_status:status,p_note:sn?.value?.trim()||null});if(r.error)return alert(r.error.message);close();await load()}load();date.value=today()</script></body></html>
