name: Apply V20 audit patch
on:
  push:
    paths:
      - 'scripts/apply_v20_audit.py'
      - '.github/workflows/apply-v20-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V20 patch
        run: python scripts/apply_v20_audit.py
      - name: Commit V20
        run: |
          git config user.name 'carbonerp-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html scripts/apply_v20_audit.py .github/workflows/apply-v20-audit.yml
          git diff --cached --quiet || git commit -m 'CarbonERP: V20 full audit and safe transaction model'
          git push
