name: CarbonERP V15 Sales

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'CarbonERP: apply V15 sales') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V15 sales screen
        run: python3 scripts/apply_v15_sales.py
      - name: Commit updated app
        run: |
          git config user.name "CarbonERP Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "CarbonERP: apply V15 sales"
          git push
