name: CarbonERP V20 customer profile
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/customer_module_clean_v20.py'
      - 'scripts/customer_legacy_cleanup_v20.py'
      - 'scripts/validate_customer_module_v20.py'
      - 'scripts/cari-ekstre-v20.js'
      - '.github/workflows/customer-profile-v20.yml'
permissions:
  contents: write
jobs:
  customer-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore hardened V20 application base
        run: |
          git fetch --no-tags origin d0a5d82df3d3d22614c1293e0ac060ec2326a92b --depth=1
          git show d0a5d82df3d3d22614c1293e0ac060ec2326a92b:index.html > index.html
      - name: Remove legacy nested print scripts
        run: python scripts/customer_legacy_cleanup_v20.py
      - name: Build clean customer module
        run: python scripts/customer_module_clean_v20.py
      - name: Inject detailed customer statement V20
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          module=Path('scripts/cari-ekstre-v20.js').read_text(encoding='utf-8')
          text=index.read_text(encoding='utf-8')
          start='/* CARBONERP_CARI_EKSTRE_V20 */'
          if start in text:
              a=text.index(start)
              b=text.index('</script>',a)+len('</script>')
              text=text[:a]+text[b:]
          marker='<!-- CARBONERP_CARI_EKSTRE_V20 -->'
          if marker not in text:
              text=text.replace('</body>','<script>\n'+module+'\n</script>\n'+marker+'\n</body>',1)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Validate detailed statement injection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['CARBONERP_CARI_EKSTRE_V20','customerDetail','renderCustomerStatement','printCustomerStatement']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          if s.count('<script>') != s.count('</script>'): raise SystemExit('Script tag mismatch')
          PY
      - name: Validate customer module
        run: python scripts/validate_customer_module_v20.py
      - name: Commit
        run: |
          git config user.name 'carbonerp-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html scripts/customer_module_clean_v20.py scripts/customer_legacy_cleanup_v20.py scripts/validate_customer_module_v20.py scripts/cari-ekstre-v20.js .github/workflows/customer-profile-v20.yml
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'CarbonERP: complete detailed customer statement'; git push; fi
