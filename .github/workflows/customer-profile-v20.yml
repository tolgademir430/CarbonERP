name: CarbonERP V20 customer profile
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/customer_module_clean_v20.py'
      - 'scripts/customer_legacy_cleanup_v20.py'
      - '.github/workflows/customer-profile-v20.yml'
permissions:
  contents: write
jobs:
  customer-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore validated V20 application base
        run: |
          git fetch --no-tags origin 778ef55df18df9cae62bd33e9fcd70870d614b9c --depth=1
          git show 778ef55df18df9cae62bd33e9fcd70870d614b9c:index.html > index.html
      - name: Remove legacy nested print scripts
        run: python scripts/customer_legacy_cleanup_v20.py
      - name: Build clean customer module
        run: python scripts/customer_module_clean_v20.py
      - name: Validate HTML/JavaScript
        run: python scripts/validate_v20.py
      - name: Commit
        run: |
          git config user.name 'carbonerp-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html scripts/customer_module_clean_v20.py scripts/customer_legacy_cleanup_v20.py .github/workflows/customer-profile-v20.yml
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'CarbonERP: clean customer profile and detailed statement'; git push; fi
