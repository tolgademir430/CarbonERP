name: Normalize CarbonERP sales fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put sales fix in main document
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="sales-fix.js"></script>'
          s=s.replace(tag,'')
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html body kapanışı bulunamadı')
          s=s.rsplit(marker,1)[0]+tag+'\n'+marker+s.rsplit(marker,1)[1]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit normalized index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix V15.1 sales script placement"
          git push
