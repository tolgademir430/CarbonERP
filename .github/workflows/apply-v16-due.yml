name: CarbonERP V16 Due Tracking

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_v16_due.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V16 due tracking
        run: python3 scripts/apply_v16_due.py
      - name: Commit updated app
        run: |
          git config user.name "CarbonERP Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "CarbonERP: V16 due tracking"
          git push
