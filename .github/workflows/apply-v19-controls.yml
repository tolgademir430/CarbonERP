name: CarbonERP V19 Controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v19_controls.py'
      - '.github/workflows/apply-v19-controls.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V19 controls
        run: python3 scripts/apply_v19_controls.py
      - name: Commit updated app
        run: |
          git config user.name "CarbonERP Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "CarbonERP: V19 sales and collection controls"
          git pull --rebase origin main
          git push
