name: Inject Cari Ekstre V20
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cari-ekstre-v20.js'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject module into index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          module=Path('scripts/cari-ekstre-v20.js').read_text(encoding='utf-8')
          text=index.read_text(encoding='utf-8')
          start='/* CARBONERP_CARI_EKSTRE_V20 */'
          if start in text:
              a=text.index(start)
              b=text.index('</script>', a)
              text=text[:a]+text[b:]
          marker='<!-- CARBONERP_CARI_EKSTRE_V20 -->'
          if marker not in text:
              text=text.replace('</body>', '<script>\n'+module+'\n</script>\n'+marker+'\n</body>', 1)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Validate injected JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('scripts/cari-ekstre-v20.js').read_text(encoding='utf-8')
          required=['customerDetail','renderCustomerStatement','printCustomerStatement','CARBONERP_CARI_EKSTRE_V20']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          if s.count('{') != s.count('}'): raise SystemExit('Brace mismatch in module')
          PY
      - name: Commit injection
        run: |
          git config user.name 'CarbonERP Bot'
          git config user.email 'carbonerp-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add detailed customer statement V20'
          git push
