<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#20252b}
header{height:64px;background:#20252b;color:#fff;display:flex;align-items:center;padding:0 24px;justify-content:space-between}.logo{font-size:22px;font-weight:700}
nav{background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;gap:7px;overflow:auto}nav button{border:0;background:transparent;padding:10px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}nav button.active,nav button:hover{background:#eceff2}
main{max-width:1250px;margin:24px auto;padding:0 20px}h1{margin:0 0 5px;font-size:26px}.sub{color:#68717a;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e1e4e7;border-radius:12px;padding:18px;box-shadow:0 1px 2px #00000008}.card small{color:#68717a}.value{font-size:24px;font-weight:700;margin-top:7px}.positive{color:#16734a}.warning{color:#9a6700}.danger{color:#b42318}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel h2{font-size:17px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#68717a;margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid #cfd4d9;border-radius:8px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#20252b;color:#fff}.secondary{background:#eceff2}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee}th{color:#68717a;font-size:12px}.empty{text-align:center;color:#68717a;padding:30px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 8px 30px #00000012}.loginbox h1{margin-bottom:20px}.loginbox .field{margin-bottom:14px}.status{font-size:12px;color:#68717a;margin-top:10px}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>

<body>
<div id="loginScreen"><div class="loginbox"><h1>CarbonERP</h1><div class="sub">Bulut sistemi</div>
<div class="field"><label>E-posta</label><input id="loginEmail" type="email"></div>
<div class="field"><label>Şifre</label><input id="loginPassword" type="password"></div>
<button class="btn primary" style="width:100%" onclick="login()">Giriş Yap</button>
<div id="loginStatus" class="status"></div></div></div>
<div id="appShell" style="display:none"><header><div class="logo">CarbonERP</div><div><span id="userEmail"></span> <button class="btn secondary" onclick="logout()">Çıkış</button></div></header><nav id="nav"></nav><main id="app"></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mrsnkzfoodryzyekuwyq.supabase.co";
const SUPABASE_KEY="sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let data={customers:[],sales:[],collections:[],purchases:[],expenses:[],stockMovements:[],stockQty:0,stockCost:0};
let warehouse=null,product=null,currentUser=null;

function money(n){return Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL'}
function vatCalc(base, rate){
  const b=Number(base||0), r=Number(rate||0);
  return {base:b, vat:b*r/100, total:b*(1+r/100)};
}
function vatOptions(selected=20){
  return [0,1,10,20].map(v=>`<option value="${v}" ${Number(selected)===v?'selected':''}>%${v}</option>`).join('');
}

function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(e){return e?.message||String(e)}
function customerName(id){return data.customers.find(c=>c.id===id)?.name||'Bilinmiyor'}
function weightedCost(){
  // Moving weighted-average cost:
  // stock value / stock quantity. Purchase extra costs are already included
  // in stock movement total_cost; sales remove cost at the current average.
  return data.stockQty>0 ? data.stockCost/data.stockQty : 0;
}
function stockSnapshot(){
  return {
    qty: Number(data.stockQty||0),
    value: Number(data.stockCost||0),
    avg: weightedCost()
  };
}
function customerBalance(id){return data.sales.filter(s=>s.customer_id===id).reduce((a,s)=>a+s.total,0)-data.collections.filter(c=>c.customer_id===id).reduce((a,c)=>a+c.amount,0)}
function totalReceivable(){return data.sales.reduce((a,s)=>a+s.total,0)-data.collections.reduce((a,c)=>a+c.amount,0)}

async function login(){
 const email=loginEmail.value.trim(),password=loginPassword.value;
 document.getElementById('loginStatus').textContent='Giriş yapılıyor...';
 const {error}=await client.auth.signInWithPassword({email,password});
 if(error) document.getElementById('loginStatus').textContent=msg(error); else document.getElementById('loginStatus').textContent='';
}
async function logout(){await client.auth.signOut()}
client.auth.onAuthStateChange(async (_event,session)=>{
 if(session){currentUser=session.user;loginScreen.style.display='none';appShell.style.display='block';userEmail.textContent=session.user.email;await loadData();await repairLegacyGeneralCollections();await loadData();show(savedPage())}
 else{currentUser=null;appShell.style.display='none';loginScreen.style.display='flex'}
});

async function loadData(){
 const [cu,sa,co,pu,pi,ex,sm,w,p]=await Promise.all([
  client.from('customers').select('*').eq('is_active',true).order('name'),
  client.from('sales').select('*,sale_items(*)').order('sale_date'),
  client.from('collections').select('*').order('collection_date'),
  client.from('purchases').select('*,purchase_items(*)').order('purchase_date'),
  client.from('purchase_items').select('*'),
  client.from('expenses').select('*').order('expense_date'),
  client.from('stock_movements').select('*').order('movement_date'),
  client.from('warehouses').select('*').eq('is_active',true).limit(1).maybeSingle(),
  client.from('products').select('*').eq('is_active',true).limit(1).maybeSingle()
 ]);
 for(const r of [cu,sa,co,pu,ex,sm,w,p]) if(r.error) throw r.error;
 data.customers=cu.data||[];data.sales=sa.data||[];data.collections=co.data||[];data.purchases=pu.data||[];data.expenses=ex.data||[];data.stockMovements=sm.data||[];warehouse=w.data;product=p.data;
 data.stockQty=data.stockMovements.reduce((a,m)=>a+Number(m.quantity||0),0);
 data.stockCost=data.stockMovements.reduce((a,m)=>a+Number(m.total_cost||0),0);
}
function nav(page){const pages=['dashboard','sales','customers','collections','due','purchases','expenses','stock','reports'];const labels={dashboard:'Dashboard',sales:'Satış',customers:'Müşteriler',collections:'Tahsilatlar',due:'Vade Takibi',purchases:'Alışlar',expenses:'Giderler',stock:'Stok',reports:'Raporlar'};return pages.map(x=>`<button class="${x===page?'active':''}" onclick="show('${x}')">${labels[x]}</button>`).join('')}
const CARBONERP_PAGES=['dashboard','sales','customers','collections','due','purchases','expenses','stock','reports'];
function savedPage(){const p=sessionStorage.getItem('carbonerp_current_page');return CARBONERP_PAGES.includes(p)?p:'dashboard'}
async function show(page){
  if(!CARBONERP_PAGES.includes(page)) page='dashboard';
  sessionStorage.setItem('carbonerp_current_page',page);
  history.replaceState(null,'','#'+page);
  document.getElementById('nav').innerHTML=nav(page);
  document.getElementById('app').innerHTML=({dashboard,sales,customers,collections,due,purchases,expenses,stock,reports})[page]();
}
function daysLate(d){if(!d)return 0;const a=new Date(d+'T23:59:59'),b=new Date(today()+'T23:59:59');return Math.max(0,Math.floor((b-a)/86400000))}
function saleCollected(saleId){return data.collections.filter(c=>c.sale_id===saleId).reduce((a,c)=>a+Number(c.amount||0),0)}
function saleOutstanding(s){return Math.max(0,Number(s.total||0)-saleCollected(s.id))}
function overdueSales(){return data.sales.filter(s=>s.due_date && saleOutstanding(s)>0 && s.due_date<today())}
function dueTodaySales(){return data.sales.filter(s=>s.due_date===today() && saleOutstanding(s)>0)}

function monthKey(d){ return String(d||'').slice(0,7); }
function monthlySummary(){
  const map={};
  (data.sales||[]).forEach(s=>{
    const k=monthKey(s.sale_date); if(!k)return;
    if(!map[k])map[k]={sales:0,cost:0,kg:0};
    map[k].sales+=Number(s.subtotal||0);
    map[k].cost+=Number(s.cost_total||0);
    map[k].kg+=Number(s.sale_items?.[0]?.quantity||0);
  });
  return Object.keys(map).sort().slice(-6).map(k=>{
    const x=map[k], profit=x.sales-x.cost;
    return {k,...x,profit,margin:x.sales?profit/x.sales*100:0};
  });
}
function monthlySummaryTable(){
  const rows=monthlySummary();
  if(!rows.length)return '<div class="empty">Henüz aylık satış verisi yok.</div>';
  return `<table><tr><th>Ay</th><th>Ciro</th><th>Maliyet</th><th>Brüt Kâr</th><th>Marj</th><th>Kg</th></tr>${
    rows.map(x=>`<tr><td>${x.k}</td><td>${money(x.sales)}</td><td>${money(x.cost)}</td><td class="${x.profit>=0?'positive':'danger'}">${money(x.profit)}</td><td>%${x.margin.toFixed(1)}</td><td>${x.kg.toLocaleString('tr-TR')}</td></tr>`).join('')
  }</table>`;
}

function printCustomerStatement(customerId){
  const c=(data.customers||[]).find(x=>x.id===customerId);
  if(!c){alert('Müşteri bulunamadı');return;}
  const sales=(data.sales||[]).filter(x=>x.customer_id===customerId);
  const rows=sales.map(s=>`<tr><td>${esc(s.sale_date||'')}</td><td>Satış</td><td>${esc(s.invoice_no||s.id||'')}</td><td>${money(s.total||0)}</td><td>${money(saleOutstanding(s))}</td></tr>`).join('');
  const w=window.open('','_blank');
  if(!w)return;
  w.document.write(`<html><head><title>Cari Ekstre - ${esc(c.name||'')}</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:8px;text-align:left}h1{margin-bottom:4px}.total{margin-top:20px;font-size:20px;font-weight:bold}</style><style id="carbonerp-delivery-v14">
.delivery-note{font-family:Arial,sans-serif;color:#111}.delivery-note h1{font-size:24px;margin:0 0 6px}.delivery-note .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.delivery-note table{width:100%;border-collapse:collapse}.delivery-note th,.delivery-note td{border:1px solid #bbb;padding:8px}.delivery-note .sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:55px}.delivery-note .line{border-top:1px solid #999;padding-top:7px;text-align:center}@media print{.delivery-print-actions{display:none!important}}
</style>
<style id="carbonerp-v15-sales">
.sale-fast-card{border:1px solid #d9e6dc;background:#f5fbf7;border-radius:10px;padding:12px}
#s_customer_search{font-size:16px}
@media(max-width:600px){.formgrid{grid-template-columns:1fr!important}.actions .btn{flex:1}.panel{padding:14px}}
</style>
<style id="carbonerp-v17-collection">.sale-fast-card{border:1px solid #d9e6dc;background:#f5fbf7;border-radius:10px;padding:12px}@media(max-width:600px){#modalbox .formgrid{grid-template-columns:1fr!important}#modalbox{padding:16px}.modalbox .actions .btn{flex:1}}</style></head><body><h1>CarbonERP - Cari Ekstre</h1><div><b>Müşteri:</b> ${esc(c.name||'')}</div><table><tr><th>Tarih</th><th>İşlem</th><th>Belge</th><th>İşlem Tutarı</th><th>Kalan</th></tr>${rows||'<tr><td colspan="5">Kayıt yok</td></tr>'}</table><div class="total">Toplam Açık Bakiye: ${money(sales.reduce((a,s)=>a+saleOutstanding(s),0))}</div><script>window.onload=()=>window.print()<\/script><script src="sales-fix.js"><\/script>
<script src="sales-fix.js"><\/script>
</body></html>`);
  w.document.close();
}
function dashboard(){
  let ds=data.sales.filter(s=>s.sale_date===today());
  let de=data.expenses.filter(e=>e.expense_date===today());
  let rev=ds.reduce((a,s)=>a+Number(s.total||0),0);
  let base=ds.reduce((a,s)=>a+Number(s.subtotal||0),0);
  let cost=ds.reduce((a,s)=>a+Number(s.cost_total||0),0);
  let exp=de.reduce((a,e)=>a+Number(e.amount||0),0);
  let gross=base-cost, net=gross-exp;
  let over=overdueSales(),due=dueTodaySales();
  return `<section><h1>Ana Dashboard</h1><div class="sub">Bugünün satış, maliyet, gider ve kârlılık özeti</div>
  <div class="cards">
    <div class="card"><small>Bugünkü Satış (KDV dahil)</small><div class="value">${money(rev)}</div></div>
    <div class="card"><small>Bugünkü Ciro (KDV hariç)</small><div class="value">${money(base)}</div></div>
    <div class="card"><small>Bugünkü Brüt Kâr</small><div class="value positive">${money(gross)}</div></div>
    <div class="card"><small>Bugünkü Gider</small><div class="value">${money(exp)}</div></div>
    <div class="card"><small>Bugünkü Net Kâr</small><div class="value ${net>=0?'positive':'danger'}">${money(net)}</div></div>
    <div class="card"><small>Toplam Cari Alacak</small><div class="value warning">${money(totalReceivable())}</div></div>
    <div class="card"><small>Vadesi Geçen</small><div class="value warning">${money(over.reduce((a,s)=>a+saleOutstanding(s),0))}</div></div>
    <div class="card"><small>Depo Stoku</small><div class="value">${data.stockQty.toLocaleString('tr-TR')} kg</div></div>
  </div>
  <div class="panel"><h2>Yönetici Özeti</h2>
    <div class="sub">Bugünkü operasyonun hızlı görünümü</div>
    <table><tr><th>Gösterge</th><th>Tutar</th></tr>
      <tr><td>Toplam cari alacak</td><td>${money(totalReceivable())}</td></tr>
      <tr><td>Bugün tahsil edilen</td><td>${money((data.collections||[]).filter(x=>x.collection_date===today()).reduce((a,x)=>a+Number(x.amount||0),0))}</td></tr>
      <tr><td>Toplam stok değeri</td><td>${money(data.stockCost)}</td></tr>
      <tr><td>Ortalama stok maliyeti</td><td>${money(weightedCost())}/kg</td></tr>
    </table>
  </div>
  <div class="grid">
    <div class="panel"><h2>Vade Takibi</h2>${dueTable([...over,...due])}</div>
    <div class="panel"><h2>Son Satışlar</h2>${salesTable(data.sales.slice(-8).reverse())}</div>
  </div>
  <div class="panel"><h2>Son 6 Ay Performansı</h2>${monthlySummaryTable()}</div>
  <div class="panel"><h2>Stok ve Maliyet</h2><table><tr><th>Ürün</th><th>Stok</th><th>Ortalama Maliyet</th><th>Değer</th></tr><tr><td>${esc(product?.name||'Mangal Kömürü')}</td><td>${data.stockQty} kg</td><td>${money(weightedCost())}/kg</td><td>${money(data.stockCost)}</td></tr></table></div>
  </section>`;
}
function dueTable(arr){if(!arr.length)return '<div class="empty">Vadesi gelen açık satış yok.</div>';return `<table><tr><th>Müşteri</th><th>Vade</th><th>Kalan</th><th>Durum</th><th></th></tr>${arr.map(s=>{let late=daysLate(s.due_date),out=saleOutstanding(s);return `<tr><td>${esc(customerName(s.customer_id))}</td><td>${s.due_date}</td><td class="warning">${money(out)}</td><td>${s.due_date<today()?`<span class="warning">${late} gün gecikmiş</span>`:'Bugün'}</td><td><button class="btn secondary" onclick="openCollectionForSale('${s.id}')">Tahsilat</button></td></tr>`}).join('')}</table>`}
function salesTable(arr){if(!arr.length)return '<div class="empty">Henüz satış yok.</div>';return `<table><tr><th>Tarih</th><th>Müşteri</th><th>Tutar</th><th>Vade</th><th>Kalan</th><th>Kâr</th></tr>${arr.map(s=>`<tr><td>${s.sale_date}</td><td>${esc(customerName(s.customer_id))}</td><td>${money(s.total)}</td><td>${s.due_date||'Peşin'}</td><td>${s.due_date?money(saleOutstanding(s)):'-'}</td><td class="positive">${money(Number(s.subtotal||s.total)-Number(s.cost_total))}</td></tr>`).join('')}</table>`}
function sales(){
 const c0=data.customers?.[0];
 return `<section>
 <div class="toolbar"><div><h1>Satış Ekle</h1><div class="sub">Hızlı satış: müşteri seç, miktar ve fiyatı gir, sonucu anında kontrol et.</div></div><div class="actions" style="margin-top:0"><button class="btn secondary" onclick="show('sales')">Satışlar Listesi</button></div></div>
 <div class="grid">
  <div>
   <div class="panel">
    <h2>Müşteri</h2>
    <div class="formgrid">
     <div class="field" style="grid-column:1/-1"><label>Müşteri Ara</label><input id="s_customer_search" type="search" placeholder="Müşteri adı veya telefon ara..." oninput="filterSaleCustomers()"></div>
     <div class="field" style="grid-column:1/-1"><label>Müşteri</label><select id="s_customer" onchange="updateSaleCustomerInfo()">${(data.customers||[]).map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}</select></div>
    </div>
    <div id="saleCustomerInfo" class="status" style="padding:12px;border:1px solid #d9e6dc;border-radius:8px;background:#f5fbf7"></div>
   </div>
   <div class="panel" style="margin-top:18px">
    <h2>Miktar ve Fiyat</h2>
    <div class="formgrid">
     <div class="field"><label>Miktar (kg)</label><div class="actions" style="justify-content:flex-start;margin:0 0 8px"><button type="button" class="btn secondary" onclick="setSaleKg(10)">10 kg</button><button type="button" class="btn secondary" onclick="setSaleKg(25)">25 kg</button><button type="button" class="btn secondary" onclick="setSaleKg(50)">50 kg</button><button type="button" class="btn secondary" onclick="setSaleKg(100)">100 kg</button></div><input id="s_kg" type="number" min="0" step="0.01" value="100" oninput="previewSale()"></div>

function v16DateOnly(d){return new Date(d+'T00:00:00')}
function v16DiffDays(from,to){const a=v16DateOnly(from),b=v16DateOnly(to);return Math.round((b-a)/86400000)}
function v16Status(s){
  const out=saleOutstanding(s), d=s.due_date;
  if(out<=0)return {label:'Kapandı',cls:'positive',days:0};
  if(!d)return {label:'Vade yok',cls:'warning',days:0};
  const diff=v16DiffDays(today(),d);
  if(diff<0)return {label:Math.abs(diff)+' gün gecikmiş',cls:'danger',days:diff};
  if(diff===0)return {label:'Bugün vadesi',cls:'warning',days:0};
  if(diff<=7)return {label:diff+' gün kaldı',cls:'warning',days:diff};
  return {label:diff+' gün kaldı',cls:'positive',days:diff};
}

 return {rows,overdue,todayRows,next7,overdueAmount:overdue.reduce((a,s)=>a+saleOutstanding(s),0),todayAmount:todayRows.reduce((a,s)=>a+saleOutstanding(s),0),next7Amount:next7.reduce((a,s)=>a+saleOutstanding(s),0)};

async function repairLegacyGeneralCollections(){
 const legacy=data.collections.filter(c=>!c.sale_id&&Number(c.amount||0)>0);
 let changed=false;
 for(const c of legacy){
   let remaining=Number(c.amount||0);
   const openSales=data.sales.filter(s=>s.customer_id===c.customer_id&&saleOutstanding(s)>0).sort((a,b)=>{
     const ad=a.due_date||'9999-12-31',bd=b.due_date||'9999-12-31';
     return ad.localeCompare(bd)||String(a.sale_date||'').localeCompare(String(b.sale_date||''));
   });
   for(let i=0;i<openSales.length&&remaining>0.0001;i++){
     const sale=openSales[i],allocation=Math.min(remaining,saleOutstanding(sale));
     if(allocation<=0)continue;
     if(i===0){
       const {error}=await client.from('collections').update({sale_id:sale.id,amount:Number(allocation.toFixed(2))}).eq('id',c.id);
       if(error)throw error;
     }else{
       const {error}=await client.from('collections').insert({customer_id:c.customer_id,sale_id:sale.id,collection_date:c.collection_date,payment_type:c.payment_type,amount:Number(allocation.toFixed(2)),created_by:c.created_by});
       if(error)throw error;
     }
     remaining-=allocation;changed=true;
   }
 }
 return changed;
}

async function addCollection(){try{
 const id=col_c.value,a=+col_amount.value,saleId=col_sale.value||null;if(!(a>0))return alert('Tahsilat tutarı girin.');
 if(!id)return alert('Müşteri seçin.');
 const collectionDate=col_date.value,paymentType=col_method.value;
 if(saleId){
   const sale=data.sales.find(s=>s.id===saleId);if(!sale)return alert('Satış bulunamadı.');

   if(a>max+0.0001)return alert('Tahsilat kalan bakiyeyi aşamaz. Maksimum: '+money(max));
   const {error}=await client.from('collections').insert({customer_id:id,sale_id:saleId,collection_date:collectionDate,payment_type:paymentType,amount:Number(a.toFixed(2)),created_by:currentUser.id});
   if(error)throw error;
 }else{
   const openSales=data.sales.filter(s=>s.customer_id===id&&saleOutstanding(s)>0).sort((a,b)=>{
     const ad=a.due_date||'9999-12-31',bd=b.due_date||'9999-12-31';
     return ad.localeCompare(bd)||String(a.sale_date||'').localeCompare(String(b.sale_date||''));
   });
   const totalOpen=openSales.reduce((sum,s)=>sum+saleOutstanding(s),0);
   if(totalOpen<=0)return alert('Bu müşteri için açık bakiye bulunmuyor.');

   let remaining=a;

let total=productCost;
let {data:pur,error}=await client.from('purchases').insert({warehouse_id:warehouse.id,purchase_date:p_date.value,subtotal:base,vat_amount:vatAmount,extra_cost:extra,total}).select().single();if(error)throw error;let {error:e1}=await client.from('purchase_items').insert({purchase_id:pur.id,product_id:product.id,quantity:q,unit_price:pr,line_total:q*pr});if(e1)throw e1;let {error:e2}=await client.from('stock_movements').insert({warehouse_id:warehouse.id,product_id:product.id,movement_date:p_date.value,movement_type:'purchase',quantity:q,unit_cost:total/q,total_cost:productCost,reference_id:pur.id});if(e2)throw e2;await loadData();alert('Alış buluta kaydedildi.');show('purchases')}catch(e){alert(msg(e))}}
function expenses(){return `<section><h1>Giderler</h1><div class="sub">İşletme giderleri net kâra yansır.</div><div class="panel"><div class="formgrid"><div class="field"><label>Tarih</label><input id="e_date" type="date" value="${today()}"></div><div class="field"><label>Tür</label><select id="e_type"><option>Yakıt</option><option>Personel</option><option>Kira</option><option>Araç</option><option>Telefon/İnternet</option><option>Depo</option><option>Nakliye</option><option>Banka/POS</option><option>Vergi/Harç</option><option>Pazarlama</option><option>Bakım/Onarım</option><option>Diğer</option></select></div><div class="field"><label>Tutar</label><input id="e_amount" type="number" min="0" step=".01"></div><div class="field"><label>Ödeme Şekli</label><select id="e_method"><option>Nakit</option><option>Havale/EFT</option><option>Kredi Kartı</option><option>Diğer</option></select></div><div class="field"><label>Açıklama</label><input id="e_note"></div></div><div class="actions"><button class="btn primary" onclick="addExpense()">Gideri Kaydet</button></div></div><div class="panel" style="margin-top:18px">${data.expenses.length?`<table><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th>Ödeme</th><th>Tutar</th></tr>${data.expenses.slice().reverse().map(e=>`<tr><td>${e.expense_date}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${esc(e.payment_type||"")}</td><td>${money(e.amount)}</td></tr>`).join('')}</table>`:'<div class="empty">Henüz gider yok.</div>'}</div></section>`}

function daysBetween(a,b){
  const x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  return Math.floor((y-x)/86400000);
}
function agingBucket(days){
  if(days<=30) return '0-30 gün';
  if(days<=60) return '31-60 gün';
  if(days<=90) return '61-90 gün';
  return '90+ gün';
}
function receivableAging(){
  const todayStr=today();
  const rows=(data.sales||[]).map(s=>{
    const out=saleOutstanding(s);
    if(out<=0) return null;
    const due=s.due_date || s.sale_date;
    const age=Math.max(0,daysBetween(due,todayStr));
    return {s,out,due,age,bucket:agingBucket(age),customer:customerName(s.customer_id)};
  }).filter(Boolean);
  const buckets=['0-30 gün','31-60 gün','61-90 gün','90+ gün'];
  return buckets.map(b=>({bucket:b,amount:rows.filter(x=>x.bucket===b).reduce((a,x)=>a+x.out,0),count:rows.filter(x=>x.bucket===b).length}));
}
function periodLabel(f,t){ return f===t ? f : `${f} → ${t}`; }


function vatReport(f,t){
  const sales=(data.sales||[]).filter(x=>x.sale_date>=f&&x.sale_date<=t);
  const purchases=(data.purchases||[]).filter(x=>x.purchase_date>=f&&x.purchase_date<=t);
  const salesBase=sales.reduce((a,x)=>a+Number(x.subtotal||0),0);
  const outputVat=sales.reduce((a,x)=>a+Number(x.vat_amount||0),0);
  const inputVat=purchases.reduce((a,x)=>a+Number(x.vat_amount||0),0);
  const payable=outputVat-inputVat;
  const rateMap={};
  sales.forEach(x=>{const r=Number(x.vat_rate||0);rateMap[r]=(rateMap[r]||0)+Number(x.vat_amount||0)});
  return `<div class="panel"><h2>KDV Raporu</h2>
    <table><tr><th>Kalem</th><th>Tutar</th></tr>
      <tr><td>Satış matrahı (KDV hariç)</td><td>${money(salesBase)}</td></tr>
      <tr><td>Hesaplanan satış KDV</td><td>${money(outputVat)}</td></tr>
      <tr><td>Alışlarda kaydedilen KDV</td><td>${money(inputVat)}</td></tr>
      <tr><td><b>Hesaplanan fark</b></td><td class="${payable>=0?'warning':'positive'}"><b>${money(payable)}</b></td></tr>
    </table>
    <div class="sub">Satış KDV'sinin oranlara göre dağılımı</div>
    <table><tr><th>KDV oranı</th><th>KDV</th></tr>
      ${Object.keys(rateMap).sort((a,b)=>Number(a)-Number(b)).map(r=>`<tr><td>%${r}</td><td>${money(rateMap[r])}</td></tr>`).join('')}
    </table>
    <div class="status">Bu rapor CarbonERP içindeki işlem kayıtlarına göre hesaplanır; resmi vergi beyannamesi yerine geçmez.</div>
  </div>`;
}
function reportHtml(f,t){
  let s=data.sales.filter(x=>x.sale_date>=f&&x.sale_date<=t);
  let e=data.expenses.filter(x=>x.expense_date>=f&&x.expense_date<=t);

  // Profit is calculated on VAT-excluded sales revenue.
  // Purchase VAT is already included in stock/cost because that is how
  // CarbonERP was configured for this business.
  let salesBase=s.reduce((a,x)=>a+Number(x.subtotal||0),0);
  let salesVat=s.reduce((a,x)=>a+Number(x.vat_amount||0),0);
  let salesTotal=s.reduce((a,x)=>a+Number(x.total||0),0);
  let c=s.reduce((a,x)=>a+Number(x.cost_total||0),0);
  let g=salesBase-c;
  let x=e.reduce((a,y)=>a+Number(y.amount||0),0);
  let n=g-x;
  let kg=s.reduce((a,x)=>a+Number(x.sale_items?.[0]?.quantity||0),0);

  return `<div class="cards">
    <div class="card"><small>Satış Cirosu (KDV hariç)</small><div class="value">${money(salesBase)}</div></div>
    <div class="card"><small>Satış KDV'si</small><div class="value">${money(salesVat)}</div></div>
    <div class="card"><small>Müşteriye Kesilen Toplam</small><div class="value">${money(salesTotal)}</div></div>
    <div class="card"><small>Satılan Miktar</small><div class="value">${kg.toLocaleString('tr-TR')} kg</div></div>
    <div class="card"><small>Satılan Malın Maliyeti</small><div class="value">${money(c)}</div></div>
    <div class="card"><small>Brüt Kâr</small><div class="value positive">${money(g)}</div></div>
    <div class="card"><small>İşletme Giderleri</small><div class="value">${money(x)}</div></div>
    <div class="card"><small>Net Kâr / Zarar</small><div class="value ${n>=0?'positive':'danger'}">${money(n)}</div></div>
  </div>
  <div class="panel">
    <h2>Kâr / Zarar Özeti</h2>
    <table>
      <tr><th>Kalem</th><th>Tutar</th></tr>
      <tr><td>Satışlar (KDV hariç)</td><td>${money(salesBase)}</td></tr>
      <tr><td>Satılan malın maliyeti</td><td>${money(c)}</td></tr>
      <tr><td><b>Brüt kâr</b></td><td><b>${money(g)}</b></td></tr>
      <tr><td>İşletme giderleri</td><td>${money(x)}</td></tr>
      <tr><td><b>Net kâr / zarar</b></td><td class="${n>=0?'positive':'danger'}"><b>${money(n)}</b></td></tr>
    </table>
    <div class="status">Satış KDV'si kâr hesabına dahil edilmez. Alışlarda KDV, mevcut stok maliyet politikanıza göre maliyete dahil edilir.</div>
  </div>
  <div class="panel">
    <h2>Gider Dağılımı</h2>
    ${expenseBreakdown(e)}
  </div>
  ${vatReport(f,t)}
  <div class="panel">
    <h2>Cari Yaşlandırma</h2>
    ${agingTable()}
  </div>
  <div class="panel">
    <h2>Müşteri Kârlılığı</h2>
    ${customerProfit(s)}
  </div>
  <div class="panel">
    <h2>Satış Performansı</h2>
    ${salesPerformance(s)}
  </div>`;
}
function agingTable(){
  const a=receivableAging();
  const total=a.reduce((z,x)=>z+x.amount,0);
  return `<table><tr><th>Vade Yaşı</th><th>Dosya/Satış</th><th>Alacak</th><th>Pay</th></tr>${
    a.map(x=>`<tr><td>${x.bucket}</td><td>${x.count}</td><td>${money(x.amount)}</td><td>%${total?(x.amount/total*100).toFixed(1):'0.0'}</td></tr>`).join('')
  }</table><div class="status">Toplam açık cari: <b>${money(total)}</b></div>`;
}
function salesPerformance(s){
  if(!s.length) return '<div class="empty">Bu dönemde satış yok.</div>';
  let kg=0;
  s.forEach(x=>{ kg += Number(x.sale_items?.[0]?.quantity||0); });
  let revenue=s.reduce((z,x)=>z+Number(x.subtotal||0),0);
  let cost=s.reduce((z,x)=>z+Number(x.cost_total||0),0);
  let profit=revenue-cost;
  let avgKg=kg?revenue/kg:0;
  let margin=revenue?profit/revenue*100:0;
  return `<table>
    <tr><th>Gösterge</th><th>Sonuç</th></tr>
    <tr><td>Satış adedi</td><td>${s.length}</td></tr>
    <tr><td>Satılan miktar</td><td>${kg.toLocaleString('tr-TR')} kg</td></tr>
    <tr><td>Ortalama satış fiyatı</td><td>${money(avgKg)}/kg</td></tr>
    <tr><td>Brüt kâr</td><td>${money(profit)}</td></tr>
    <tr><td>Brüt kâr marjı</td><td>%${margin.toFixed(1)}</td></tr>
  </table>`;
}
function expenseBreakdown(e){
  if(!e.length) return '<div class="empty">Bu dönemde gider yok.</div>';
  let cats=[...new Set(e.map(x=>x.category||'Diğer'))];
  return `<table><tr><th>Gider Türü</th><th>Toplam</th><th>Pay</th></tr>${
    cats.map(cat=>{
      let amount=e.filter(x=>(x.category||'Diğer')===cat).reduce((a,x)=>a+Number(x.amount||0),0);
      let total=e.reduce((a,x)=>a+Number(x.amount||0),0);
      let pct=total?amount/total*100:0;
      return `<tr><td>${esc(cat)}</td><td>${money(amount)}</td><td>%${pct.toFixed(1)}</td></tr>`;
    }).join('')
  }</table>`;
}
function stockReport(){
  return `<div class="panel"><h2>Stok Raporu</h2>
  <table><tr><th>Ürün</th><th>Miktar</th><th>Ortalama Maliyet</th><th>Stok Değeri</th></tr>
  <tr><td>${esc(product?.name||'Mangal Kömürü')}</td><td>${Number(data.stockQty||0).toLocaleString('tr-TR')} kg</td><td>${money(weightedCost())}/kg</td><td>${money(data.stockCost)}</td></tr></table>
  </div>`;
}
function renderReport(){report.innerHTML=reportHtml(rf.value,rt.value)}
function customerProfit(s){
  let ids=[...new Set(s.map(x=>x.customer_id))];
  if(!ids.length)return '<div class="empty">Satış yok.</div>';
  return `<table><tr><th>Müşteri</th><th>Kg</th><th>Ciro (KDV hariç)</th><th>Maliyet</th><th>Brüt Kâr</th><th>Marj</th></tr>${
    ids.map(id=>{
      let a=s.filter(x=>x.customer_id===id);
      let kg=a.reduce((z,x)=>z+Number(x.sale_items?.[0]?.quantity||0),0);
      let r=a.reduce((z,x)=>z+Number(x.subtotal||0),0);
      let c=a.reduce((z,x)=>z+Number(x.cost_total||0),0);
      let p=r-c;
      let m=r?p/r*100:0;
      return `<tr><td>${esc(customerName(id))}</td><td>${kg.toLocaleString('tr-TR')}</td><td>${money(r)}</td><td>${money(c)}</td><td class="${p>=0?'positive':'danger'}">${money(p)}</td><td>%${m.toFixed(1)}</td></tr>`;
    }).join('')
  }</table>`;
}

<script>
/* CARBONERP_V20_CORE
   Safe accounting model:
   - never physically delete financial transactions
   - sales and collections are cancellable records
   - cancelled records are excluded from operational balances
   - stock cancellation uses reversing movements
   - all calculations use the same active-record predicates
*/
(function(){
  const ACTIVE_SALE=s=>s && s.status!=='cancelled';
  const ACTIVE_COLLECTION=c=>c && c.status!=='cancelled';
  const activeSales=()=> (data.sales||[]).filter(ACTIVE_SALE);
  const activeCollections=()=> (data.collections||[]).filter(ACTIVE_COLLECTION);

  window.carbonV20={ACTIVE_SALE,ACTIVE_COLLECTION,activeSales,activeCollections};

  window.saleCollected=function(saleId){
    return activeCollections().filter(c=>c.sale_id===saleId).reduce((a,c)=>a+Number(c.amount||0),0);
  };
  window.saleOutstanding=function(s){
    if(!ACTIVE_SALE(s)) return 0;
    return Math.max(0,Number(s.total||0)-saleCollected(s.id));
  };
  window.customerBalance=function(id){
    const debit=activeSales().filter(s=>s.customer_id===id).reduce((a,s)=>a+Number(s.total||0),0);
    const credit=activeCollections().filter(c=>c.customer_id===id).reduce((a,c)=>a+Number(c.amount||0),0);
    return debit-credit;
  };
  window.totalReceivable=function(){
    return activeSales().reduce((a,s)=>a+Number(s.total||0),0)-activeCollections().reduce((a,c)=>a+Number(c.amount||0),0);
  };
  window.overdueSales=function(){return activeSales().filter(s=>s.due_date&&saleOutstanding(s)>0&&s.due_date<today())};
  window.dueTodaySales=function(){return activeSales().filter(s=>s.due_date===today()&&saleOutstanding(s)>0)};

  function notify(t){ alert(t); }
  function actor(){ return currentUser?.id||null; }

  async function setSaleStatus(saleId,status,reason){
    // Keep compatibility with an existing DB that has no status column: the
    // update error is surfaced instead of silently pretending cancellation worked.
    const payload=status==='cancelled'
      ? {status:'cancelled',cancelled_at:new Date().toISOString(),cancelled_by:actor(),cancel_reason:reason||null}
      : {status:'active',cancelled_at:null,cancelled_by:null,cancel_reason:null};
    const r=await client.from('sales').update(payload).eq('id',saleId);
    if(r.error) throw r.error;
  }

  async function setCollectionStatus(id,status,reason){
    const payload=status==='cancelled'
      ? {status:'cancelled',cancelled_at:new Date().toISOString(),cancelled_by:actor(),cancel_reason:reason||null}
      : {status:'active',cancelled_at:null,cancelled_by:null,cancel_reason:null};
    const r=await client.from('collections').update(payload).eq('id',id);
    if(r.error) throw r.error;
  }

  async function reverseStockForSale(saleId,reason){
    const sale=data.sales.find(s=>s.id===saleId); if(!sale) throw new Error('Satış bulunamadı.');
    const items=sale.sale_items||[];
    if(!items.length) return;
    for(const item of items){
      const qty=Math.abs(Number(item.quantity||0));
      if(!(qty>0)) continue;
      const unitCost=Number(item.unit_cost||0);
      const r=await client.from('stock_movements').insert({
        warehouse_id:sale.warehouse_id||warehouse?.id,
        product_id:item.product_id||product?.id,
        movement_date:today(),
        movement_type:'sale_cancel',
        quantity:qty,
        unit_cost:unitCost,
        total_cost:qty*unitCost,
        reference_id:sale.id
      });
      if(r.error) throw r.error;
    }
  }

  window.v20CancelSale=async function(saleId){
    const s=data.sales.find(x=>x.id===saleId);
    if(!s||!ACTIVE_SALE(s)) return notify('Bu satış zaten iptal edilmiş veya bulunamadı.');
    const collected=saleCollected(saleId);
    const reason=prompt('Satış iptal nedeni:', 'Hatalı satış');
    if(reason===null) return;
    const ok=confirm(`${customerName(s.customer_id)} müşterisinin ${money(s.total)} tutarındaki satışını İPTAL etmek istiyor musun?\n\nTahsilat: ${money(collected)}\n\nSatış silinmeyecek. Tahsilat geçmişi korunacak ve stok için ters hareket oluşturulacak.`);
    if(!ok)return;
    try{
      // First create the reversing stock movement. If this fails, the sale is
      // kept active and no financial state is partially changed.
      await reverseStockForSale(saleId,reason);
      await setSaleStatus(saleId,'cancelled',reason);
      await loadData();
      show('sales');
      notify('Satış iptal edildi. Geçmiş kayıtları korundu.');
    }catch(e){notify('Satış iptal edilemedi: '+msg(e))}
  };

  window.v20CancelCollection=async function(id){
    const c=data.collections.find(x=>x.id===id);
    if(!c||!ACTIVE_COLLECTION(c)) return notify('Bu tahsilat zaten iptal edilmiş veya bulunamadı.');
    const reason=prompt('Tahsilat iptal nedeni:', 'Hatalı tahsilat');
    if(reason===null)return;
    if(!confirm(`${money(c.amount)} tutarındaki tahsilatı İPTAL etmek istiyor musun?\n\nTahsilat silinmeyecek. İptal olarak saklanacak ve bağlı satışın kalan bakiyesi yeniden hesaplanacak.`))return;
    try{
      await setCollectionStatus(id,'cancelled',reason);
      await loadData();
      show('collections');
      notify('Tahsilat iptal edildi.');
    }catch(e){notify('Tahsilat iptal edilemedi: '+msg(e))}
  };

  window.v20SaleEdit=async function(saleId){
    const s=data.sales.find(x=>x.id===saleId);
    if(!s||!ACTIVE_SALE(s))return notify('Aktif satış bulunamadı.');
    const collected=saleCollected(saleId);
    modalbox.innerHTML=`<h2>Satış Düzenle</h2>
      <div class="status sale-fast-card"><b>${esc(customerName(s.customer_id))}</b><br>Satış: <b>${money(s.total)}</b> · Tahsilat: <b>${money(collected)}</b> · Kalan: <b>${money(saleOutstanding(s))}</b></div>
      <div class="formgrid" style="margin-top:14px">
        <div class="field"><label>Satış Tarihi</label><input id="v20_date" type="date" value="${esc(s.sale_date||'')}"></div>
        <div class="field"><label>Vade Tarihi</label><input id="v20_due" type="date" value="${esc(s.due_date||'')}"></div>
        <div class="field"><label>Ödeme</label><select id="v20_payment"><option>Peşin</option><option>Havale/EFT</option><option>Kredi Kartı</option><option>Vadeli</option></select></div>
        <div class="field"><label>Açıklama</label><input id="v20_note" value="${esc(s.note||'')}"></div>
      </div>
      <div class="status" style="margin-top:12px">Tutar/miktar bu ekrandan sessizce değiştirilmiyor. Finansal düzeltme gerektiğinde eski hareketi bozmak yerine düzeltme işlemi yapılacak.</div>
      <div class="actions"><button class="btn secondary" onclick="closeModal()">İptal</button><button class="btn primary" onclick="v20SaveSaleEdit('${saleId}')">Kaydet</button></div>`;
    document.getElementById('v20_payment').value=s.payment_type||'Peşin';
    modal.classList.add('open');
  };

  window.v20SaveSaleEdit=async function(saleId){
    try{
      const s=data.sales.find(x=>x.id===saleId); if(!s||!ACTIVE_SALE(s))throw new Error('Aktif satış bulunamadı.');
      const date=v20_date.value||s.sale_date;
      const payment=v20_payment.value;
      const due=v20_due.value||null;
      const note=v20_note.value||null;
      if(payment==='Vadeli'&&!due)throw new Error('Vadeli satış için vade tarihi zorunludur.');
      if(payment!=='Vadeli'&&due)throw new Error('Vadeli olmayan satışta vade tarihi boş olmalıdır.');
      // Do not manufacture a fake collection when changing payment type. A
      // payment type is metadata; outstanding balance remains derived from
      // real collection records.
      const r=await client.from('sales').update({sale_date:date,due_date:due,payment_type:payment,note}).eq('id',saleId);
      if(r.error)throw r.error;
      await loadData();closeModal();show('sales');
    }catch(e){notify(msg(e))}
  };

  window.recentSalesTable=function(){
    const rows=activeSales().slice().sort((a,b)=>String(b.sale_date).localeCompare(String(a.sale_date))).slice(0,30);
    if(!rows.length)return '<div class="empty">Henüz aktif satış yok.</div>';
    return `<table><tr><th>Tarih</th><th>Müşteri</th><th>Tutar</th><th>Ödeme</th><th>Durum</th><th>İşlemler</th></tr>${rows.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(customerName(s.customer_id))}</td><td>${money(s.total)}</td><td>${esc(s.payment_type||'')}</td><td>Aktif</td><td><button class="btn secondary" onclick="printDeliveryNote('${s.id}')">🧾 İrsaliye</button> <button class="btn secondary" onclick="v20SaleEdit('${s.id}')">Düzenle</button> <button class="btn secondary" onclick="v20CancelSale('${s.id}')">İptal Et</button></td></tr>`).join('')}</table>`;
  };

  window.collections=function(){
    const overdue=overdueSales(), due=dueTodaySales(), open=activeSales().filter(s=>saleOutstanding(s)>0&&s.due_date);
    return `<section><h1>Tahsilatlar & Vade Takibi</h1><div class="sub">Tahsilatlar silinmez; iptal edilerek geçmişte tutulur.</div>
      <div class="cards"><div class="card"><small>Toplam Cari Alacak</small><div class="value warning">${money(totalReceivable())}</div></div><div class="card"><small>Vadesi Geçen</small><div class="value warning">${money(overdue.reduce((a,s)=>a+saleOutstanding(s),0))}</div></div><div class="card"><small>Bugün Vadesi Gelen</small><div class="value">${money(due.reduce((a,s)=>a+saleOutstanding(s),0))}</div></div></div>
      <div class="panel"><div class="toolbar"><button class="btn primary" onclick="openCollection()">+ Tahsilat Gir</button></div><h2>Açık Vadeli Satışlar</h2>${dueTable(open)}</div>
      <div class="panel"><h2>Tahsilat Geçmişi</h2>${data.collections.length?`<table><tr><th>Tarih</th><th>Müşteri</th><th>Tutar</th><th>Yöntem</th><th>Bağlı Satış</th><th>Durum</th><th>İşlem</th></tr>${data.collections.slice().reverse().map(c=>`<tr><td>${esc(c.collection_date)}</td><td>${esc(customerName(c.customer_id))}</td><td>${money(c.amount)}</td><td>${esc(c.payment_type)}</td><td>${c.sale_id?'Satış #'+String(c.sale_id).slice(0,8):'Cari genel'}</td><td class="${ACTIVE_COLLECTION(c)?'positive':'danger'}">${ACTIVE_COLLECTION(c)?'Aktif':'İptal'}</td><td>${ACTIVE_COLLECTION(c)?`<button class="btn secondary" onclick="v20CancelCollection('${c.id}')">İptal Et</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Henüz tahsilat yok.</div>'}</div></section>`;
  };

  // Re-define sale list rendering only after the original page functions have
  // been loaded. show('sales') will call this function and therefore use the
  // corrected active-record calculations.
  const originalShow=window.show;
  window.show=async function(page){
    if(page==='sales'){
      sessionStorage.setItem('carbonerp_current_page','sales');
      history.replaceState(null,'','#sales');
      document.getElementById('nav').innerHTML=nav('sales');
      document.getElementById('app').innerHTML=sales();
      const info=document.getElementById('saleCustomerInfo');if(info)updateSaleCustomerInfo();
      return;
    }
    if(page==='collections'){
      sessionStorage.setItem('carbonerp_current_page','collections');
      history.replaceState(null,'','#collections');
      document.getElementById('nav').innerHTML=nav('collections');
      document.getElementById('app').innerHTML=collections();
      return;
    }
    return originalShow(page);
  };
})();
</script>

</body>
</html>
