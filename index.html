<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP</title><style>html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f5f6f8}body{display:flex}.frame{width:100%;height:100%;border:0;background:#f5f6f8}</style></head><body><iframe id="frame" class="frame" src="v22.html" title="CarbonERP"></iframe><script>const frame=document.getElementById('frame');function setup(){try{const d=frame.contentDocument,w=frame.contentWindow,nav=d.getElementById('nav');if(!nav)return;const css=d.createElement('style');css.textContent='.menu-group{margin:10px 4px 4px;color:#98a2b3;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:7px 8px 3px}.menu-item,.menu-sub{display:block;width:100%;border:0;text-align:left;cursor:pointer}.menu-item{background:transparent;color:#cbd5e1;padding:9px 12px;border-radius:9px;margin:2px 0;font-weight:750}.menu-item:hover{background:#263244;color:#fff}.menu-sub{width:calc(100% - 12px);margin:1px 0 1px 6px;background:transparent;color:#98a2b3;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:650}.menu-sub:hover{background:#1d2939;color:#fff}.menu-chevron{float:right;color:#98a2b3}';d.head.appendChild(css);const groups=[['Ana Sayfa',[['dashboard','Ana Sayfa']]],['Müşteri Yönetimi',[['customers','Müşteriler'],['customers','Cari Kart'],['collections','Tahsilatlar'],['due','Vade Takibi']]],['Satış Yönetimi',[['sales','Satışlar'],['sales','Yeni Satış']]],['Stok & Finans',[['stock','Stok'],['purchases','Alışlar'],['expenses','Giderler'],['financial-center.html','Finansal Merkez']]],['Raporlar',[['reports','Raporlar']]],['Operasyon',[['v24.html','Satış → Teslimat'],['v25.html','Araç & Şoför'],['v26.html','Günlük Sevkiyat']]]];nav.innerHTML=groups.map(g=>'<div class="menu-group">'+g[0]+'</div>'+g[1].map((x,i)=>'<button class="menu-'+(i?'sub':'item')+'" data-action="'+x[0]+'">'+x[1]+(i?'':'<span class="menu-chevron">›</span>')+'</button>').join('')).join('');nav.querySelectorAll('button').forEach(b=>{b.onclick=()=>{const a=b.dataset.action;if(a.endsWith('.html')){top.location.href=a;return}if(typeof w.go==='function')w.go(a)}})}catch(e){console.warn('CarbonERP menu setup:',e)}}frame.addEventListener('load',setup);</script></body></html>
