<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Yönetim Merkezi</title><style>html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f5f6f8;color:#172033}body{display:flex;flex-direction:column}.bar{min-height:0;background:#101828;color:#fff;display:none}.frame{width:100%;height:100vh;border:0;background:#f5f6f8}.status{display:none}</style></head><body><iframe id="frame" class="frame" src="v22.html" title="CarbonERP"></iframe><script>const frame=document.getElementById('frame');function setup(){try{const d=frame.contentDocument,w=frame.contentWindow,nav=d.getElementById('nav');if(!nav)return;const css=d.createElement('style');css.textContent='.menu-group{margin:13px 4px 5px;color:#98a2b3;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px 3px}.menu-item,.menu-sub{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;border-radius:9px;cursor:pointer}.menu-item{padding:10px 12px;margin:2px 0;font-weight:850}.menu-sub{width:calc(100% - 10px);margin:1px 0 1px 5px;padding:8px 12px;color:#aeb8c7;font-size:12px;font-weight:650}.menu-item:hover,.menu-sub:hover{background:#263244;color:#fff}.menu-item .chev{float:right;color:#98a2b3}.menu-sub:before{content:'•';margin-right:8px;color:#667085}';d.head.appendChild(css);const groups=[['Ana Sayfa',[['dashboard','Ana Sayfa']]],['Müşteri Yönetimi',[['customers','Müşteriler'],['customers','Cari Kart'],['collections','Tahsilatlar'],['due','Vade Takibi'],['reports','Müşteri Ekstresi / Cari Raporu']]],['Satış & Sipariş',[['sales','Satışlar'],['sales','Yeni Satış'],['sales','Sipariş Takibi'],['v24.html','Satış → Teslimat'],['v26.html','Günlük Sevkiyat']]],['Stok & Alış',[['stock','Stok Durumu'],['purchases','Alışlar'],['expenses','Giderler']]],['Finans',[['financial-center.html','Finansal Merkez'],['collections','Tahsilatlar'],['due','Vade Takibi']]],['Raporlar',[['reports','Raporlar'],['reports','Satış Raporları'],['reports','Cari Raporları'],['reports','Stok Raporları'],['reports','Finans Raporları'],['reports','Sevkiyat Raporları']]],['Araç & Operasyon',[['v25.html','Araç & Şoför'],['v24.html','Teslimatlar'],['v26.html','Günlük Sevkiyat']]]];nav.innerHTML=groups.map(g=>'<div class="menu-group">'+g[0]+'</div>'+g[1].map((x,i)=>'<button class="menu-'+(i?'sub':'item')+'" data-page="'+x[0]+'" data-label="'+x[1]+'">'+x[1]+(i?'':'<span class="chev">›</span>')+'</button>').join('')).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=b.dataset.page,label=b.dataset.label;if(p.endsWith('.html')){top.location.href=p;return}if(label==='Cari Kart'){goCustomerAndExpose();return}if(label==='Yeni Satış'){if(typeof w.saleModal==='function')w.saleModal();else if(typeof w.go==='function')w.go('sales');return}if(typeof w.go==='function')w.go(p)});function goCustomerAndExpose(){if(typeof w.go==='function')w.go('customers');setTimeout(()=>{const c=d.getElementById('content');if(!c)return;const h=c.querySelector('.head');if(h&&!h.querySelector('[data-cari-entry]')){const b=d.createElement('button');b.dataset.cariEntry='1';b.className='btn success';b.textContent='Cari Kart Yönetimi';b.onclick=()=>{const first=c.querySelector('[data-customer-id]');if(first)first.click();else alert('Cari kartı açmak için önce bir müşteri seçin.');};h.appendChild(b)}},250)}const obs=new MutationObserver(()=>{if(d.getElementById('content')){const c=d.getElementById('content');if(c&&DUMMY_NOT_NEEDED()){} }});function DUMMY_NOT_NEEDED(){return false}obs.observe(d.body,{childList:true,subtree:true})}catch(e){console.warn('CarbonERP menu setup:',e)}}frame.addEventListener('load',setup);</script></body></html>
