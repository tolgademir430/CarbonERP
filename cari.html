<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Cari Kartlar</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head,.tools,.actions,.row{display:flex;gap:9px;align-items:center}.head{justify-content:space-between}.tools{flex-wrap:wrap}.tools input{flex:1;min-width:240px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.success{background:#087443;color:#fff}.soft{background:#eef2f6}.red{color:#b42318;font-weight:900}.green{color:#087443;font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:10px;z-index:20}.box{background:#fff;border-radius:16px;padding:20px;width:min(900px,100%);max-height:94vh;overflow:auto}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:11px;font-weight:800;color:#667085;margin:8px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d0d5dd;border-radius:9px}textarea{min-height:70px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:12px}.metric b{display:block;font-size:18px;margin-top:4px}.opening{border:1px solid #cfd8e3;border-radius:12px;padding:14px;margin-top:15px;background:#f8fafc}.opening h3{margin:0 0 8px}.opening-note{font-size:12px;color:#667085}.printbar{display:flex;gap:8px;flex-wrap:wrap}.printbar select{width:auto;min-width:210px}@media(max-width:800px){.grid,.metrics{grid-template-columns:1fr}.wrap{padding:10px}.table{font-size:12px}}@media print{body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;margin:0 0 8px;padding:0}.print-only{display:block!important}.table th,.table td{padding:6px}.table{font-size:11px}.print-title{font-size:18px;margin:0 0 4px}.print-subtitle{font-size:11px;color:#555;margin-bottom:10px}.modal{display:none!important}}.print-only{display:none}</style></head><body><div class="wrap"><div class="head no-print"><div><h1>Müşteriler / Cari Kartlar</h1><p>Arama, cari bakiye, ekstre ve müşteri bilgisi düzenleme.</p></div><div class="printbar"><select id="printMode"><option value="with">Müşteri + Bakiye</option><option value="without">Sadece Müşteri Bilgileri</option></select><button class="btn primary" onclick="printCustomers()">🖨 Müşteri Listesini Yazdır</button><button class="btn success" onclick="openCustomerForm()">＋ Yeni Müşteri</button></div></div><div class="card no-print"><div class="tools"><input id="searchBox" placeholder="Müşteri adı, kodu, telefon veya yetkili ara" oninput="renderCustomers()"><button class="btn soft" onclick="loadCustomers()">Yenile</button></div></div><div id="printHeader" class="print-only"><h2 class="print-title">CarbonERP · Müşteri Listesi</h2><div id="printSubtitle" class="print-subtitle"></div></div><div id="content"></div></div><div id="customerModal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const supabaseClient=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let customers=[],sales=[],collections=[],opening=[];const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const balance=id=>sales.filter(s=>s.customer_id===id&&s.status!=='cancelled').reduce((a,s)=>a+Number(s.total||0),0)-collections.filter(c=>c.customer_id===id&&c.status==='completed').reduce((a,c)=>a+Number(c.amount||0),0)+opening.filter(o=>o.customer_id===id).reduce((a,o)=>a+(o.direction==='debit'?Number(o.amount||0):-Number(o.amount||0)),0);async function loadCustomers(){let [c,s,k,o]=await Promise.all([supabaseClient.from('customers').select('*').eq('is_active',true).order('name'),supabaseClient.from('sales').select('id,customer_id,total,status,sale_date,due_date').order('sale_date',{ascending:false}),supabaseClient.from('collections').select('id,customer_id,amount,status,collection_date').order('collection_date',{ascending:false}),supabaseClient.from('customer_opening_balances').select('id,customer_id,entry_date,amount,direction,description').order('entry_date',{ascending:false})]);if(c.error||s.error||k.error||o.error)return alert((c.error||s.error||k.error||o.error).message);customers=c.data||[];sales=s.data||[];collections=k.data||[];opening=o.data||[];renderCustomers()}function getFiltered(){let q=(searchBox.value||'').toLocaleLowerCase('tr-TR');return customers.filter(c=>`${c.name} ${c.customer_code||''} ${c.phone||''} ${c.contact_person||''}`.toLocaleLowerCase('tr-TR').includes(q))}function renderCustomers(){let a=getFiltered(),total=customers.reduce((n,c)=>n+Math.max(0,balance(c.id)),0);content.innerHTML=`<div class="card no-print"><div class="metrics"><div class="metric">Toplam müşteri<b>${customers.length}</b></div><div class="metric">Toplam alacak<b class="red">${money(total)}</b></div><div class="metric">Net cari<b>${money(customers.reduce((n,c)=>n+balance(c.id),0))}</b></div><div class="metric">Arama sonucu<b>${a.length}</b></div></div></div><div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Müşteri</th><th>Telefon</th><th class="no-balance">Özel kg</th><th class="no-balance">Vade</th><th class="balance-col">Cari Bakiye</th><th class="no-print">İşlem</th></tr></thead><tbody>${a.map((c,i)=>{let b=balance(c.id);return`<tr><td>${i+1}</td><td><b>${esc(c.name)}</b><br><small>${esc(c.customer_code||'')} · ${esc(c.contact_person||'')}</small></td><td>${esc(c.phone||'-')}</td><td class="no-balance">${c.special_price==null?'Genel':money(c.special_price)}</td><td class="no-balance">${c.default_due_days||0} gün</td><td class="balance-col ${b>0?'red':'green'}">${money(b)}</td><td class="no-print"><button class="btn primary" onclick="openCustomerDetail('${c.id}')">Cari Kart</button></td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;padding:25px">Müşteri bulunamadı.</td></tr>'}</tbody></table></div></div>`}function printCustomers(){let mode=printMode.value;document.querySelectorAll('.balance-col').forEach(x=>x.style.display=mode==='with'?'':'none');document.querySelectorAll('.no-balance').forEach(x=>x.style.display=mode==='without'?'none':'');let a=getFiltered();printSubtitle.textContent=`${mode==='with'?'Bakiye bilgileri dahil':'Bakiye bilgileri hariç'} · ${a.length} müşteri · ${new Date().toLocaleDateString('tr-TR')}`;setTimeout(()=>window.print(),50);setTimeout(()=>{document.querySelectorAll('.balance-col,.no-balance').forEach(x=>x.style.display='')},500)}function openCustomerForm(id){let c=customers.find(x=>x.id===id)||{};let ob=opening.filter(x=>x.customer_id===id);let debit=ob.filter(x=>x.direction==='debit').reduce((n,x)=>n+Number(x.amount||0),0),credit=ob.filter(x=>x.direction==='credit').reduce((n,x)=>n+Number(x.amount||0),0);customerModal.innerHTML=`<div class="box"><h2>${id?'Cari Kartı Düzenle':'Yeni Müşteri'}</h2><div class="grid">${field('Müşteri adı','f_name',c.name,true)}${field('Müşteri kodu','f_code',c.customer_code)}${field('Yetkili kişi','f_contact',c.contact_person)}${field('Müşteri tipi','f_type',c.customer_type)}${field('Telefon','f_phone',c.phone)}${field('Alternatif telefon','f_alt',c.alternate_phone)}${field('WhatsApp','f_wa',c.whatsapp)}${field('E-posta','f_email',c.email)}${field('Vergi no','f_tax',c.tax_number)}${field('Vergi dairesi','f_office',c.tax_office)}${field('Vade gün','f_due',c.default_due_days||0)}${field('Kredi limiti','f_limit',c.credit_limit||0)}${field('Özel kg fiyatı','f_price',c.special_price??'')}${field('İndirim %','f_discount',c.discount_rate||0)}${field('Fiyat grubu','f_group',c.price_group)}${field('Minimum sipariş kg','f_min',c.minimum_order_kg||0)}${field('Şehir','f_city',c.city)}${field('İlçe','f_district',c.district)}</div><label>Adres</label><textarea id="f_address">${esc(c.address)}</textarea><label>Teslimat adresi</label><textarea id="f_delivery">${esc(c.delivery_address)}</textarea><label>Teslimat notları</label><textarea id="f_delivery_notes">${esc(c.delivery_notes)}</textarea><label>Notlar</label><textarea id="f_notes">${esc(c.notes)}</textarea>${id?`<div class="opening"><h3>↔ Açılış / Devir Bakiyesi</h3><div class="opening-note">Bu alan müşterinin CarbonERP'ye geçmeden önceki mevcut bakiyesini kaydeder. Satış veya tahsilat olarak görünmez.</div><div class="grid"><label>Devir tarihi<input id="o_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Yön<select id="o_direction"><option value="debit">Müşteri borçlu</option><option value="credit">Müşteriden alacaklı değil / avans</option></select></label><label>Tutar<input id="o_amount" type="number" min="0" step="0.01"></label><label>Açıklama<input id="o_desc" placeholder="Örn. Devir bakiyesi"></label></div><p>Mevcut devir borcu: <b>${money(debit)}</b> · Devir alacağı: <b>${money(credit)}</b></p><button class="btn success" onclick="saveOpening('${id}')">Devir Bakiyesini Ekle</button></div>`:''}<div class="actions"><button class="btn soft" onclick="closeCustomerModal()">Kapat</button><button class="btn success" onclick="saveCustomer('${id||''}')">Kaydet</button></div></div>`;customerModal.classList.remove('hidden')}function field(label,id,val,req){return`<div><label>${label}${req?' *':''}</label><input id="${id}" value="${esc(val)}" ${req?'required':''}></div>`}async function saveCustomer(id){let data={name:f_name.value.trim(),customer_code:f_code.value.trim()||null,contact_person:f_contact.value.trim()||null,customer_type:f_type.value.trim()||null,phone:f_phone.value.trim()||null,alternate_phone:f_alt.value.trim()||null,whatsapp:f_wa.value.trim()||null,email:f_email.value.trim()||null,tax_number:f_tax.value.trim()||null,tax_office:f_office.value.trim()||null,default_due_days:Number(f_due.value||0),credit_limit:Number(f_limit.value||0),special_price:f_price.value===''?null:Number(f_price.value),discount_rate:Number(f_discount.value||0),price_group:f_group.value.trim()||null,minimum_order_kg:Number(f_min.value||0),city:f_city.value.trim()||null,district:f_district.value.trim()||null,address:f_address.value.trim()||null,delivery_address:f_delivery.value.trim()||null,delivery_notes:f_delivery_notes.value.trim()||null,notes:f_notes.value.trim()||null,updated_at:new Date().toISOString()};if(!data.name)return alert('Müşteri adı gerekli.');let r=id?await supabaseClient.from('customers').update(data).eq('id',id):await supabaseClient.from('customers').insert(data);if(r.error)return alert(r.error.message);closeCustomerModal();await loadCustomers()}async function saveOpening(id){let amount=Number(document.getElementById('o_amount').value||0),direction=document.getElementById('o_direction').value,date=document.getElementById('o_date').value,description=document.getElementById('o_desc').value.trim()||'Devir bakiyesi';if(!amount||amount<=0)return alert('Geçerli bir devir tutarı gir.');if(!date)return alert('Devir tarihi gerekli.');let r=await supabaseClient.from('customer_opening_balances').insert({customer_id:id,entry_date:date,amount,direction,description});if(r.error)return alert(r.error.message);await loadCustomers();openCustomerForm(id)}function openCustomerDetail(id){let c=customers.find(x=>x.id===id),b=balance(id),ss=sales.filter(x=>x.customer_id===id&&x.status!=='cancelled').slice(0,10),cc=collections.filter(x=>x.customer_id===id&&x.status==='completed').slice(0,10),oo=opening.filter(x=>x.customer_id===id).slice(0,10);customerModal.innerHTML=`<div class="box"><div class="head"><div><h2>${esc(c.name)}</h2><p>${esc(c.customer_code||'')} · ${esc(c.contact_person||'')}</p></div><div><button class="btn primary" onclick="openCustomerForm('${id}')">✎ Düzenle</button><button class="btn soft" onclick="closeCustomerModal()">Kapat</button></div></div><div class="metrics"><div class="metric">Cari bakiye<b class="${b>0?'red':'green'}">${money(b)}</b></div><div class="metric">Özel kg fiyatı<b>${c.special_price==null?'Genel':money(c.special_price)}</b></div><div class="metric">Vade<b>${c.default_due_days||0} gün</b></div><div class="metric">Kredi limiti<b>${money(c.credit_limit)}</b></div></div><div class="card"><b>Telefon:</b> ${esc(c.phone||'-')}<br><b>Adres:</b> ${esc(c.delivery_address||c.address||'-')}</div><h3>Açılış / Devir Hareketleri</h3>${oo.map(x=>`<div class="row"><span>${x.entry_date} · ${esc(x.description||'Devir')}</span><b class="${x.direction==='debit'?'red':'green'}">${x.direction==='debit'?'+':'-'} ${money(x.amount)}</b></div>`).join('')||'<p>Devir kaydı yok.</p>'}<h3>Son satışlar</h3>${ss.map(x=>`<div class="row"><span>${x.sale_date}</span><b>${money(x.total)}</b></div>`).join('')||'<p>Satış yok.</p>'}<h3>Son tahsilatlar</h3>${cc.map(x=>`<div class="row"><span>${x.collection_date}</span><b class="green">${money(x.amount)}</b></div>`).join('')||'<p>Tahsilat yok.</p>'}</div>`;customerModal.classList.remove('hidden')}function closeCustomerModal(){customerModal.classList.add('hidden');customerModal.innerHTML=''}loadCustomers();</script></body></html>
