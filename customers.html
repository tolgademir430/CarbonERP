<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Müşteri Cari Kartları</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head,.row,.toolbar{display:flex;gap:10px;align-items:center}.head{justify-content:space-between}.toolbar{flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.success{background:#087443;color:#fff}.secondary{background:#eef2f6}.danger{background:#fee4e2;color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee}.muted{color:#667085}.green{color:#087443;font-weight:900}.red{color:#b42318;font-weight:900}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:#fff;border-radius:16px;padding:20px;width:min(850px,100%);max-height:94vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:11px;font-weight:800;color:#667085;margin:8px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d0d5dd;border-radius:9px}textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hidden{display:none}.detail{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:12px}.metric b{display:block;font-size:18px;margin-top:4px}@media(max-width:800px){.detail,.grid,.grid3{grid-template-columns:1fr}.table{font-size:12px}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>Müşteriler / Cari Kartlar</h1><p class="muted">Müşterinin cari kartındaki tüm temel bilgileri buradan yönet.</p></div><button class="btn success" onclick="form()">＋ Yeni Müşteri</button></div><div class="card"><div class="toolbar"><input id="q" placeholder="Müşteri adı, kodu, telefon veya yetkili ara" oninput="render()"><button class="btn secondary" onclick="load()">Yenile</button></div></div><div id="list"></div><div id="modal" class="modal hidden"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let C=[],S=[],K=[];const money=x=>Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function balance(id){let sales=S.filter(x=>x.customer_id===id&&x.status!=='cancelled').reduce((a,x)=>a+Number(x.total||0),0), col=K.filter(x=>x.customer_id===id&&x.status!=='cancelled').reduce((a,x)=>a+Number(x.amount||0),0);return sales-col}async function load(){let [c,s,k]=await Promise.all([db.from('customers').select('*').eq('is_active',true).order('name'),db.from('sales').select('id,customer_id,total,status,sale_date,due_date').order('sale_date',{ascending:false}),db.from('collections').select('id,customer_id,amount,status,collection_date').order('collection_date',{ascending:false})]);if(c.error||s.error||k.error)return alert((c.error||s.error||k.error).message);C=c.data||[];S=s.data||[];K=k.data||[];render()}function render(){let t=(q.value||'').toLocaleLowerCase('tr-TR'),arr=C.filter(x=>`${x.name} ${x.customer_code||''} ${x.phone||''} ${x.contact_person||''}`.toLocaleLowerCase('tr-TR').includes(t));list.innerHTML=`<div class="card"><div class="detail"><div class="metric"><span>Toplam müşteri</span><b>${C.length}</b></div><div class="metric"><span>Toplam alacak</span><b class="red">${money(C.reduce((a,c)=>a+Math.max(0,balance(c.id)),0))}</b></div><div class="metric"><span>Toplam müşteri bakiyesi</span><b>${money(C.reduce((a,c)=>a+balance(c.id),0))}</b></div><div class="metric"><span>Arama sonucu</span><b>${arr.length}</b></div></div></div><div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Müşteri</th><th>Telefon</th><th>Özel kg fiyatı</th><th>Vade</th><th>Cari bakiye</th><th></th></tr></thead><tbody>${arr.map((c,i)=>{let b=balance(c.id);return`<tr><td>${i+1}</td><td><b>${esc(c.name)}</b><br><small class="muted">${esc(c.customer_code||'')} · ${esc(c.customer_type||'')}</small></td><td>${esc(c.phone||'')}</td><td>${c.special_price!=null?money(c.special_price):'Genel fiyat'}</td><td>${c.default_due_days||0} gün</td><td class="${b>0?'red':'green'}">${money(b)}</td><td><button class="btn primary" onclick="detail('${c.id}')">Cari Kart</button></td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;padding:25px">Müşteri bulunamadı.</td></tr>'}</tbody></table></div></div>`}function form(id){let c=C.find(x=>x.id===id)||{};modal.innerHTML=`<div class="box"><h2>${id?'Müşteri Cari Kartını Düzenle':'Yeni Müşteri'}</h2><div class="grid"><div><label>Müşteri adı *</label><input id="name" value="${esc(c.name)}"></div><div><label>Müşteri kodu</label><input id="code" value="${esc(c.customer_code)}"></div><div><label>Yetkili kişi</label><input id="contact" value="${esc(c.contact_person)}"></div><div><label>Müşteri tipi</label><input id="type" value="${esc(c.customer_type)}" placeholder="Restoran, kasap vb."></div><div><label>Telefon</label><input id="phone" value="${esc(c.phone)}"></div><div><label>Alternatif telefon</label><input id="alt" value="${esc(c.alternate_phone)}"></div><div><label>WhatsApp</label><input id="wa" value="${esc(c.whatsapp)}"></div><div><label>E-posta</label><input id="email" value="${esc(c.email)}"></div><div><label>Vergi no</label><input id="tax" value="${esc(c.tax_number)}"></div><div><label>Vergi dairesi</label><input id="office" value="${esc(c.tax_office)}"></div><div><label>Varsayılan vade (gün)</label><input id="due" type="number" value="${c.default_due_days||0}"></div><div><label>Kredi limiti</label><input id="limit" type="number" step="0.01" value="${c.credit_limit||0}"></div><div><label>Özel kg fiyatı</label><input id="price" type="number" step="0.01" value="${c.special_price??''}"></div><div><label>İndirim oranı %</label><input id="discount" type="number" step="0.01" value="${c.discount_rate||0}"></div><div><label>Fiyat grubu</label><input id="group" value="${esc(c.price_group)}"></div><div><label>Minimum sipariş kg</label><input id="minkg" type="number" step="0.1" value="${c.minimum_order_kg||0}"></div><div><label>İletişim tercihi</label><input id="pref" value="${esc(c.contact_preference)}"></div><div><label>E-fatura tipi</label><input id="einvoice" value="${esc(c.e_invoice_type)}"></div><div><label>Şehir</label><input id="city" value="${esc(c.city)}"></div><div><label>İlçe</label><input id="district" value="${esc(c.district)}"></div></div><label>Adres</label><textarea id="address">${esc(c.address)}</textarea><label>Teslimat adresi</label><textarea id="delivery">${esc(c.delivery_address)}</textarea><label>Teslimat notları</label><textarea id="deliverynotes">${esc(c.delivery_notes)}</textarea><label>Notlar</label><textarea id="notes">${esc(c.notes)}</textarea><div class="actions"><button class="btn secondary" onclick="close()">İptal</button><button class="btn success" onclick="save('${id||''}')">Kaydet</button></div></div>`;modal.classList.remove('hidden')}async function save(id){let data={name:name.value.trim(),customer_code:code.value.trim()||null,contact_person:contact.value.trim()||null,customer_type:type.value.trim()||null,phone:phone.value.trim()||null,alternate_phone:alt.value.trim()||null,whatsapp:wa.value.trim()||null,email:email.value.trim()||null,tax_number:tax.value.trim()||null,tax_office:office.value.trim()||null,default_due_days:Number(due.value||0),credit_limit:Number(limit.value||0),special_price:price.value===''?null:Number(price.value),discount_rate:Number(discount.value||0),price_group:group.value.trim()||null,minimum_order_kg:Number(minkg.value||0),contact_preference:pref.value.trim()||null,e_invoice_type:einvoice.value.trim()||null,city:city.value.trim()||null,district:district.value.trim()||null,address:address.value.trim()||null,delivery_address:delivery.value.trim()||null,delivery_notes:deliverynotes.value.trim()||null,notes:notes.value.trim()||null,updated_at:new Date().toISOString()};if(!data.name)return alert('Müşteri adı gerekli.');let r=id?await db.from('customers').update(data).eq('id',id):await db.from('customers').insert(data);if(r.error)return alert(r.error.message);close();load()}function detail(id){let c=C.find(x=>x.id===id),b=balance(id),sales=S.filter(x=>x.customer_id===id&&x.status!=='cancelled'),cols=K.filter(x=>x.customer_id===id&&x.status!=='cancelled');modal.innerHTML=`<div class="box"><div class="head"><div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.customer_code||'')} · ${esc(c.contact_person||'')}</p></div><button class="btn primary" onclick="form('${id}')">✎ Cari Kartını Düzenle</button></div><div class="detail"><div class="metric">Cari bakiye<b class="${b>0?'red':'green'}">${money(b)}</b></div><div class="metric">Özel kg fiyatı<b>${c.special_price!=null?money(c.special_price):'Genel'}</b></div><div class="metric">Vade<b>${c.default_due_days||0} gün</b></div><div class="metric">Kredi limiti<b>${money(c.credit_limit)}</b></div></div><p><b>Telefon:</b> ${esc(c.phone||'-')} &nbsp; <b>Adres:</b> ${esc(c.delivery_address||c.address||'-')}</p><h3>Son satışlar</h3>${sales.slice(0,8).map(s=>`<div class="row"><span>${s.sale_date||''}</span><b>${money(s.total)}</b></div>`).join('')||'<p class="muted">Satış yok.</p>'}<h3>Son tahsilatlar</h3>${cols.slice(0,8).map(x=>`<div class="row"><span>${x.collection_date||''}</span><b class="green">${money(x.amount)}</b></div>`).join('')||'<p class="muted">Tahsilat yok.</p>'}<div class="actions"><button class="btn secondary" onclick="close()">Kapat</button></div></div>`;modal.classList.remove('hidden')}function close(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
