<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Yeni Satış</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:800;font-size:13px}input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}.pricebox{padding:14px;background:#f8fafc;border-radius:12px;margin-top:12px}.price{font-size:25px;font-weight:950}.special{color:#087443;font-weight:850}.btn{padding:11px 15px;border:0;border-radius:9px;font-weight:900;cursor:pointer}.ok{background:#087443;color:#fff}.muted{color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>🧾 Yeni Satış</h1><p class="muted">Müşteriye özel ürün fiyatı varsa otomatik uygulanır. İstersen bu satış için fiyatı ayrıca değiştirebilirsin.</p><div class="card"><div class="grid"><label>Müşteri<select id="customer" onchange="price()"><option value="">Seçin</option></select></label><label>Ürün<select id="product" onchange="price()"><option value="">Seçin</option></select></label><label>Miktar<input id="qty" type="number" min="0.001" step="0.001" value="1" oninput="price()"></label><label>Ödeme<select id="payment"><option value="cash">Peşin</option><option value="credit">Vadeli</option></select></label><label>Vade tarihi<input id="due" type="date"></label><label>Bu satış için fiyatı değiştir<input id="override" type="number" min="0" step="0.01" placeholder="Otomatik fiyatı değiştirmek istersen"></label></div><div class="pricebox"><div id="source" class="muted">Müşteri ve ürün seçin.</div><div id="unit" class="price">0,00 TL</div><div id="total">Toplam: 0,00 TL</div></div><br><label>Not<textarea id="notes"></textarea></label><br><button class="btn ok" onclick="save()">Satışı Kaydet</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let C=[],P=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){let [c,p]=await Promise.all([db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('products').select('id,name,unit,sale_price').eq('is_active',true).order('name')]);if(c.error||p.error)return alert((c.error||p.error).message);C=c.data||[];P=p.data||[];customer.innerHTML='<option value="">Seçin</option>'+C.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');product.innerHTML='<option value="">Seçin</option>'+P.map(x=>`<option value="${x.id}">${esc(x.name)} · ${money(x.sale_price)}/${esc(x.unit)}</option>`).join('')}async function price(){if(!customer.value||!product.value){source.textContent='Müşteri ve ürün seçin.';unit.textContent=money(0);total.textContent='Toplam: '+money(0);return}let r=await db.rpc('get_effective_product_price',{p_customer_id:customer.value,p_product_id:product.value});if(r.error)return alert(r.error.message);let base=P.find(x=>x.id===product.value)?.sale_price||0,eff=Number(r.data||0),ov=document.getElementById('override').value,final=ov===''?eff:Number(ov),q=Number(qty.value)||0;source.innerHTML=eff!==Number(base)?'<span class="special">✓ Müşteriye özel fiyat otomatik uygulandı</span>':'Varsayılan ürün satış fiyatı';unit.textContent=money(final);total.textContent='Toplam: '+money(final*q)}async function save(){if(!customer.value||!product.value)return alert('Müşteri ve ürün seçin.');let q=Number(qty.value);if(q<=0)return alert('Miktar sıfırdan büyük olmalı.');let r=await db.rpc('create_sale_with_price',{p_customer_id:customer.value,p_warehouse_id:'3b10d903-a951-49fb-a829-059ab718df45',p_product_id:product.value,p_quantity:q,p_unit_price:document.getElementById('override').value===''?null:Number(document.getElementById('override').value),p_payment_type:payment.value,p_due_date:due.value||null,p_notes:notes.value.trim()||null});if(r.error)return alert(r.error.message);alert('Satış başarıyla kaydedildi.');location.href='sales.html'}init();</script></body></html>
