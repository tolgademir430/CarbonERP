<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Raporlar Merkezi</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1400px;margin:auto;padding:18px}.top,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800}.field input,.field select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#172033;color:#fff}.ok{background:#087443;color:#fff}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.v{font-size:22px;font-weight:900}.muted{color:#667085;font-size:12px}.tabs button{border:0;border-radius:9px;padding:9px 12px;background:#e9edf2;font-weight:800;cursor:pointer}.tabs button.on{background:#087443;color:#fff}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;color:#667085}.good{color:#087443;font-weight:900}.bad{color:#b42318;font-weight:900}.note{padding:10px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:12px}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.filters,.metrics{grid-template-columns:1fr 1fr}.wrap{padding:10px}}@media(max-width:420px){.filters,.metrics{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>📊 Raporlar Merkezi</h1><div class="muted">Satış, müşteri, ürün, finans ve sevkiyat analizleri</div></div><div class="actions"><button class="btn dark" onclick="load()">↻ Yenile</button><button class="btn" onclick="resetFilters()">Filtreleri Sıfırla</button><button class="btn ok" onclick="exportCsv()">Excel / CSV</button><button class="btn" onclick="window.print()">🖨 Yazdır</button></div></div><div class="panel"><div class="tabs"><button class="on" data-tab="sales">Satış</button><button data-tab="customers">Müşteri</button><button data-tab="products">Ürün</button><button data-tab="finance">Finans</button><button data-tab="delivery">Sevkiyat</button></div><div class="filters" style="margin-top:12px"><label class="field">Başlangıç<input id="from" type="date"></label><label class="field">Bitiş<input id="to" type="date"></label><label class="field">Müşteri<select id="customer"><option value="">Tümü</option></select></label><label class="field">Ürün<select id="product"><option value="">Tümü</option></select></label><label class="field">Ödeme<select id="payment"><option value="">Tümü</option><option value="cash">Peşin</option><option value="credit">Vadeli</option><option value="card">Kart</option><option value="transfer">Havale/EFT</option></select></label><label class="field">Satış durumu<select id="saleStatus"><option value="active">Aktif</option><option value="all">Tümü</option><option value="cancelled">İptal</option></select></label></div><div class="actions" style="margin-top:12px"><button class="btn ok" onclick="render()">Filtrele</button></div></div><div id="metrics" class="metrics"></div><div id="notice"></div><div class="panel"><div id="report" class="table"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={sales:[],items:[],customers:[],products:[],expenses:[],deliveries:[]},tab='sales',filtered=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const num=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(Number(n)||0);const kg=n=>num(n)+' kg';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>D.customers.find(x=>x.id===id)?.name||'Bilinmeyen müşteri';const pname=id=>D.products.find(x=>x.id===id)?.name||'Bilinmeyen ürün';const today=()=>new Date().toISOString().slice(0,10);function setDefaultDates(){let n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);from.value=f.toISOString().slice(0,10);to.value=n.toISOString().slice(0,10)}async function load(){notice.innerHTML='';let [s,i,c,p,e,d]=await Promise.all([db.from('sales').select('*').order('sale_date',{ascending:false}),db.from('sale_items').select('*'),db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('products').select('id,name,unit').eq('is_active',true).order('name'),db.from('expenses').select('*').order('expense_date',{ascending:false}),db.from('delivery_orders').select('*').order('delivery_date',{ascending:false})]);let err=[s,i,c,p,e,d].find(x=>x.error);if(err){notice.innerHTML='<div class="note">Rapor verileri alınamadı: '+esc(err.error?.message||'Bilinmeyen hata')+'</div>';return}D={sales:s.data||[],items:i.data||[],customers:c.data||[],products:p.data||[],expenses:e.data||[],deliveries:d.data||[]};customer.innerHTML='<option value="">Tümü</option>'+D.customers.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');product.innerHTML='<option value="">Tümü</option>'+D.products.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');setDefaultDates();render()}function saleMatches(s){if(saleStatus.value==='active'&&s.status==='cancelled')return false;if(saleStatus.value==='cancelled'&&s.status!=='cancelled')return false;if(from.value&&(s.sale_date||'')<from.value)return false;if(to.value&&(s.sale_date||'')>to.value)return false;if(customer.value&&s.customer_id!==customer.value)return false;if(payment.value&&String(s.payment_type||'').toLowerCase()!==payment.value)return false;if(product.value&&!D.items.some(i=>i.sale_id===s.id&&i.product_id===product.value))return false;return true}function getSales(){return D.sales.filter(saleMatches)}function setTab(x,b){tab=x;document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab,b));function render(){filtered=getSales();notice.innerHTML='';if(tab==='sales')renderSales();else if(tab==='customers')renderCustomers();else if(tab==='products')renderProducts();else if(tab==='finance')renderFinance();else renderDelivery()}function renderSales(){let total=filtered.reduce((a,s)=>a+Number(s.total||0),0),cost=filtered.reduce((a,s)=>a+Number(s.cost_total||0),0),gross=total-cost,totalKg=D.items.filter(i=>filtered.some(s=>s.id===i.sale_id)).reduce((a,i)=>a+Number(i.quantity||0),0),credit=filtered.filter(s=>s.payment_type==='credit').reduce((a,s)=>a+Number(s.total||0),0);metrics.innerHTML=metric('Satış',filtered.length)+metric('Ciro',money(total))+metric('Satılan',kg(totalKg))+metric('Maliyet',money(cost))+metric('Brüt kâr',money(gross))+metric('Vadeli satış',money(credit));report.innerHTML='<table><thead><tr><th>Tarih</th><th>Müşteri</th><th>Ödeme</th><th>Vade</th><th>Kg</th><th>Kg fiyatı</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th></tr></thead><tbody>'+ (filtered.map(s=>{let items=D.items.filter(i=>i.sale_id===s.id),q=items.reduce((a,i)=>a+Number(i.quantity||0),0),t=Number(s.total||0),c=Number(s.cost_total||0),p=t-c;return'<tr><td>'+esc(s.sale_date)+'</td><td>'+esc(cname(s.customer_id))+'</td><td>'+esc(s.payment_type||'—')+'</td><td>'+esc(s.due_date||'—')+'</td><td>'+kg(q)+'</td><td>'+money(q?t/q:0)+'</td><td>'+money(t)+'</td><td>'+money(c)+'</td><td class="'+(p>=0?'good':'bad')+'">'+money(p)+'</td></tr>'}).join('')||'<tr><td colspan="9">Kayıt yok.</td></tr>')+'</tbody></table>'}function renderCustomers(){let m={};filtered.forEach(s=>{let x=m[s.customer_id]??={sales:0,kg:0,revenue:0,cost:0};x.sales++;x.revenue+=Number(s.total||0);x.cost+=Number(s.cost_total||0);D.items.filter(i=>i.sale_id===s.id).forEach(i=>x.kg+=Number(i.quantity||0))});let arr=Object.entries(m).sort((a,b)=>b[1].revenue-a[1].revenue),rev=arr.reduce((a,[,x])=>a+x.revenue,0),k=arr.reduce((a,[,x])=>a+x.kg,0),profit=arr.reduce((a,[,x])=>a+x.revenue-x.cost,0);metrics.innerHTML=metric('Müşteri',arr.length)+metric('Ciro',money(rev))+metric('Kg',kg(k))+metric('Brüt kâr',money(profit))+metric('Ort. kg fiyatı',money(k?rev/k:0))+metric('Kâr marjı',rev?num(profit/rev*100)+'%':'0%');report.innerHTML='<table><thead><tr><th>#</th><th>Müşteri</th><th>Satış</th><th>Kg</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th><th>Ort. kg</th></tr></thead><tbody>'+ (arr.map(([id,x],n)=>{let p=x.revenue-x.cost;return'<tr><td>'+(n+1)+'</td><td>'+esc(cname(id))+'</td><td>'+x.sales+'</td><td>'+kg(x.kg)+'</td><td>'+money(x.revenue)+'</td><td>'+money(x.cost)+'</td><td class="'+(p>=0?'good':'bad')+'">'+money(p)+'</td><td>'+money(x.kg?x.revenue/x.kg:0)+'</td></tr>'}).join('')||'<tr><td colspan="8">Kayıt yok.</td></tr>')+'</tbody></table>'}function renderProducts(){let m={};filtered.forEach(s=>D.items.filter(i=>i.sale_id===s.id).forEach(i=>{let x=m[i.product_id]??={kg:0,revenue:0,cost:0,lines:0};x.kg+=Number(i.quantity||0);x.revenue+=Number(i.line_total||0);x.cost+=Number(i.cost_total||0);x.lines++}));let arr=Object.entries(m).sort((a,b)=>b[1].revenue-a[1].revenue),rev=arr.reduce((a,[,x])=>a+x.revenue,0),q=arr.reduce((a,[,x])=>a+x.kg,0),cost=arr.reduce((a,[,x])=>a+x.cost,0);metrics.innerHTML=metric('Ürün',arr.length)+metric('Kg',kg(q))+metric('Ciro',money(rev))+metric('Maliyet',money(cost))+metric('Kâr',money(rev-cost))+metric('Ort. kg',money(q?rev/q:0));report.innerHTML='<table><thead><tr><th>#</th><th>Ürün</th><th>Satır</th><th>Kg</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th><th>Ort. kg fiyatı</th></tr></thead><tbody>'+ (arr.map(([id,x],n)=>{let p=x.revenue-x.cost;return'<tr><td>'+(n+1)+'</td><td>'+esc(pname(id))+'</td><td>'+x.lines+'</td><td>'+kg(x.kg)+'</td><td>'+money(x.revenue)+'</td><td>'+money(x.cost)+'</td><td class="'+(p>=0?'good':'bad')+'">'+money(p)+'</td><td>'+money(x.kg?x.revenue/x.kg:0)+'</td></tr>'}).join('')||'<tr><td colspan="8">Kayıt yok.</td></tr>')+'</tbody></table>'}function renderFinance(){let revenue=filtered.reduce((a,s)=>a+Number(s.total||0),0),cost=filtered.reduce((a,s)=>a+Number(s.cost_total||0),0),expenses=D.expenses.filter(e=>(!from.value||e.expense_date>=from.value)&&(!to.value||e.expense_date<=to.value)).reduce((a,e)=>a+Number(e.amount||0),0),gross=revenue-cost,net=gross-expenses,credit=filtered.filter(s=>s.payment_type==='credit').reduce((a,s)=>a+Number(s.total||0),0),overdue=filtered.filter(s=>s.payment_type==='credit'&&s.due_date&&s.due_date<today()).reduce((a,s)=>a+Number(s.total||0),0);metrics.innerHTML=metric('Ciro',money(revenue))+metric('Maliyet',money(cost))+metric('Brüt kâr',money(gross))+metric('Gider',money(expenses))+metric('Net sonuç',money(net))+metric('Vadesi geçen',money(overdue));notice.innerHTML='<div class="note">Tahsilat hareketleri için ayrı ödeme tablosu bulunmadığından gerçek tahsilat düşümü rapora dahil değildir; vadeli satış ve vade durumu gösterilir.</div>';report.innerHTML='<table><thead><tr><th>Finans kalemi</th><th>Tutar</th></tr></thead><tbody><tr><td>Ciro</td><td>'+money(revenue)+'</td></tr><tr><td>Mal maliyeti</td><td>'+money(cost)+'</td></tr><tr><td>Brüt kâr</td><td>'+money(gross)+'</td></tr><tr><td>Gider</td><td>'+money(expenses)+'</td></tr><tr><td>Net sonuç</td><td>'+money(net)+'</td></tr><tr><td>Vadeli satış</td><td>'+money(credit)+'</td></tr><tr><td>Vadesi geçen vadeli satış</td><td>'+money(overdue)+'</td></tr><tr><td>Kâr marjı</td><td>'+(revenue?num(gross/revenue*100):'0')+'%</td></tr></tbody></table>'}function renderDelivery(){let ds=D.deliveries.filter(d=>(!from.value||d.delivery_date>=from.value)&&(!to.value||d.delivery_date<=to.value)&&(!customer.value||d.customer_id===customer.value)),done=ds.filter(d=>d.status==='delivered').length,totalKg=ds.reduce((a,d)=>a+Number(d.total_kg||0),0);metrics.innerHTML=metric('Teslimat',ds.length)+metric('Toplam kg',kg(totalKg))+metric('Teslim edildi',done)+metric('Bekleyen',ds.length-done)+metric('Teslim oranı',ds.length?num(done/ds.length*100)+'%':'0%')+metric('Müşteri',new Set(ds.map(d=>d.customer_id)).size);report.innerHTML='<table><thead><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Durum</th><th>Araç</th><th>Şoför</th></tr></thead><tbody>'+ (ds.map(d=>'<tr><td>'+esc(d.delivery_date)+'</td><td>'+esc(cname(d.customer_id))+'</td><td>'+kg(d.total_kg)+'</td><td>'+esc(d.status||'—')+'</td><td>'+esc(d.vehicle_plate||'—')+'</td><td>'+esc(d.driver_name||'—')+'</td></tr>').join('')||'<tr><td colspan="6">Kayıt yok.</td></tr>')+'</tbody></table>'}function metric(a,b){return'<div class="card"><span class="muted">'+a+'</span><div class="v">'+b+'</div></div>'}function resetFilters(){from.value='';to.value='';customer.value='';product.value='';payment.value='';saleStatus.value='active';render()}function exportCsv(){let rows=[['Tarih','Müşteri','Ödeme','Vade','Kg','Kg Fiyatı','Ciro','Maliyet','Kâr'],...filtered.map(s=>{let q=D.items.filter(i=>i.sale_id===s.id).reduce((a,i)=>a+Number(i.quantity||0),0),t=Number(s.total||0),c=Number(s.cost_total||0);return[s.sale_date,cname(s.customer_id),s.payment_type||'',s.due_date||'',q,q?t/q:0,t,c,t-c]})];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='carbonerp-rapor.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}init();</script></body></html>
