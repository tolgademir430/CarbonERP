<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Raporlar Merkezi</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1400px;margin:auto;padding:18px}.toolbar,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800}.field input,.field select{padding:9px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#172033;color:#fff}.ok{background:#087443;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.v{font-size:23px;font-weight:900}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}.table th{background:#f8fafc}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e9edf2}.tabs button.on{background:#087443;color:#fff}.muted{color:#667085}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="toolbar"><div><h1>📊 Raporlar Merkezi</h1><div class="muted">Satış, cari, ürün, finans ve sevkiyatı tek ekrandan filtrele.</div></div><button class="btn dark" onclick="resetFilters()">Filtreleri Sıfırla</button><button class="btn ok" onclick="window.print()">🖨 Yazdır</button></div><div class="panel"><div class="tabs"><button class="on" data-type="sales" onclick="setType('sales',this)">Satış</button><button data-type="customers" onclick="setType('customers',this)">Müşteri</button><button data-type="finance" onclick="setType('finance',this)">Finans</button><button data-type="delivery" onclick="setType('delivery',this)">Sevkiyat</button></div><div class="filters" style="margin-top:12px"><label class="field">Başlangıç<input id="from" type="date"></label><label class="field">Bitiş<input id="to" type="date"></label><label class="field">Müşteri<select id="customer"><option value="">Tümü</option></select></label><label class="field">Durum<select id="status"><option value="">Tümü</option><option value="pending">Bekliyor</option><option value="preparing">Hazırlanıyor</option><option value="loaded">Araca Yüklendi</option><option value="out_for_delivery">Dağıtımda</option><option value="delivered">Teslim Edildi</option><option value="cancelled">İptal</option></select></label><label class="field">İşlem<select id="payment"><option value="">Tümü</option><option value="cash">Peşin</option><option value="credit">Vadeli</option></select></label><button class="btn dark" onclick="render()">Uygula</button></div></div><div id="stats" class="grid"></div><div class="panel"><div id="table" class="table"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let sales=[],customers=[],deliveries=[],type='sales';const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const kg=n=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' kg';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>customers.find(x=>x.id===id)?.name||'Müşteri';async function load(){let [c,s,d]=await Promise.all([db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('sales').select('*').order('sale_date',{ascending:false}),db.from('delivery_orders').select('*').order('delivery_date',{ascending:false})]);let e=c.error||s.error||d.error;if(e)return alert(e.message);customers=c.data||[];sales=s.data||[];deliveries=d.data||[];customer.innerHTML='<option value="">Tümü</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);from.value=first.toISOString().slice(0,10);to.value=now.toISOString().slice(0,10);render()}function inRange(date){if(!date)return true;let d=String(date).slice(0,10);return (!from.value||d>=from.value)&&(!to.value||d<=to.value)}function selectedCustomer(x){return !customer.value||x.customer_id===customer.value}function filteredSales(){return sales.filter(s=>inRange(s.sale_date||s.created_at)&&selectedCustomer(s)&&(!payment.value||String(s.payment_type||s.payment_method||'').toLowerCase()===payment.value))}function setType(x,b){type=x;document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');render()}function resetFilters(){from.value='';to.value='';customer.value='';status.value='';payment.value='';render()}function render(){let ss=filteredSales();if(type==='sales')renderSales(ss);else if(type==='customers')renderCustomers(ss);else if(type==='finance')renderFinance(ss);else renderDelivery()}function renderSales(ss){let total=ss.reduce((a,s)=>a+Number(s.total_amount||s.total||0),0),kgs=ss.reduce((a,s)=>a+Number(s.total_kg||s.kg||0),0),paid=ss.reduce((a,s)=>a+Number(s.paid_amount||s.paid||0),0),open=Math.max(total-paid,0),avg=kgs?total/kgs:0;stats.innerHTML=stat('Ciro',money(total))+stat('Satılan',kg(kgs))+stat('Ort. kg fiyatı',money(avg))+stat('Açık alacak',money(open));table.innerHTML=`<table><thead><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Kg Fiyatı</th><th>Toplam</th><th>Tahsilat</th><th>Kalan</th><th>Vade</th></tr></thead><tbody>${ss.map(s=>{let t=Number(s.total_amount||s.total||0),p=Number(s.paid_amount||s.paid||0),k=Number(s.total_kg||s.kg||0);return`<tr><td>${esc(s.sale_date||'')}</td><td>${esc(cname(s.customer_id))}</td><td>${kg(k)}</td><td>${money(k?t/k:0)}</td><td>${money(t)}</td><td>${money(p)}</td><td>${money(Math.max(t-p,0))}</td><td>${esc(s.due_date||'—')}</td></tr>`}).join('')}</tbody></table>`}function renderCustomers(ss){let m=new Map();ss.forEach(s=>{let x=m.get(s.customer_id)||{sales:0,kg:0,paid:0};x.sales+=Number(s.total_amount||s.total||0);x.kg+=Number(s.total_kg||s.kg||0);x.paid+=Number(s.paid_amount||s.paid||0);m.set(s.customer_id,x)});let arr=[...m.entries()].sort((a,b)=>b[1].sales-a[1].sales);let total=arr.reduce((a,[,x])=>a+x.sales,0),kgTotal=arr.reduce((a,[,x])=>a+x.kg,0),open=arr.reduce((a,[,x])=>a+Math.max(x.sales-x.paid,0),0);stats.innerHTML=stat('Müşteri',arr.length)+stat('Ciro',money(total))+stat('Kg',kg(kgTotal))+stat('Açık alacak',money(open));table.innerHTML=`<table><thead><tr><th>#</th><th>Müşteri</th><th>Kg</th><th>Ciro</th><th>Tahsilat</th><th>Bakiye</th><th>Ort. kg fiyatı</th></tr></thead><tbody>${arr.map(([id,x],i)=>`<tr><td>${i+1}</td><td>${esc(cname(id))}</td><td>${kg(x.kg)}</td><td>${money(x.sales)}</td><td>${money(x.paid)}</td><td>${money(Math.max(x.sales-x.paid,0))}</td><td>${money(x.kg?x.sales/x.kg:0)}</td></tr>`).join('')}</tbody></table>`}function renderFinance(ss){let salesTotal=ss.reduce((a,s)=>a+Number(s.total_amount||s.total||0),0),paid=ss.reduce((a,s)=>a+Number(s.paid_amount||s.paid||0),0),open=Math.max(salesTotal-paid,0),cost=ss.reduce((a,s)=>a+Number(s.total_cost||s.cost||0),0),profit=salesTotal-cost;stats.innerHTML=stat('Ciro',money(salesTotal))+stat('Tahsilat',money(paid))+stat('Açık alacak',money(open))+stat('Brüt kâr',money(profit));table.innerHTML=`<table><thead><tr><th>Finans özeti</th><th>Tutar</th></tr></thead><tbody><tr><td>Satış</td><td>${money(salesTotal)}</td></tr><tr><td>Tahsilat</td><td>${money(paid)}</td></tr><tr><td>Açık alacak</td><td>${money(open)}</td></tr><tr><td>Maliyet</td><td>${money(cost)}</td></tr><tr><td>Brüt kâr</td><td>${money(profit)}</td></tr><tr><td>Kâr marjı</td><td>${salesTotal?(profit/salesTotal*100).toFixed(2):'0.00'}%</td></tr></tbody></table>`}function renderDelivery(){let d=deliveries.filter(x=>inRange(x.delivery_date)&&selectedCustomer(x)&&(!status.value||x.status===status.value)),kgs=d.reduce((a,x)=>a+Number(x.total_kg||0),0),done=d.filter(x=>x.status==='delivered').length;stats.innerHTML=stat('Teslimat',d.length)+stat('Toplam kg',kg(kgs))+stat('Teslim edildi',done)+stat('Bekleyen',d.filter(x=>x.status!=='delivered').length);table.innerHTML=`<table><thead><tr><th>Tarih</th><th>Müşteri</th><th>Kg</th><th>Durum</th><th>Araç</th><th>Şoför</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.delivery_date||'')}</td><td>${esc(cname(x.customer_id))}</td><td>${kg(x.total_kg)}</td><td>${esc(x.status||'')}</td><td>${esc(x.vehicle_id||'—')}</td><td>${esc(x.driver_id||'—')}</td></tr>`).join('')}</tbody></table>`}function stat(a,b){return`<div class="card"><small>${a}</small><div class="v">${b}</div></div>`}load();</script></body></html>
