<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Raporlar</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Arial}.wrap{max-width:1450px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:25px}.muted{color:#667085;font-size:13px}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn{background:#eef1f5}.btn.dark{background:#172033;color:#fff}.btn.ok,.tab.active{background:#087443;color:#fff}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin:14px 0}.tabs{border-bottom:1px solid #eaecf0;padding-bottom:10px}.tab{background:#f1f3f6}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}.field{font-size:11px;font-weight:850;color:#475467}.field input,.field select{width:100%;margin-top:5px;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:13px}.metric small{color:#667085}.metric b{display:block;font-size:19px;margin-top:5px}.green{color:#087443}.red{color:#b42318}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;white-space:nowrap}.table th{font-size:11px;color:#667085;background:#f8fafc}.table tr:hover td{background:#fafbfc}.empty{text-align:center;padding:30px;color:#667085}.note{background:#fffaeb;border:1px solid #fedf89;border-radius:10px;padding:11px;font-size:12px;color:#854f0b;margin-top:12px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mini{font-size:11px;color:#667085}@media(max-width:1050px){.filters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.filters,.cards{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.filters,.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>📊 Raporlar Merkezi</h1><div class="muted">Detaylı analiz, sade görünüm ve tek ekrandan filtreleme</div></div><div class="actions"><button class="btn dark" onclick="load()">↻ Yenile</button><button class="btn" onclick="resetFilters()">Filtreleri Sıfırla</button><button class="btn ok" onclick="exportCsv()">CSV Dışa Aktar</button><button class="btn" onclick="window.print()">🖨 Yazdır</button></div></div><div class="panel"><div class="tabs"><button class="tab active" data-tab="sales">Satış</button><button class="tab" data-tab="customers">Müşteri</button><button class="tab" data-tab="products">Ürün</button><button class="tab" data-tab="finance">Finans</button></div><div class="filters"><label class="field">Başlangıç<input id="from" type="date"></label><label class="field">Bitiş<input id="to" type="date"></label><label class="field">Müşteri<select id="customer"><option value="">Tümü</option></select></label><label class="field">Ürün<select id="product"><option value="">Tümü</option></select></label><label class="field">Ödeme<select id="payment"><option value="">Tümü</option><option value="cash">Peşin</option><option value="credit">Vadeli</option><option value="card">Kart</option><option value="transfer">Havale/EFT</option></select></label><label class="field">Durum<select id="status"><option value="active">Aktif</option><option value="all">Tümü</option><option value="cancelled">İptal</option></select></label></div><div class="actions" style="margin-top:12px"><button class="btn ok" onclick="render()">Filtrele</button></div></div><div id="cards" class="cards"></div><div id="note"></div><div class="panel"><div class="sectiontitle"><div><b id="reportTitle">Satış Raporu</b><div id="reportSub" class="mini"></div></div></div><div id="report" class="tablewrap"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={sales:[],items:[],customers:[],products:[],expenses:[],collections:[]},tab='sales',filtered=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0),num=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(Number(n)||0),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),cname=id=>D.customers.find(x=>x.id===id)?.name||'Bilinmeyen müşteri',pname=id=>D.products.find(x=>x.id===id)?.name||'Bilinmeyen ürün';function card(t,v,c=''){return`<div class="metric"><small>${t}</small><b class="${c}">${v}</b></div>`}function dates(){let d=new Date(),f=new Date(d.getFullYear(),d.getMonth(),1);from.value=f.toISOString().slice(0,10);to.value=d.toISOString().slice(0,10)}async function load(){note.innerHTML='';let [s,i,c,p,e,k]=await Promise.all([db.from('sales').select('*').order('sale_date',{ascending:false}),db.from('sale_items').select('*'),db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('products').select('id,name,unit').eq('is_active',true).order('name'),db.from('expenses').select('*'),db.from('collections').select('*')]);let err=[s,i,c,p,e,k].find(x=>x.error);if(err){note.innerHTML=`<div class="note">Rapor verisi alınamadı: ${esc(err.error.message)}</div>`;return}D={sales:s.data||[],items:i.data||[],customers:c.data||[],products:p.data||[],expenses:e.data||[],collections:k.data||[]};customer.innerHTML='<option value="">Tümü</option>'+D.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');product.innerHTML='<option value="">Tümü</option>'+D.products.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');dates();render()}function matches(s){if(status.value==='active'&&s.status==='cancelled')return false;if(status.value==='cancelled'&&s.status!=='cancelled')return false;if(from.value&&(s.sale_date||'')<from.value)return false;if(to.value&&(s.sale_date||'')>to.value)return false;if(customer.value&&s.customer_id!==customer.value)return false;if(payment.value&&String(s.payment_type||'').toLowerCase()!==payment.value)return false;if(product.value&&!D.items.some(i=>i.sale_id===s.id&&i.product_id===product.value))return false;return true}function sales(){return D.sales.filter(matches)}function render(){filtered=sales();if(tab==='sales')salesReport();else if(tab==='customers')customerReport();else if(tab==='products')productReport();else financeReport()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});function salesReport(){let rev=filtered.reduce((a,s)=>a+Number(s.total||0),0),cost=filtered.reduce((a,s)=>a+Number(s.cost_total||0),0),q=D.items.filter(i=>filtered.some(s=>s.id===i.sale_id)).reduce((a,i)=>a+Number(i.quantity||0),0),profit=rev-cost,credit=filtered.filter(s=>s.payment_type==='credit').reduce((a,s)=>a+Number(s.total||0),0);reportTitle.textContent='Satış Raporu';reportSub.textContent=`${filtered.length} satış · ${from.value} — ${to.value}`;cards.innerHTML=card('Satış adedi',num(filtered.length))+card('Ciro',money(rev))+card('Satılan miktar',num(q)+' kg')+card('Maliyet',money(cost))+card('Brüt kâr',money(profit),profit>=0?'green':'red')+card('Vadeli satış',money(credit));report.innerHTML=`<table class="table"><thead><tr><th>#</th><th>Tarih</th><th>Müşteri</th><th>Ödeme</th><th>Vade</th><th>Miktar</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th><th>Marj</th></tr></thead><tbody>${filtered.map((s,n)=>{let q=D.items.filter(i=>i.sale_id===s.id).reduce((a,i)=>a+Number(i.quantity||0),0),r=Number(s.total||0),c=Number(s.cost_total||0),p=r-c;return`<tr><td>${n+1}</td><td>${esc(s.sale_date)}</td><td>${esc(cname(s.customer_id))}</td><td>${esc(s.payment_type||'—')}</td><td>${esc(s.due_date||'—')}</td><td>${num(q)} kg</td><td>${money(r)}</td><td>${money(c)}</td><td class="${p>=0?'green':'red'}">${money(p)}</td><td>${r?num(p/r*100):'0'}%</td></tr>`}).join('')||'<tr><td colspan="10" class="empty">Filtreye uygun satış yok.</td></tr>'}</tbody></table>`}function customerReport(){let m={};filtered.forEach(s=>{let x=m[s.customer_id]??={count:0,q:0,rev:0,cost:0};x.count++;x.rev+=Number(s.total||0);x.cost+=Number(s.cost_total||0);D.items.filter(i=>i.sale_id===s.id).forEach(i=>x.q+=Number(i.quantity||0))});let a=Object.entries(m).sort((x,y)=>y[1].rev-x[1].rev),rev=a.reduce((n,[,x])=>n+x.rev,0),q=a.reduce((n,[,x])=>n+x.q,0),p=a.reduce((n,[,x])=>n+x.rev-x.cost,0);reportTitle.textContent='Müşteri Performansı';reportSub.textContent='Ciro, miktar, kârlılık ve ortalama kg fiyatı';cards.innerHTML=card('Müşteri',num(a.length))+card('Ciro',money(rev))+card('Kg',num(q)+' kg')+card('Brüt kâr',money(p),p>=0?'green':'red')+card('Ort. kg fiyatı',money(q?rev/q:0))+card('Kâr marjı',rev?num(p/rev*100)+'%':'0%');report.innerHTML=`<table class="table"><thead><tr><th>#</th><th>Müşteri</th><th>Satış</th><th>Kg</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th><th>Ort. kg</th><th>Marj</th></tr></thead><tbody>${a.map(([id,x],n)=>{let p=x.rev-x.cost;return`<tr><td>${n+1}</td><td>${esc(cname(id))}</td><td>${x.count}</td><td>${num(x.q)} kg</td><td>${money(x.rev)}</td><td>${money(x.cost)}</td><td class="${p>=0?'green':'red'}">${money(p)}</td><td>${money(x.q?x.rev/x.q:0)}</td><td>${x.rev?num(p/x.rev*100):'0'}%</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Kayıt yok.</td></tr>'}</tbody></table>`}function productReport(){let m={};filtered.forEach(s=>D.items.filter(i=>i.sale_id===s.id).forEach(i=>{let x=m[i.product_id]??={q:0,rev:0,cost:0,count:0};x.q+=Number(i.quantity||0);x.rev+=Number(i.line_total||0);x.cost+=Number(i.cost_total||0);x.count++}));let a=Object.entries(m).sort((x,y)=>y[1].rev-x[1].rev),rev=a.reduce((n,[,x])=>n+x.rev,0),q=a.reduce((n,[,x])=>n+x.q,0),cost=a.reduce((n,[,x])=>n+x.cost,0);reportTitle.textContent='Ürün Performansı';reportSub.textContent='Ürün bazında miktar, ciro ve kârlılık';cards.innerHTML=card('Ürün',num(a.length))+card('Satılan kg',num(q)+' kg')+card('Ciro',money(rev))+card('Maliyet',money(cost))+card('Brüt kâr',money(rev-cost),rev>=cost?'green':'red')+card('Ort. kg fiyatı',money(q?rev/q:0));report.innerHTML=`<table class="table"><thead><tr><th>#</th><th>Ürün</th><th>Satış satırı</th><th>Miktar</th><th>Ciro</th><th>Maliyet</th><th>Kâr</th><th>Ort. kg</th></tr></thead><tbody>${a.map(([id,x],n)=>{let p=x.rev-x.cost;return`<tr><td>${n+1}</td><td>${esc(pname(id))}</td><td>${x.count}</td><td>${num(x.q)} kg</td><td>${money(x.rev)}</td><td>${money(x.cost)}</td><td class="${p>=0?'green':'red'}">${money(p)}</td><td>${money(x.q?x.rev/x.q:0)}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Kayıt yok.</td></tr>'}</tbody></table>`}function financeReport(){let rev=filtered.reduce((a,s)=>a+Number(s.total||0),0),cost=filtered.reduce((a,s)=>a+Number(s.cost_total||0),0),exp=D.expenses.filter(e=>(!from.value||e.expense_date>=from.value)&&(!to.value||e.expense_date<=to.value)).reduce((a,e)=>a+Number(e.amount||0),0),gross=rev-cost,net=gross-exp,collections=D.collections.filter(c=>(!from.value||c.collection_date>=from.value)&&(!to.value||c.collection_date<=to.value)&&c.status==='completed').reduce((a,c)=>a+Number(c.amount||0),0),credit=filtered.filter(s=>s.payment_type==='credit').reduce((a,s)=>a+Number(s.total||0),0);reportTitle.textContent='Finansal Özet';reportSub.textContent='Ciro, maliyet, gider, tahsilat ve kârlılık';cards.innerHTML=card('Ciro',money(rev))+card('Maliyet',money(cost))+card('Brüt kâr',money(gross),gross>=0?'green':'red')+card('Gider',money(exp),'red')+card('Tahsilat',money(collections),'green')+card('Vadeli satış',money(credit));note.innerHTML='<div class="note">Net sonuç = Ciro − Maliyet − Gider. Tahsilat ayrı gösterilir; tahsilat yeni gelir değildir.</div>';report.innerHTML=`<table class="table"><thead><tr><th>Finans kalemi</th><th>Tutar</th><th>Açıklama</th></tr></thead><tbody><tr><td>Ciro</td><td>${money(rev)}</td><td>Filtrelenmiş satışlar</td></tr><tr><td>Mal maliyeti</td><td>${money(cost)}</td><td>Satış maliyetleri</td></tr><tr><td>Brüt kâr</td><td>${money(gross)}</td><td>Ciro − maliyet</td></tr><tr><td>Gider</td><td>${money(exp)}</td><td>Seçilen dönemdeki giderler</td></tr><tr><td>Net sonuç</td><td>${money(net)}</td><td>Brüt kâr − gider</td></tr><tr><td>Tahsilat</td><td>${money(collections)}</td><td>Tamamlanan tahsilatlar</td></tr><tr><td>Vadeli satış</td><td>${money(credit)}</td><td>Cari alacak oluşumunu gösterir</td></tr></tbody></table>`}function resetFilters(){dates();customer.value='';product.value='';payment.value='';status.value='active';render()}function exportCsv(){let t=document.querySelector('#report table');if(!t)return;let rows=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replaceAll('"','""')+'"').join(';'));let blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carbonerp-rapor-'+tab+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}load();</script></body></html>
