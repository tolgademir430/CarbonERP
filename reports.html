publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={sales:[],items:[],customers:[],products:[],expenses:[],collections:[],balances:[]},tab='overview',filtered=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0),num=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(Number(n)||0),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),cn=id=>D.customers.find(x=>x.id===id)?.name||'Bilinmeyen',pn=id=>D.products.find(x=>x.id===id)?.name||'Bilinmeyen';const card=(t,v,c='')=>`<div class="metric"><small>${t}</small><b class="${c}">${v}</b></div>`;function setDates(){let d=new Date(),f=new Date(d.getFullYear(),d.getMonth(),1);from.value=f.toISOString().slice(0,10);to.value=d.toISOString().slice(0,10)}async function load(){let r=await Promise.all([db.from('sales').select('*'),db.from('sale_items').select('*'),db.from('customers').select('id,name,is_active'),db.from('products').select('id,name,unit,is_active,stock_quantity,min_stock'),db.from('expenses').select('*'),db.from('collections').select('*'),db.from('customer_current_balances').select('*')]);let e=r.find(x=>x.error);if(e){note.innerHTML=`<div class="note">Rapor verisi alınamadı: ${esc(e.error.message)}</div>`;return}D={sales:r[0].data||[],items:r[1].data||[],customers:r[2].data||[],products:r[3].data||[],expenses:r[4].data||[],collections:r[5].data||[],balances:r[6].data||[]};customer.innerHTML='<option value="">Tümü</option>'+D.customers.filter(x=>x.is_active).sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');product.innerHTML='<option value="">Tümü</option>'+D.products.filter(x=>x.is_active).sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');setDates();render()}function match(s){if(status.value==='active'&&s.status==='cancelled')return false;if(status.value==='cancelled'&&s.status!=='cancelled')return false;if(from.value&&(s.sale_date||'')<from.value)return false;if(to.value&&(s.sale_date||'')>to.value)return false;if(customer.value&&s.customer_id!==customer.value)return false;if(payment.value&&String(s.payment_type||'').toLowerCase()!==payment.value)return false;if(product.value&&!D.items.some(i=>i.sale_id===s.id&&i.product_id===product.value))return false;return true}function getSales(arr=D.sales){return arr.filter(match)}function rankCustomers(){let m={};filtered.forEach(s=>{let x=m[s.customer_id]??={id:s.customer_id,name:cn(s.customer_id),rev:0,cost:0,q:0,count:0};x.rev+=+s.total||0;x.cost+=+s.cost_total||0;x.count++;D.items.filter(i=>i.sale_id===s.id).forEach(i=>x.q+=+i.quantity||0)});return Object.values(m).sort((a,b)=>b.rev-a.rev)}function rankProducts(){let m={};filtered.forEach(s=>D.items.filter(i=>i.sale_id===s.id).forEach(i=>{let x=m[i.product_id]??={id:i.product_id,name:pn(i.product_id),rev:0,cost:0,q:0,count:0};x.rev+=+i.line_total||0;x.cost+=+i.cost_total||0;x.q+=+i.quantity||0;x.count++}));return Object.values(m).sort((a,b)=>b.rev-a.rev)}function render(){filtered=getSales();note.innerHTML='';({overview,customersReport,productsReport,riskReport,compareReport}[tab]||overview)()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});function overview(){let rev=filtered.reduce((a,s)=>a+(+s.total||0),0),cost=filtered.reduce((a,s)=>a+(+s.cost_total||0),0),exp=D.expenses.filter(e=>(!from.value||e.expense_date>=from.value)&&(!to.value||e.expense_date<=to.value)).reduce((a,e)=>a+(+e.amount||0),0),col=D.collections.filter(c=>c.status==='completed'&&(!from.value||c.collection_date>=from.value)&&(!to.value||c.collection_date<=to.value)).reduce((a,c)=>a+(+c.amount||0),0),q=filtered.reduce((a,s)=>a+D.items.filter(i=>i.sale_id===s.id).reduce((n,i)=>n+(+i.quantity||0),0),0),p= in('')+'</table><h3>Düşük stoklar</h3><table class="table"><tr><th>Ürün</th><th>Mevcut</th><th>Minimum</th><th>Eksik</th></tr>'+low.map(x=>`<tr><td>${esc(x.name)}</td><td>${num(x.stock_quantity)}</td><td>${num(x.min_stock)}</td><td class="red">${num(+x.min_stock-+x.stock_quantity)}</td></tr>`).join('')+'</table><h3>Düşük marjlı satışlar</h3><table class="table"><tr><th>Tarih</th><th>Müşteri</th><th>Ciro</th><th>Marj</th></tr>'+lowMargin.slice(0,20).map(x=>`<tr><td>${esc(x.sale_date)}</td><td>${esc(cn(x.customer_id))}</td><td>${money(x.total)}</td><td class="red">${num(x.margin)}%</td></tr>`).join('')+'</table>'}function compareReport(){let f=new Date(from.value),t=new Date(to.value),days=Math.max(1,Math.round((t-f)/86400000)+1),pf=new Date(f);pf.setDate(pf.getDate()-days);let pt=new Date(f);pt.setDate(pt.getDate()-1),prev=D.sales.filter(s=>{let d=s.sale_date||'';return d>=pf.toISOString().slice(0,10)&&d<=pt.toISOString().slice(0,10)&&s.status!=='cancelled'}),rev=a=>a.reduce((n,s)=>n+(+s.total||0),0),cost=a=>a.reduce((n,s)=>n+(+s.cost_total||0),0),q=a=>a.reduce((n,s)=>n+D.items.filter(i=>i.sale_id===s.id).reduce((z,i)=>z+(+i.quantity||0),0),0),cv=rev(filtered),pv=rev(prev),cq=q(filtered),pq=q(prev),cp=cv-cost(filtered),pp=pv-cost(prev),chg=(a,b)=>b?(a-b)/b*100:0;title.textContent='Dönem Karşılaştırma';sub.textContent=`Mevcut ${from.value}—${to.value} · Önceki ${pf.toISOString().slice(0,10)}—${pt.toISOString().slice(0,10)}`;cards.innerHTML=card('Ciro değişimi',num(chg(cv,pv))+'%',cv>=pv?'green':'red')+card('Kg değişimi',num(chg(cq,pq))+'%',cq>=pq?'green':'red')+card('Kâr değişimi',num(chg(cp,pp))+'%',cp>=pp?'green':'red')+card('Mevcut ciro',money(cv))+card('Önceki ciro',money(pv))+card('Mevcut kâr',money(cp),cp>=0?'green':'red');report.innerHTML=`<table class="table"><tr><th>Gösterge</th><th>Önceki</th><th>Mevcut</th><th>Değişim</th></tr><tr><td>Ciro</td><td>${money(pv)}</td><td>${money(cv)}</td><td>${num(chg(cv,pv))}%</td></tr><tr><td>Satılan kg</td><td>${num(pq)}</td><td>${num(cq)}</td><td>${num(chg(cq,pq))}%</td></tr><tr><td>Brüt kâr</td><td>${money(pp)}</td><td>${money(cp)}</td><td>${num(chg(cp,pp))}%</td></tr><tr><td>Satış adedi</td><td>${prev.length}</td><td>${filtered.length}</td><td>${num(chg(filtered.length,prev.length))}%</td></tr></table>`}function resetF(){setDates();customer.value='';product.value='';payment.value='';status.value='active';render()}function exportCsv(){let t=document.querySelector('#report table');if(!t)return;let rows=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replaceAll('"','""')+'"').join(';'));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='carbonerp-'+tab+'-rapor.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}load();</script></body></html>
