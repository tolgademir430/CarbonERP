<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP V25 · Araç & Şoför Merkezi</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.tabs button{background:#e9edf2}.tabs button.on,.dark{background:#172033;color:white}.ok{background:#087443;color:#fff}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.v{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.badge{padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}input{padding:10px;border:1px solid #d0d5dd;border-radius:9px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:white;border-radius:16px;padding:18px;width:min(620px,100%)}.hidden{display:none}@media(max-width:750px){.cards,.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}@media(max-width:480px){.cards,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>CarbonERP V25</h1><p>Araç, şoför ve günlük dağıtım merkezi</p></div><button class="btn ok" onclick="seedPrompt()">+ Hızlı Tanımla</button></div><div class="cards" id="stats"></div><div class="tabs"><button class="on" onclick="tab('routes',this)">🚚 Günlük Dağıtım</button><button onclick="tab('vehicles',this)">🚐 Araçlar</button><button onclick="tab('drivers',this)">👤 Şoförler</button></div><div id="app"></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={v:[],d:[],o:[],c:[]},active='routes';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const statuses={pending:'Bekliyor',preparing:'Hazırlanıyor',loaded:'Araca Yüklendi',out_for_delivery:'Dağıtımda',delivered:'Teslim Edildi'};async function load(){let [v,d,o,c]=await Promise.all([db.from('vehicles').select('*').eq('is_active',true).order('plate'),db.from('drivers').select('*').eq('is_active',true).order('name'),db.from('delivery_orders').select('*').order('delivery_date').order('created_at'),db.from('customers').select('id,name').eq('is_active',true)]);D={v:v.data||[],d:d.data||[],o:o.data||[],c:c.data||[]};render()}const cname=id=>D.c.find(x=>x.id===id)?.name||'Müşteri';const vn=id=>D.v.find(x=>x.id===id)?.plate||'Atanmamış';const dn=id=>D.d.find(x=>x.id===id)?.name||'Atanmamış';function render(){stats.innerHTML=`<div class="card"><small>Araç</small><div class="v">${D.v.length}</div></div><div class="card"><small>Şoför</small><div class="v">${D.d.length}</div></div><div class="card"><small>Bugünkü Teslimat</small><div class="v">${D.o.filter(x=>x.delivery_date===new Date().toISOString().slice(0,10)).length}</div></div><div class="card"><small>Dağıtımda</small><div class="v">${D.o.filter(x=>x.status==='out_for_delivery').length}</div></div>`;if(active==='routes')routes();if(active==='vehicles')vehicles();if(active==='drivers')drivers()}function tab(x,b){active=x;document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');render()}function routes(){app.innerHTML=`<div class="panel"><div class="toolbar"><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}" onchange="routes()"><input id="search" placeholder="Müşteri / plaka / şoför ara" oninput="routes()"></div><div class="grid">${D.v.map(v=>{let rows=D.o.filter(o=>o.delivery_date===date.value&&o.vehicle_id===v.id&&`${cname(o.customer_id)} ${dn(o.driver_id)} ${v.plate}`.toLocaleLowerCase('tr-TR').includes((search?.value||'').toLocaleLowerCase('tr-TR')));return`<div class="card"><h3>🚐 ${esc(v.plate)} ${v.name?'· '+esc(v.name):''}</h3><small>Kapasite: ${v.capacity_kg||'—'} kg</small>${rows.map(o=>`<div class="row"><div><b>${esc(cname(o.customer_id))}</b><br><small>${esc(dn(o.driver_id))} · ${statuses[o.status]||o.status}</small></div><button class="btn dark" onclick="assign('${o.id}')">Düzenle</button></div>`).join('')||'<p>Bu araçta teslimat yok.</p>'}</div>`}).join('')}</div><div class="card"><h3>🚚 Atanmamış Teslimatlar</h3>${D.o.filter(o=>o.delivery_date===date.value&&!o.vehicle_id).map(o=>`<div class="row"><b>${esc(cname(o.customer_id))}</b><button class="btn ok" onclick="assign('${o.id}')">Araç Ata</button></div>`).join('')||'Yok.'}</div></div>`}function vehicles(){app.innerHTML=`<div class="panel"><button class="btn ok" onclick="vehicleForm()">+ Araç Ekle</button>${D.v.map(v=>`<div class="row"><div><b>${esc(v.plate)}</b> ${esc(v.name||'')}<br><small>${esc(v.brand||'')} ${esc(v.model||'')} · ${v.capacity_kg||'—'} kg</small></div><button class="btn dark" onclick="vehicleForm('${v.id}')">Düzenle</button></div>`).join('')||'<p>Henüz araç yok.</p>'}</div>`}function drivers(){app.innerHTML=`<div class="panel"><button class="btn ok" onclick="driverForm()">+ Şoför Ekle</button>${D.d.map(v=>`<div class="row"><div><b>${esc(v.name)}</b><br><small>${esc(v.phone||'')} · Ehliyet: ${esc(v.license_no||'')}</small></div><button class="btn dark" onclick="driverForm('${v.id}')">Düzenle</button></div>`).join('')||'<p>Henüz şoför yok.</p>'}</div>`}function vehicleForm(id){let x=D.v.find(a=>a.id===id)||{};modal.innerHTML=`<div class="box"><h2>${id?'Araç Düzenle':'Yeni Araç'}</h2><input id="plate" placeholder="Plaka *" value="${esc(x.plate)}"><br><br><input id="name" placeholder="Araç adı" value="${esc(x.name)}"><br><br><input id="brand" placeholder="Marka" value="${esc(x.brand)}"><br><br><input id="model" placeholder="Model" value="${esc(x.model)}"><br><br><input id="cap" type="number" placeholder="Kapasite kg" value="${x.capacity_kg||''}"><br><br><button class="btn ok" onclick="saveVehicle('${id||''}')">Kaydet</button> <button class="btn" onclick="close()">İptal</button></div>`;modal.classList.remove('hidden')}async function saveVehicle(id){let data={plate:plate.value.trim().toUpperCase(),name:name.value.trim()||null,brand:brand.value.trim()||null,model:model.value.trim()||null,capacity_kg:cap.value?Number(cap.value):null};if(!data.plate)return alert('Plaka gerekli.');let r=id?await db.from('vehicles').update(data).eq('id',id):await db.from('vehicles').insert(data);if(r.error)return alert(r.error.message);close();load()}function driverForm(id){let x=D.d.find(a=>a.id===id)||{};modal.innerHTML=`<div class="box"><h2>${id?'Şoför Düzenle':'Yeni Şoför'}</h2><input id="name" placeholder="Ad soyad *" value="${esc(x.name)}"><br><br><input id="phone" placeholder="Telefon" value="${esc(x.phone)}"><br><br><input id="lic" placeholder="Ehliyet no" value="${esc(x.license_no)}"><br><br><button class="btn ok" onclick="saveDriver('${id||''}')">Kaydet</button> <button class="btn" onclick="close()">İptal</button></div>`;modal.classList.remove('hidden')}async function saveDriver(id){let data={name:name.value.trim(),phone:phone.value.trim()||null,license_no:lic.value.trim()||null};if(!data.name)return alert('Ad soyad gerekli.');let r=id?await db.from('drivers').update(data).eq('id',id):await db.from('drivers').insert(data);if(r.error)return alert(r.error.message);close();load()}function assign(id){let o=D.o.find(x=>x.id===id);modal.innerHTML=`<div class="box"><h2>${esc(cname(o.customer_id))}</h2><p>${esc(o.address||'Adres yok')}</p><label>Araç</label><select id="veh"><option value="">Atama yok</option>${D.v.map(v=>`<option value="${v.id}" ${o.vehicle_id===v.id?'selected':''}>${esc(v.plate)} ${esc(v.name||'')}</option>`).join('')}</select><label>Şoför</label><select id="drv"><option value="">Atama yok</option>${D.d.map(v=>`<option value="${v.id}" ${o.driver_id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select><br><br><button class="btn ok" onclick="saveAssign('${id}')">Kaydet</button> <button class="btn" onclick="close()">İptal</button></div>`;modal.classList.remove('hidden')}async function saveAssign(id){let r=await db.from('delivery_orders').update({vehicle_id:veh.value||null,driver_id:drv.value||null}).eq('id',id);if(r.error)return alert(r.error.message);close();load()}function seedPrompt(){modal.innerHTML=`<div class="box"><h2>Hızlı Tanımla</h2><p>İstersen buradan araç veya şoför tanımlayabilirsin.</p><button class="btn dark" onclick="close();vehicleForm()">Araç Ekle</button> <button class="btn ok" onclick="close();driverForm()">Şoför Ekle</button></div>`;modal.classList.remove('hidden')}function close(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
