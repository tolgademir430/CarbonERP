<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP V26 · Günlük Sevkiyat Planı</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.v{font-size:23px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.btn{padding:9px 12px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.dark{background:#172033;color:#fff}.ok{background:#087443;color:#fff}.warn{background:#b54708;color:#fff}.badge{padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}.over{color:#b42318;font-weight:900}.oktext{color:#087443;font-weight:900}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:#fff;border-radius:16px;padding:18px;width:min(760px,100%);max-height:92vh;overflow:auto}.hidden{display:none}select,input{padding:10px;border:1px solid #d0d5dd;border-radius:9px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>CarbonERP V26</h1><p>Günlük sevkiyat planı · araç kapasitesi · teslimat listesi</p></div><button class="btn ok" onclick="plan()">Planı Yenile</button></div><div class="cards" id="stats"></div><div class="panel"><div class="toolbar"><input id="day" type="date" onchange="load()"><button class="btn dark" onclick="autoPlan()">⚡ Otomatik Dağıt</button><button class="btn" onclick="printPlan()">🖨 Yazdır</button></div></div><div id="app"></div></div><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let D={v:[],d:[],o:[],c:[]};const statuses={pending:'Bekliyor',preparing:'Hazırlanıyor',loaded:'Araca Yüklendi',out_for_delivery:'Dağıtımda',delivered:'Teslim Edildi',cancelled:'İptal'};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cname=id=>D.c.find(x=>x.id===id)?.name||'Müşteri';const vn=id=>D.v.find(x=>x.id===id)?.plate||'Atanmamış';const dn=id=>D.d.find(x=>x.id===id)?.name||'Atanmamış';function today(){return new Date().toISOString().slice(0,10)}async function load(){day.value=day.value||today();let [v,d,o,c]=await Promise.all([db.from('vehicles').select('*').eq('is_active',true).order('plate'),db.from('drivers').select('*').eq('is_active',true).order('name'),db.from('delivery_orders').select('*').eq('delivery_date',day.value).neq('status','cancelled').order('created_at'),db.from('customers').select('id,name').eq('is_active',true)]);if(v.error||d.error||o.error||c.error)return alert((v.error||d.error||o.error||c.error).message);D={v:v.data||[],d:d.data||[],o:o.data||[],c:c.data||[]};plan()}function plan(){let total=D.o.reduce((a,o)=>a+Number(o.total_kg||0),0),assigned=D.o.filter(o=>o.vehicle_id),unassigned=D.o.filter(o=>!o.vehicle_id),cap=D.v.reduce((a,v)=>a+Number(v.capacity_kg||0),0);stats.innerHTML=`<div class="card"><small>Toplam teslimat</small><div class="v">${D.o.length}</div></div><div class="card"><small>Toplam kg</small><div class="v">${total.toLocaleString('tr-TR')} kg</div></div><div class="card"><small>Araç kapasitesi</small><div class="v">${cap.toLocaleString('tr-TR')} kg</div></div><div class="card"><small>Atanan</small><div class="v oktext">${assigned.length}</div></div><div class="card"><small>Atanmamış</small><div class="v ${unassigned.length?'over':''}">${unassigned.length}</div></div>`;app.innerHTML=`<div class="grid">${D.v.map(v=>vehicleCard(v)).join('')}</div><div class="panel"><h3>⚠️ Atanmamış teslimatlar</h3>${unassigned.map(o=>row(o)).join('')||'<p class="oktext">Tüm teslimatlar araçlara atanmış.</p>'}</div>`}function vehicleCard(v){let rows=D.o.filter(o=>o.vehicle_id===v.id),kg=rows.reduce((a,o)=>a+Number(o.total_kg||0),0),cap=Number(v.capacity_kg||0),pct=cap?kg/cap*100:0;return`<div class="card"><h2>🚐 ${esc(v.plate)}</h2><small>${esc(v.name||'')} · ${esc(v.brand||'')} ${esc(v.model||'')}</small><div style="margin:12px 0"><b>${kg.toLocaleString('tr-TR')} / ${cap?cap.toLocaleString('tr-TR'):'—'} kg</b> · <span class="${cap&&kg>cap?'over':'oktext'}">${cap?Math.round(pct)+'%':''}</span></div>${rows.map(o=>row(o)).join('')||'<p>Bu araç boş.</p>'}</div>`}function row(o){return`<div class="row"><div><b>${esc(cname(o.customer_id))}</b><br><small>${Number(o.total_kg||0).toLocaleString('tr-TR')} kg · ${esc(dn(o.driver_id))} · ${statuses[o.status]||o.status}</small></div><button class="btn dark" onclick="edit('${o.id}')">Düzenle</button></div>`}function edit(id){let o=D.o.find(x=>x.id===id);modal.innerHTML=`<div class="box"><h2>${esc(cname(o.customer_id))}</h2><p>${Number(o.total_kg||0).toLocaleString('tr-TR')} kg · ${esc(o.address||'Adres yok')}</p><label>Araç</label><select id="veh"><option value="">Atama yok</option>${D.v.map(v=>`<option value="${v.id}" ${o.vehicle_id===v.id?'selected':''}>${esc(v.plate)} · ${Number(v.capacity_kg||0).toLocaleString('tr-TR')} kg</option>`).join('')}</select><label>Şoför</label><select id="drv"><option value="">Atama yok</option>${D.d.map(v=>`<option value="${v.id}" ${o.driver_id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select><br><br><button class="btn ok" onclick="save('${id}')">Kaydet</button> <button class="btn" onclick="close()">İptal</button></div>`;modal.classList.remove('hidden')}async function save(id){let r=await db.from('delivery_orders').update({vehicle_id:veh.value||null,driver_id:drv.value||null}).eq('id',id);if(r.error)return alert(r.error.message);close();load()}async function autoPlan(){if(!D.v.length)return alert('Önce araç tanımlayın.');let vs=D.v.map(v=>({v,kg:0}));for(const o of D.o.filter(x=>!x.vehicle_id)){let kg=Number(o.total_kg||0),target=vs.filter(x=>!x.v.capacity_kg||x.kg+kg<=Number(x.v.capacity_kg)).sort((a,b)=>a.kg-b.kg)[0];if(target){target.kg+=kg;let driver=D.d.find(d=>!D.o.some(x=>x.vehicle_id===target.v.id&&x.driver_id===d.id));let r=await db.from('delivery_orders').update({vehicle_id:target.v.id,driver_id:driver?.id||null}).eq('id',o.id);if(r.error)return alert(r.error.message)}}load()}function printPlan(){let old=document.body.innerHTML;let content=document.querySelector('.wrap').innerHTML;document.body.innerHTML='<div style="padding:20px">'+content+'</div>';window.print();location.reload()}function close(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
