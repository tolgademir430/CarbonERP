<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Tahsilat Defteri</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.v{font-size:23px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#087443;color:#fff}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:10px}.box{background:#fff;padding:18px;border-radius:16px;width:min(620px,100%)}.hidden{display:none}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>💰 Tahsilat Defteri</h1><p>Bu ekran yalnızca <b>collections</b> tablosuna tahsilat kaydeder. Cari bakiye ve raporlar aynı kaydı kullanır.</p><div class="grid" id="stats"></div><div class="card"><input id="q" placeholder="Müşteri ara" oninput="render()"><select id="filter" onchange="render()"><option value="all">Tümü</option><option value="open">Açık</option><option value="overdue">Vadesi geçen</option></select></div><div class="card" id="list"></div></main><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let sales=[],customers=[],collections=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const name=id=>customers.find(c=>c.id===id)?.name||'Müşteri';async function load(){let [a,b,c]=await Promise.all([db.from('sales').select('id,customer_id,total,due_date,payment_type,status').neq('status','cancelled'),db.from('customers').select('id,name').eq('is_active',true).order('name'),db.from('collections').select('id,customer_id,sale_id,amount,collection_date,payment_type,status').eq('status','completed').order('collection_date',{ascending:false})]);if(a.error||b.error||c.error)return alert((a.error||b.error||c.error).message);sales=a.data||[];customers=b.data||[];collections=c.data||[];render()}function paid(id){return collections.filter(x=>x.sale_id===id).reduce((n,x)=>n+Number(x.amount||0),0)}function render(){let total=sales.reduce((n,x)=>n+Number(x.total||0),0),col=collections.reduce((n,x)=>n+Number(x.amount||0),0),open=total-col,over=sales.reduce((n,x)=>{let r=Number(x.total||0)-paid(x.id);return n+(r>0&&x.due_date&&new Date(x.due_date)<new Date()?r:0)},0);stats.innerHTML=`<div class="card"><small>Satış</small><div class="v">${money(total)}</div></div><div class="card"><small>Tahsilat</small><div class="v">${money(col)}</div></div><div class="card"><small>Açık alacak</small><div class="v">${money(open)}</div></div><div class="card"><small>Vadesi geçen</small><div class="v">${money(over)}</div></div>`;let q=(document.getElementById('q').value||'').toLocaleLowerCase('tr-TR'),f=document.getElementById('filter').value;list.innerHTML=sales.map(s=>{let n=name(s.customer_id),p=paid(s.id),r=Number(s.total||0)-p,ov=r>0&&s.due_date&&new Date(s.due_date)<new Date();if(q&&!n.toLocaleLowerCase('tr-TR').includes(q))return'';if(f==='open'&&r<=0)return'';if(f==='overdue'&&!ov)return'';return`<div class="row"><span><b>${esc(n)}</b><br><small>Satış ${money(s.total)} · Tahsil ${money(p)} · Kalan ${money(r)} · Vade ${esc(s.due_date||'—')}</small></span>${r>0?`<button class="btn" onclick="collect('${s.id}')">Tahsilat</button>`:'Tamamlandı'}</div>`}).join('')||'<p>Kayıt yok.</p>'}function collect(id){let s=sales.find(x=>x.id===id),r=Number(s.total)-paid(id);modal.innerHTML=`<div class="box"><h2>${esc(name(s.customer_id))}</h2><p>Kalan bakiye: <b>${money(r)}</b></p><input id="amt" type="number" min="0.01" max="${r}" step="0.01" placeholder="Tutar"><br><br><button class="btn" onclick="save('${id}',${r})">Kaydet</button> <button class="btn" style="background:#667085" onclick="closeM()">Kapat</button></div>`;modal.classList.remove('hidden')}async function save(id,max){let s=sales.find(x=>x.id===id),amount=Number(amt.value);if(!amount||amount<=0||amount>max)return alert('Tutar kalan bakiyeyi aşamaz.');let r=await db.from('collections').insert({customer_id:s.customer_id,sale_id:id,collection_date:new Date().toISOString().slice(0,10),payment_type:s.payment_type||'cash',amount,status:'completed'});if(r.error)return alert(r.error.message);closeM();load()}function closeM(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
