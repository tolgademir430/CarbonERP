<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Ürün Kartları</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1250px;margin:auto;padding:18px}.toolbar,.formgrid{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,.formgrid input,.formgrid select,.formgrid textarea{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.toolbar input{min-width:250px}.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:850;cursor:pointer}.ok{background:#087443;color:#fff}.dark{background:#172033;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:13px}.num{font-size:22px;font-weight:900}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.muted{color:#667085}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:12px}.box{background:#fff;width:min(800px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px}.hidden{display:none}.formgrid{display:grid;grid-template-columns:repeat(2,1fr)}.formgrid label{display:flex;flex-direction:column;gap:5px;font-weight:750;font-size:13px}.full{grid-column:1/-1}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:430px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>📦 Ürün Kartları</h1><p class="muted">Ürünleri yazılıma müdahale etmeden buradan ekle, düzenle ve yönet.</p><div class="stats" id="stats"></div><div class="card"><div class="toolbar"><input id="q" placeholder="Ürün adı veya kodu ara" oninput="render()"><select id="status" onchange="render()"><option value="active">Aktif ürünler</option><option value="all">Tüm ürünler</option><option value="passive">Pasif ürünler</option></select><button class="btn ok" onclick="openForm()">+ Yeni Ürün</button></div></div><div class="card tablewrap"><table><thead><tr><th>#</th><th>Kod</th><th>Ürün</th><th>Kategori</th><th>Birim</th><th>Alış</th><th>Satış</th><th>Stok</th><th>Min.</th><th>Durum</th><th></th></tr></thead><tbody id="list"></tbody></table></div></main><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let rows=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const r=await db.from('products').select('id,name,unit,is_active,product_code,description,category,brand,purchase_price,sale_price,min_stock,stock_quantity,vat_rate,notes,created_at,updated_at').order('name');if(r.error)return alert(r.error.message);rows=r.data||[];render()}function render(){let t=rows.filter(x=>status.value==='all'||(status.value==='active'?x.is_active:!x.is_active));const s=(q.value||'').toLocaleLowerCase('tr-TR');if(s)t=t.filter(x=>(x.name+' '+(x.product_code||'')).toLocaleLowerCase('tr-TR').includes(s));stats.innerHTML=`<div class="stat"><small>Toplam ürün</small><div class="num">${rows.length}</div></div><div class="stat"><small>Aktif</small><div class="num">${rows.filter(x=>x.is_active).length}</div></div><div class="stat"><small>Düşük stok</small><div class="num">${rows.filter(x=>x.is_active&&Number(x.stock_quantity)<Number(x.min_stock)).length}</div></div><div class="stat"><small>Pasif</small><div class="num">${rows.filter(x=>!x.is_active).length}</div></div>`;list.innerHTML=t.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.product_code||'—')}</td><td><b>${esc(x.name)}</b><br><small>${esc(x.brand||'')} ${esc(x.description||'')}</small></td><td>${esc(x.category||'—')}</td><td>${esc(x.unit)}</td><td>${money(x.purchase_price)}</td><td>${money(x.sale_price)}</td><td>${Number(x.stock_quantity||0).toLocaleString('tr-TR')}</td><td>${Number(x.min_stock||0).toLocaleString('tr-TR')}</td><td>${x.is_active?'Aktif':'Pasif'}</td><td><button class="btn dark" onclick="openForm('${x.id}')">Düzenle</button></td></tr>`).join('')||'<tr><td colspan="11">Ürün bulunamadı.</td></tr>'}function openForm(id){const x=rows.find(a=>a.id===id)||{name:'',unit:'kg',is_active:true,product_code:'',description:'',category:'',brand:'',purchase_price:0,sale_price:0,min_stock:0,stock_quantity:0,vat_rate:0,notes:''};modal.innerHTML=`<div class="box"><h2>${id?'Ürün Kartını Düzenle':'Yeni Ürün Kartı'}</h2><div class="formgrid"><label>Ürün adı<input id="name" value="${esc(x.name)}"></label><label>Ürün kodu<input id="code" value="${esc(x.product_code)}"></label><label>Kategori<input id="category" value="${esc(x.category)}"></label><label>Marka<input id="brand" value="${esc(x.brand)}"></label><label>Birim<select id="unit"><option ${x.unit==='kg'?'selected':''}>kg</option><option ${x.unit==='adet'?'selected':''}>adet</option><option ${x.unit==='ton'?'selected':''}>ton</option><option ${x.unit==='çuval'?'selected':''}>çuval</option></select></label><label>KDV %<input id="vat" type="number" min="0" value="${Number(x.vat_rate||0)}"></label><label>Alış fiyatı<input id="purchase" type="number" min="0" step="0.01" value="${Number(x.purchase_price||0)}"></label><label>Varsayılan satış fiyatı<input id="sale" type="number" min="0" step="0.01" value="${Number(x.sale_price||0)}"></label><label>Mevcut stok<input id="stock" type="number" min="0" step="0.001" value="${Number(x.stock_quantity||0)}"></label><label>Minimum stok<input id="min" type="number" min="0" step="0.001" value="${Number(x.min_stock||0)}"></label><label class="full">Açıklama<textarea id="desc">${esc(x.description)}</textarea></label><label class="full">Notlar<textarea id="notes">${esc(x.notes)}</textarea></label><label>Durum<select id="active"><option value="true" ${x.is_active?'selected':''}>Aktif</option><option value="false" ${!x.is_active?'selected':''}>Pasif</option></select></label></div><br><button class="btn ok" onclick="save('${id||''}')">Kaydet</button> <button class="btn" onclick="closeForm()">Kapat</button></div>`;modal.classList.remove('hidden')}async function save(id){const name=document.getElementById('name').value.trim();if(!name)return alert('Ürün adı zorunlu.');const payload={name,product_code:document.getElementById('code').value.trim()||null,category:document.getElementById('category').value.trim()||null,brand:document.getElementById('brand').value.trim()||null,unit:document.getElementById('unit').value,purchase_price:Number(document.getElementById('purchase').value)||0,sale_price:Number(document.getElementById('sale').value)||0,stock_quantity:Number(document.getElementById('stock').value)||0,min_stock:Number(document.getElementById('min').value)||0,vat_rate:Number(document.getElementById('vat').value)||0,description:document.getElementById('desc').value.trim()||null,notes:document.getElementById('notes').value.trim()||null,is_active:document.getElementById('active').value==='true'};let r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)return alert(r.error.message);closeForm();await load()}function closeForm(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
