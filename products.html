<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Ürünler</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin:12px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #d0d5dd;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.ok{background:#087443;color:#fff}.muted{color:#667085}.row{display:grid;grid-template-columns:1fr 110px 110px 130px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:12px}.box{background:#fff;width:min(520px,100%);padding:18px;border-radius:16px}.hidden{display:none}.box input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}@media(max-width:650px){.row{grid-template-columns:1fr}.row button{width:max-content}}</style></head><body><main class="wrap"><h1>📦 Ürünler</h1><p class="muted">Yeni ürünleri yazılıma müdahale etmeden buradan ekle, düzenle ve pasifleştir.</p><div class="card toolbar"><input id="search" placeholder="Ürün ara..." oninput="render()"><button class="btn ok" onclick="openForm()">+ Yeni Ürün</button></div><div class="card"><div id="list"></div></div></main><div id="modal" class="modal hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');let products=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){let r=await db.from('products').select('id,name,unit,is_active,created_at').order('name');if(r.error)return alert(r.error.message);products=r.data||[];render()}function render(){let q=(search.value||'').toLocaleLowerCase('tr-TR');let data=products.filter(p=>p.is_active&&p.name.toLocaleLowerCase('tr-TR').includes(q));list.innerHTML=data.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><br><small class="muted">Birim: ${esc(p.unit)}</small></div><span>Aktif</span><button class="btn" onclick="openForm('${p.id}')">Düzenle</button><button class="btn" onclick="deactivate('${p.id}')">Pasifleştir</button></div>`).join('')||'<p>Ürün bulunamadı.</p>'}function openForm(id){let p=products.find(x=>x.id===id)||{name:'',unit:'kg'};modal.innerHTML=`<div class="box"><h2>${id?'Ürün Düzenle':'Yeni Ürün'}</h2><label>Ürün adı</label><input id="pname" value="${esc(p.name)}" maxlength="120"><label>Birim</label><input id="punit" value="${esc(p.unit)}" maxlength="20"><button class="btn ok" onclick="save('${id||''}')">Kaydet</button> <button class="btn" onclick="closeForm()">İptal</button></div>`;modal.classList.remove('hidden')}async function save(id){let name=pname.value.trim(),unit=punit.value.trim()||'kg';if(!name)return alert('Ürün adı zorunlu.');let r=id?await db.from('products').update({name,unit,is_active:true}).eq('id',id):await db.from('products').insert({name,unit,is_active:true});if(r.error)return alert(r.error.message);closeForm();load()}async function deactivate(id){if(!confirm('Bu ürünü pasifleştirmek istediğine emin misin?'))return;let r=await db.from('products').update({is_active:false}).eq('id',id);if(r.error)return alert(r.error.message);load()}function closeForm(){modal.classList.add('hidden');modal.innerHTML=''}load();</script></body></html>
