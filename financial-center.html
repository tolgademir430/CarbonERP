<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonERP · Finansal Merkez</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.v{font-size:23px;font-weight:900}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{padding:9px;border:1px solid #d0d5dd;border-radius:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.green{color:#087443}.red{color:#b42318}.muted{color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}</style></head><body><main class="wrap"><h1>💰 Finansal Merkez</h1><p class="muted">Satış, tahsilat, alacak, maliyet ve giderleri aynı veri kaynağından hesaplar.</p><div class="toolbar"><input id="from" type="date"><input id="to" type="date"><button onclick="load()">Filtrele</button></div><section class="grid" id="cards"></section><section class="card"><h2>Müşteri Bazlı Cari Özet</h2><div id="customers"></div></section><section class="card"><h2>Finansal Kontroller</h2><div id="checks"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mrsnkzfoodryzyekuwyq.supabase.co','sb_publishable_oqB_eOPlpe5QoMZ9Y8TXtw_2jU9b-NS');const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let sales=[],cols=[],expenses=[],customersData=[];async function load(){let sf=from.value,st=to.value;let sq=db.from('sales').select('id,customer_id,sale_date,due_date,payment_type,total,cost_total,status').neq('status','cancelled');let cq=db.from('collections').select('id,customer_id,sale_id,collection_date,payment_type,amount,status').eq('status','completed');let eq=db.from('expenses').select('id,expense_date,category,amount');if(sf){sq=sq.gte('sale_date',sf);cq=cq.gte('collection_date',sf);eq=eq.gte('expense_date',sf)}if(st){sq=sq.lte('sale_date',st);cq=cq.lte('collection_date',st);eq=eq.lte('expense_date',st)}let [a,b,c,d]=await Promise.all([sq,cq,eq,db.from('customers').select('id,name').eq('is_active',true)]);if(a.error||b.error||c.error||d.error)return alert((a.error||b.error||c.error||d.error).message);sales=a.data||[];cols=b.data||[];expenses=c.data||[];customersData=d.data||[];render()}function render(){let saleTotal=sales.reduce((n,x)=>n+Number(x.total||0),0),cost=sales.reduce((n,x)=>n+Number(x.cost_total||0),0),col=cols.reduce((n,x)=>n+Number(x.amount||0),0),exp=expenses.reduce((n,x)=>n+Number(x.amount||0),0),receivable=saleTotal-col,profit=saleTotal-cost-exp;cards.innerHTML=`<div class="card"><small>Ciro</small><div class="v">${money(saleTotal)}</div></div><div class="card"><small>Tahsilat</small><div class="v green">${money(col)}</div></div><div class="card"><small>Açık alacak</small><div class="v red">${money(receivable)}</div></div><div class="card"><small>Net sonuç</small><div class="v ${profit>=0?'green':'red'}">${money(profit)}</div></div>`;let map={};sales.forEach(s=>{let k=s.customer_id||'none';if(!map[k])map[k]={sale:0,col:0,cost:0};map[k].sale+=Number(s.total||0);map[k].cost+=Number(s.cost_total||0)});cols.forEach(c=>{let k=c.customer_id||'none';if(!map[k])map[k]={sale:0,col:0,cost:0};map[k].col+=Number(c.amount||0)});customers.innerHTML=Object.entries(map).map(([id,x])=>{let n=customersData.find(c=>c.id===id)?.name||'Müşteri';return`<div class="row"><span><b>${esc(n)}</b><br><small>Satış ${money(x.sale)} · Tahsilat ${money(x.col)} · Kalan ${money(x.sale-x.col)}</small></span><b>${money(x.sale-x.col)}</b></div>`}).join('')||'<p>Kayıt yok.</p>';let checks=[];if(receivable<0)checks.push('<span class="red">⚠ Tahsilat satış toplamını aşmış görünüyor.</span>');else checks.push('<span class="green">✓ Tahsilat toplamı satış toplamını aşmıyor.</span>');let orphan=cols.filter(c=>c.sale_id&&!sales.some(s=>s.id===c.sale_id));checks.push(orphan.length?`<span class="red">⚠ ${orphan.length} tahsilat artık satış kaydına bağlı değil.</span>`:'<span class="green">✓ Tahsilatların satış bağlantıları tutarlı.</span>');checks.push(`<span class="muted">Gider: ${money(exp)} · Maliyet: ${money(cost)} · Kâr marjı: ${saleTotal?((profit/saleTotal)*100).toFixed(2):'0.00'}%</span>`);checks.innerHTML=checks.join('<br>')}const now=new Date(),iso=d=>d.toISOString().slice(0,10);to.value=iso(now);from.value=iso(new Date(now.getFullYear(),now.getMonth(),1));load();</script></body></html>
